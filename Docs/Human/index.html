    "id": "modules-towerdefense-md",
    "group": "模块",
    "title": "塔防模块",
    "path": "Modules/TowerDefense.md",
    "summary": "塔防业务模块入口。",
    "content": "# Tower Defense Module\n\n本文记录塔防业务模块入口。产品边界见 `Docs/Product/TowerDefenseMode.md`。\n\n## 目录\n\n```text\nAssets/Scripts/Game/TowerDefense\n  AbilityAdapters\n  Base\n  Battle\n  Effects\n  Enemy\n  Messages\n  Settlement\n  Targeting\n  Tower\n  Wave\n```\n\n相关旧目录仍存在：\n\n```text\nAssets/Scripts/Game/Tower\nAssets/Scripts/Game/Wave\nAssets/Scripts/Game/Battle\n```\n\n## 地图入口\n\n经营大地图和塔防战斗地图统一由 `MapManager.Instance` 加载，但使用两个语义明确的入口：\n\n```csharp\nMapManager.Instance.LoadWorldMap(worldMapId);\nMapManager.Instance.LoadBattleMap(mapConfigId);\n```\n\n- 经营主界面的正式入口是 `WorldMainPanel/RightBar/BattleEntry`，当前默认加载 `map.xlsx` 的 `30950001`。\n- `LoadWorldMap` 接收世界地图 id，加载 `Assets/Data/Map/{worldMapId}.json`，创建经营运行时并显示 `WorldMainPanel`。\n- `LoadBattleMap` 接收 `map.xlsx` 的配置 id，通过 `MapConfig.MapId` 定位地图 JSON，初始化战斗金币、基地、波次和 `BattlePage`。\n- 战斗内重开和下一关分别使用 `RestartCurrentBattleMap`、`LoadNextBattleMap`；相关 API 保留 `Battle` 语义。\n- 两个入口继续复用 `MapManager.LoadMapData`、地图索引和 `CreateMap`。不要新增含糊的 `LoadMap` 入口。\n- 当前只维护一个 `MapManager.CurrentMap`。不要把 World / Battle 拆成两套同时存在的地图运行时状态；如果以后确实需要双地图常驻，再提取共享的 `MapRuntimeContext`。\n- `MapManager` 使用 `partial` 按职责组织：`MapManager.World.cs` 放经营地图入口与后处理，`MapManager.Battle.cs` 放塔防入口、HUD 和关卡导航，`MapManager.Loading.cs` 放共用数据加载，`MapManager.Persistence.cs` 放地图移除物存档；`MapManager.cs` 保留共享状态、地图生成、索引和查询。\n\n## UI 资源\n\n```text\nAssets/Arts/UI/Panels/Battle        BattlePage、战斗 Popup、子 Prefab 和模块图片\nAssets/Arts/UI/Icons/Towers         防御塔图标\nAssets/Arts/UI/Icons/Skills         战斗技能图标\n```\n\n旧路径 `Assets/Arts/UI/TowerDefense` 已停用。Prefab 运行时路径、本地化绑定工具、AssetBundle 收集配置以及 `tower.xlsx` / `skill.xlsx` 必须使用上面的新路径。\n\n## 战斗 UI 结构\n\n`BattlePage.prefab` 是完整战斗流程的 `UIPage`。`TopPanel`、建塔、道具、目标信息、技能、战斗控制和小地图分别是内嵌 `UIPanel`，由 `UIEmbeddedPanelGroup` 统一传递生命周期；Panel 内的 Slot、进度条、卡片和模型描述组件使用 `MonoBehaviour`。`TopPanel` 按当前 Prefab 的 `Base/Hp`、`Coin`、`Wave`、`Enemy` 层级显式绑定，避免依赖同名节点扫描。\n\n建塔列表的公共 `TowerCard.prefab` 根节点挂一个 `TooltipTrigger`，由 `TowerBuildCardView` 在 `Init` 中统一执行一次 `tooltipTrigger.Bind(CreateTooltipData)`；这段绑定属于可复用的卡片类型，不是为每座塔实例分别编写。`CreateTooltipData` 按实例的 `TowerId` 读取内容，名称和描述分别使用 `localization.xlsx` 中的 `tower.{id}.name`、`tower.{id}.desc`。不增加 Tooltip 专用 Excel 表，也不为每种塔创建不同的卡片 Prefab。\n\n`BattleControlPanel/SystemButton` 复用经营大地图的系统菜单 `WorldMenuPanel.prefab`，通过 `PanelManager` 打开；语言和音量继续进入同一套 Menu 子面板与共享设置 API。结算仍是独立 Popup：\n\n```text\nAssets/Arts/UI/Panels/Menu/MenuPanel.prefab\nBattleResultPopup.prefab\n```\n\n同一个 `WorldMenuPanel` 会按运行模式切换入口：\n\n- 经营大地图显示 `Save`，隐藏 `Retreat`。\n- 战场显示 `Retreat`，隐藏 `Save`；战斗过程中不能从系统菜单存档。\n- `Retreat` 的中文统一为“撤退”，不使用含义过弱的“返回大地图”，也不使用可能被理解为正常结算的 `Finish`。\n- 点击撤退必须先确认；确认文案明确说明当前战斗立即结束且不获得本场奖励。确认后调用 `MapManager.RetreatFromBattle()` 清理战斗运行时并重新加载进入战斗前的世界地图，不触发胜利、失败或奖励结算流程。\n- Prefab 节点为 `MenuPanel/Content/Scroll View/Viewport/Content/Retreat`，序列化字段为 `WorldMenuPanel.retreatButton`。菜单入口必须存在于 Prefab，运行时只切换显隐，不创建或克隆该入口。\n\n撤退相关文本来自 `localization.xlsx`：\n\n```text\nui.td.menu.retreat\nui.td.menu.retreat_confirm_message\nui.common.cancel\n```\n\n战斗 UI 的运行时节点引用必须全部来自 Prefab 序列化。`BattleUiPrefabBinder` 负责一次性绑定和校验 Prefab；运行时代码不得用名称或层级扫描兜底。\n\n目标操作区属于 `InfoPanel/Action`，使用 Prefab 中预先制作的 `Action1`、`Action2`、`Action3` 三个按钮，不在运行时创建或克隆按钮。目标配置只填写 `actionGroupId`，`battle_target_action.xlsx` 决定该组包含哪些动作；点击目标后再根据实时状态过滤动作，没有动作时隐藏整个 `Action`。当前塔组 `100` 包含升级和出售：升级同时要求 `tower.canUpgrade` 且 `tower_level.xlsx` 存在下一级，价格读取下一级的 `upgradeCostItemId/upgradeCost`；出售要求当前等级 `sellGoldRate > 0`，返还金额按等级数据实时计算。动作表不重复保存价格或出售金额。\n\n`ItemPanel` 是与 `InfoPanel` 平级的独立道具面板，只显示当前持有且可在战斗中使用的道具；目标操作与道具使用不共享组件或事件。\n\n当前已接入暂停、倍速、音量持久化、语言切换、自动下一波、技能冷却、目标信息、道具执行器入口和世界血条。暂停控制在运行时显示 `PauseButton`，暂停后切换为 `PlayButton`，恢复时回到暂停图标。小地图仍保持禁用，不属于当前实现范围。目标模型预览使用 `BattleTargetPreviewDescriptor` 显式声明 Renderer、Animator 和需要禁用的运行时组件，并使用独立 Layer/Camera/Light culling mask。\n\n当前数据约束：\n\n- `tbitem.json` 的 27 项物品目前全部是 `useScope = 0`，因此战斗道具栏已具备校验、扣除和处理器注册链路，但还没有可实际释放的战斗道具；新增战斗物品时必须同时配置使用范围并注册对应处理器。\n- `tbnpc.json` 仍有 NPC 引用 `Assets/Arts/Character/Pirate/Pirate_Male.prefab`，仓库当前没有该 Prefab。NPC 数据修复前，目标模型预览会回退到图标，且使用该 NPC 的战斗生成也需要资源侧补齐。\n- `NotoSansSC-Regular SDF` 使用动态 atlas；`BattleUiPrefabBinder` 会保证 atlas 纹理可读，避免战斗 Popup 新增中文字符时生成失败。\n\n## NPC 动画\n\n塔防 NPC 动画由 `Assets/Scripts/Game/TowerDefense/Enemy/NpcAnimationController.cs` 管理，不复用经营玩家的 `ActionController`。\n\n```text\nWalk   Bool     控制移动循环\nAttack Trigger  播放攻击动作\nDie    Trigger  播放死亡动作\n```\n\n死亡动作通过 Animator 状态进度等待完成，超时使用 `Time.unscaledTime`，NPC 销毁时通过 cancellation token 终止等待。Animator 生成工具和运行时代码必须使用相同的 `Walk / Attack / Die` 参数名。\n\n## 与 Ability\n\n新塔防技能优先走 Ability 系统，塔防对象通过 `Assets/Scripts/Game/AbilityAdapters` 适配到 Ability core。\n\n## 与经营\n\n- 塔防结算奖励写回经营长期系统。\n- 塔防单局状态不要直接混进经营存档。\n- 经营建筑和塔防防御塔可以共享配置概念，但 manager 和运行时状态要分开。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },
  {
    "id": "decisions-0001-naming-rules-md",
    "group": "决策",
    "title": "0001 命名规则",
    "path": "Decisions/0001-naming-rules.md",
    "summary": "命名规则：新代码默认不加 World / Game。",
    "content": "# 0001 Naming Rules\n\n## 结论\n\n新代码默认不要加 `World` 或 `Game` 前缀。\n\n只有在确实需要和塔防单局、框架通用能力、存档数据等概念区分时，才使用更明确的业务前缀。\n\n## 旧名字\n\n已有类名短期保留，不因为命名规则单独重命名：\n\n```text\nWorldMainPanel\nWorldBagPanel\nWorldBuildPanel\nWorldFarmPanel\nWorldProductionPanel\nWorldToolKitPanel\nWorldTopBarPanel\nWorldBottomBarPanel\nWorldEntryBarPanel\nWorldRightBarPanel\nWorldBuildingDetailPanel\nWorldBuildingManager\nWorldFloatingPanelLayout\n```\n\n这些类可能被 Prefab、存档或其它引用绑定。不要为了命名洁癖移动、重命名或删 `.meta`。\n\n原 `WorldGameplayController` 已在职责拆分时迁移为无前缀结构：\n\n```text\nGameplayController\nNavigationController\nActionController\nResourceInteractionController\nPlacementController\nCameraController\nBuildingPreview\nFarmAreaPreview\n```\n\n物品管理已完成职责迁移：\n\n```text\n原塔防 ItemManager      -> BattleItemManager\n原 WorldItemManager     -> ItemManager\n原 WorldItem            -> ItemStack\n```\n\n`ItemManager` 表示跨场景持久物品；`BattleItemManager` 只保存单场塔防资源。不要新增 `ItemUseManager`，物品使用入口由 `ItemManager.Use` 统一提供。\n\n`GameplayController` 只负责 Unity 生命周期、输入优先级和公开接口转发；不要再把寻路、动作时序、资源结算或预览对象状态写回入口类。\n\n## Luban / Excel\n\n新增 Luban 表、Excel 文件、生成配置类和表访问名也默认不要加 `World` 或 `Game` 前缀。\n\n`resource`、`gather`、`reward` 已经从旧 `world_*` 表名迁移为无前缀命名：\n\n```text\nresource.xlsx\ngather.xlsx\nreward.xlsx\nResourceConfig\nGatherConfig\nRewardConfig\nTbResource\nTbGather\nTbReward\n```\n\n仍保留的 `world_*` Excel 和 `World*Config` 表是历史命名，短期不要因为命名规则单独迁移：\n\n```text\nworld_building.xlsx\nWorldBuildingConfig\n```\n\n新增工具配置不要照着旧历史表名写成：\n\n```text\nworld_tool.xlsx\nWorldToolConfig\nTbWorldTool\n```\n\n应使用：\n\n```text\ntool.xlsx\nToolConfig\nTbTool\n```\n\n如果后续要覆盖刀剑、弓、盾、护甲等完整装备，不要命名为 `WorldEquipment`，优先使用：\n\n```text\nequipment.xlsx\nEquipmentConfig\nTbEquipment\n```\n\n## Quest\n\n任务域使用 `Quest`，不要改成 `Task`，也不要加 `World`：\n\n```text\nQuestManager\nQuestConfig\nQuestData\nQuestState\nQuestEvent\nQuestCompletedMessage\nQuestToastListener\n```\n\n避免：\n\n```text\nWorldQuestManager\nGameQuestManager\nTaskManager\nWorldTaskManager\n```\n\n## Blueprint\n\n制作和生产配置使用 `Blueprint`：\n\n```text\nBlueprintManager\nBlueprintConfig\nBlueprintItem\nQuestObjectiveType.Blueprint\n```\n\n不要新增 `Recipe` 或 `WorldRecipe` 作为同义概念。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },
  {
    "id": "decisions-0002-ui-kind-usage-md",
    "group": "决策",
    "title": "0002 UI 类型使用",
    "path": "Decisions/0002-ui-kind-usage.md",
    "summary": "Page、Panel、Popup、Overlay、Toast 的使用决策。",
    "content": "# 0002 UI Kind Usage\n\n## 结论\n\nUI 类型按功能语义选择，不按当前文件名硬套。\n\n```text\nPage     全屏大流程\nPanel    当前流程上的浮动功能面板\nPopup    必须先处理的小确认或详情\nOverlay  全局覆盖、阻塞或转场\nToast    自动消失的小提示\nTooltip  延迟显示、不中断输入的悬浮说明\n```\n\n## 当前归类\n\nPage：\n\n```text\n经营主界面\n塔防主界面\n登录 / 主菜单 / 加载\n```\n\nPanel：\n\n```text\nBuild\nToolKit\nFarm\nProduction\nQuest\nTechTree\nMenu\n```\n\nPopup：\n\n```text\nConfirm\nItemDetail\nTechUnlock\n```\n\nOverlay：\n\n```text\nLoading\n转场黑屏\n网络等待\n强制输入阻塞\n```\n\nToast：\n\n```text\n保存成功\n资源不足\n获得物品\n科技解锁成功\n```\n\nTooltip：\n\n```text\n物品 / 工具属性\n技能说明\n建筑和科技节点说明\n按钮用途与快捷键\n```\n\nTooltip 使用全局唯一 `TooltipView`，不为每个按钮创建独立 UI 层；目标只挂轻量 `TooltipTrigger` 或直接调用 `TooltipManager`。Tooltip 不进入 Popup / Panel 的关闭和 blocker 逻辑。\n\nSound、Language、Save 不是 Toast。\n\nPage 内部子节点：\n\n```text\nBottomBar / Bag\n```\n\n## Stack 与 Exclusive\n\nStack 用于 panel 级返回历史。Exclusive 用于同级互斥。两者不等价。\n\n主界面 Build、ToolKit、Production、Quest、TechTree、Menu 使用 Exclusive。Bag 是 BottomBar 内部节点，由经营 UI 业务层在打开其它浮层时协调关闭，不注册框架 Exclusive。\n\nMenu -> Sound -> 返回 Menu 这类，如果 Sound 是独立 `UIPanel`，可以短期使用 Stack。如果 Sound 只是 Menu 内部设置页，应该作为 Menu 内部子节点，由 Menu 脚本控制。\n\n## 子节点\n\n不要为了 Stack 强行把普通子节点拆成多个 `UIPanel`。如果多个 panel 都稳定需要内部节点栈或内部节点互斥，再抽轻量组件。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },
  {
    "id": "decisions-0003-map-object-vs-marker-md",
    "group": "决策",
    "title": "0003 地图对象与标记",
    "path": "Decisions/0003-map-object-vs-marker.md",
    "summary": "地图真实对象与 UI 标记的边界。",
    "content": "# 0003 Map Object Vs Marker\n\n## 结论\n\n`MapData.Objects` 表示地图上真实存在、需要实例化或影响占用和交互的对象。\n\n纯 UI 标记、导航、任务提示、商店图标等表现数据，后续应进入 `MapMarkerData` 或等价结构，不要塞进 `MapData.Objects`。\n\n## MapData.Objects\n\n适合：\n\n```text\nDecoration\nResource\nBuilding\nInteractable\n```\n\n这些对象可能需要：\n\n```text\n创建场景视图\n注册地图占用\n参与采集或交互\n存档同步\n```\n\n运行时规则：\n\n```text\nMapData.Objects 会进入 MapManager 的 objectsByCoord 索引\n寻路和建造占用看 objectsByCoord，不看 view 是否隐藏\n逻辑上消失的对象应 TryRemoveMapObject + MarkMapObjectRemoved\n只是 UI 提示或导航点的内容不要放入 MapData.Objects\n```\n\n如果对象以后会回来，或只是阶段性隐藏，应使用运行时状态和存档状态表达，不要把纯显示隐藏当成地图逻辑删除。\n\n## MapMarkerData\n\n建议字段：\n\n```text\nMarkerId\nType: Shop / Building / Quest / NpcSpawn / Teleport / Custom\nCoord 或 X/Y/Z\nIcon\nVisibleDefault\nRelatedQuestId\nRelatedNpcId\n```\n\n它服务小地图、大地图、导航和任务提示，不一定生成场景对象。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },
  {
    "id": "audits-projectmidpointaudit-2026-07-09-md",
    "group": "审核",
    "title": "项目中期审核",
    "path": "Audits/ProjectMidpointAudit-2026-07-09.md",
    "summary": "2026-07-09 中期代码、文档、配置和工具审核。",
    "content": "# Project Midpoint Audit - 2026-07-09\n\n本文记录项目中期审核结果。目标是帮助后续开发知道当前哪些链路已经闭合，哪些只是能编译但产品规则还没完成，哪些文档或旧代码会误导新对话。\n\n## 审核范围\n\n本次检查覆盖：\n\n```text\nDocs\nAssets/Scripts/Framework/UI\nAssets/Scripts/Game/UI/Management\nAssets/Scripts/Game/Story\nAssets/Scripts/Game/Quests\nAssets/Scripts/Game/Blueprints\nAssets/Scripts/Game/Island\nAssets/Scripts/Tools/Editor\nAssets/Scripts/Game/Data/Editor\nData/Excel\nData/Defines\nAssets/Data/Bin\nAssets/Data/Json\n```\n\n验证命令：\n\n```text\ndotnet build Cube.sln\n```\n\n结果：构建通过，0 个错误，5 个警告。\n\n## 总体结论\n\n项目当前处于“核心方向已经成形，但若干玩法闭环还没完成”的阶段。\n\n已经比较稳定的部分：\n\n- 文档入口已经按 Codex / 人类阅读拆分。\n- Quest / Blueprint / Story 已接入正式 Luban 表。\n- UI 框架的 outside close、Exclusive group、Stack group 当前代码和文档基本一致。\n- WorldMainPanel 的 Top / Bottom / Entry / Right / BuildingDetail 子模块已改为 prefab 上的 MonoBehaviour 引用，不再由 `WorldMainPanel` 手动 `new`。\n- Bag / Build / ToolKit / Production / Quest / TechTree / Menu 已进入同一个经营浮动互斥组。\n\n需要优先补齐的部分：\n\n- Story 中途存档恢复逻辑不完整。\n- Quest / Story / Blueprint 缺少配置校验工具。\n- 部分 UI 面板仍靠运行时 `Transform.Find` 绑定稳定节点，后续 UI 打磨时应继续改成序列化字段。\n\n## Findings\n\n### P1\n\n当前没有发现阻塞构建或明显会让主流程无法启动的 P1 问题。\n\n### Fixed - Quest 领取奖励\n\n原问题：\n\n```text\nAssets/Scripts/Game/Quests/QuestManager.cs:76     QuestConfig.RewardGroupId\nTryClaim 只把任务改成 Claimed，没有发放 RewardGroupId\nQuest UI 奖励数量固定显示 \"x1\"\n```\n\n处理结果：\n\n- `QuestManager.TryClaim` 使用 `RewardResolver` 解析 `RewardGroupId`。\n- 有奖励组时走 `BagManager.TryAddItems`，背包容量不足不会改为 `Claimed`。\n- 奖励组为空时领取失败，避免误把任务标记为已领取。\n- Quest UI 详情奖励行读取 `reward`，显示固定数量或 `min-max` 范围。\n\n剩余：\n\n- 任务奖励 Toast / 获得反馈还需要产品表现设计。\n\n### P2 - Story 中途读档会恢复 currentStoryId，但不会恢复面板和行号\n\n证据：\n\n```text\nAssets/Scripts/Game/Story/StoryManager.cs:49   currentStoryId = data.CurrentStoryId\nAssets/Scripts/Game/Story/StoryManager.cs:252  CanStart 要求 currentStoryId == 0\nAssets/Scripts/Game/Story/StoryPanel.cs:114    当前 UI 运行时创建，没有存行号\n```\n\n影响：\n\n- 如果保存时 `currentStoryId != 0`，读档后不会自动重新打开 StoryPanel，也没有当前行索引。\n- 同时 `currentStoryId != 0` 会阻止其它 Story 开始。\n\n建议：\n\n- 短期方案：如果不支持剧情中途保存，就不要把未完成 Story 写入存档，读档时置 0。\n- 完整方案：保存 `CurrentStepIndex`，读档后通过 `StoryPresenter` 恢复 UI。\n\n### P2 - Quest / Story / Blueprint 缺少配置校验\n\n证据：\n\n```text\nAssets/Scripts/Game/Data/Editor/WorldConfigValidator.cs  当前主要校验世界建筑 / 科技关系\nDocs/Architecture/ModuleWorkMap.md                     Story 备注为没有专门编辑器或校验器\nDocs/Modules/QuestStoryBlueprint.md                    奖励和配置规范仍需完善\n```\n\n影响：\n\n- 当前表已经数据驱动，但跨表引用错误更容易进入运行时才发现。\n- 比如 Quest Objective 指向不存在的 Blueprint、Story 触发事件 target 不存在、RewardGroupId 没有奖励项。\n\n建议：\n\n- 增加轻量 `ProgressionConfigValidator` 或扩展现有 validator。\n- 至少校验：Quest 前置、Objective target、RewardGroupId、Blueprint inputs / outputs、Story nextStoryId、Story 完成事件。\n\n### Fixed - Luban 编辑器工具硬编码本机路径\n\n原证据：\n\n```text\nLubanTool 使用本机 D 盘绝对路径定位 Data / Excel / Defines / gen_all.bat\n```\n\n原影响：\n\n- 当前机器可用，但换目录、换电脑或 CI 会失败。\n- 文档建议使用 `Luban/Update All`，工具本身应该能从 Unity project root 推导路径。\n\n处理结果：\n\n- `LubanTool` 已从 `Application.dataPath` 推导 project root。\n- `Data`、`Excel`、`Defines`、`gen_all.bat` 都按项目相对路径组合。\n\n### P3 - 管理 UI 面板仍有运行时 Transform.Find\n\n证据示例：\n\n```text\nAssets/Scripts/Game/UI/Management/QuestPanel.cs:50\nAssets/Scripts/Game/UI/Management/QuestPanel.cs:64\nAssets/Scripts/Game/UI/Management/WorldBuildPanel.cs:71\nAssets/Scripts/Game/UI/Management/WorldToolKitPanel.cs:71\nAssets/Scripts/Game/UI/Management/WorldProductionPanel.cs:68\nAssets/Scripts/Game/UI/Management/WorldBagPanel.cs:57\n```\n\n影响：\n\n- 当前不一定是 bug，但和“稳定 UI 节点用 prefab 序列化字段绑定”的方向不一致。\n- Prefab 节点改名会在运行时才失败。\n\n建议：\n\n- 区分两类节点：\n  - 稳定按钮、标题、根节点：改成 `[SerializeField]`。\n  - 动态生成列表、slot 内部兼容旧 prefab 的临时适配：可以先保留。\n- 后续改某个 panel UI 时顺手收敛，不必一次性大改全部。\n\n### P3 - Menu 子页面当前能走 Stack，但长期结构要再决定\n\n当前代码：\n\n```text\nMenu -> Sound\nMenu -> Language\nMenu -> Save\nMenu -> GM\n```\n\n实现方式：\n\n```text\nWorldMenuPanel.PushStackAsync(SettingsStackGroupId, MenuPanel)\nWorldMenuPanel.PushStackAsync(SettingsStackGroupId, childPanel)\nSound / Language / Save / GM close 时 PopStack\n```\n\n判断：\n\n- 作为短期方案可运行，符合当前 UI 框架的 panel-level Stack 语义。\n- 如果 Sound / Language / Save 只是 Menu 的内部设置页，长期更适合做成 Menu prefab 内序列化子节点，由 Menu 脚本维护本地 node stack。\n- GM 如果仍是调试大面板，可以继续保留独立 Panel。\n\n### P3 - StoryPanel 仍是运行时构建 UI\n\n证据：\n\n```text\nAssets/Scripts/Game/Story/StoryPanel.cs:114  BuildIfNeeded\nAssets/Scripts/Game/Story/StoryPanel.cs:145  CreateText(\"Title\")\nAssets/Scripts/Game/Story/StoryPanel.cs:153  CreateText(\"Body\")\nAssets/Scripts/Game/Story/StoryPanel.cs:168  CreateButton(\"ContinueButton\")\n```\n\n判断：\n\n- 当前功能可用，文档已经说明不要假设 prefab 内有固定节点。\n- 后续如果要做正式剧情 UI，应迁移为 prefab 节点 + 序列化字段。\n\n### P3 - 构建警告\n\n`dotnet build Cube.sln` 通过，但有 5 个警告：\n\n```text\nAssets/Scripts/Framework/UI/Samples/Example/Scripts/SettingsPopup.cs:8  nullable annotation context\nAssets/Scripts/Framework/UI/Samples/Example/Scripts/SidePanel.cs:8      nullable annotation context\nAssets/Scripts/Game/TowerDefense/Tower/TowerBuildInputController.cs:13  hides MonoSingleton.Initialize()\nAssets/Scripts/Game/TowerDefense/Enemy/NpcManager.cs:264               call is not awaited\nAssets/Scripts/Framework/Event/Samples/EventView.cs:20                 assigned but unused\n```\n\n建议：\n\n- Samples 警告低优先。\n- `TowerBuildInputController.Initialize()` 如果是有意隐藏，显式加 `new`；否则改名或调整继承。\n- `NpcManager.cs:264` 需要确认是否故意 fire-and-forget，若是则用 `.Forget()` 或显式注释。\n\n## 本次已整理\n\n删除未引用旧代码：\n\n```text\nAssets/Scripts/Game/UI/Management/WorldQuestPanel.cs\nAssets/Scripts/Game/UI/Management/WorldQuestPanel.cs.meta\nAssets/Scripts/Game/Story/StoryData.cs\nAssets/Scripts/Game/Story/StoryData.cs.meta\nAssets/Scripts/Game/Tasks\nAssets/Scripts/Game/Tasks.meta\n```\n\n理由：\n\n- `WorldQuestPanel` 没有调用方，也没有 prefab 引用；当前主任务面板是 `QuestPanel`。\n- 旧 `Game/Story/StoryData.cs` 没有调用方；实际存档模型是 `StorageManager.StoryData`，通过 `SaveData.Story` 使用。\n- `Assets/Scripts/Game/Tasks` 是空旧目录，和当前 `Quests` 业务目录冲突。\n\n更新文档：\n\n```text\nDocs/Modules/Story.md\nDocs/Architecture/CodebaseOverview.md\nDocs/README.md\nDocs/CodexProjectMemory.md\nDocs/Human/build-human-docs.ps1\n```\n\n本轮继续修正：\n\n```text\nAssets/Scripts/Game/Save/SaveData.cs\nAssets/Scripts/Game/Story/StoryManager.cs\nAssets/Scripts/Game/Quests/QuestManager.cs\nAssets/Scripts/Game/UI/Management/QuestSlotView.cs\nAssets/Scripts/Tools/Editor/LubanTool.cs\nDocs/Modules/QuestStoryBlueprint.md\nDocs/Product/ProgressionAndQuests.md\nDocs/Architecture/DataPipeline.md\nDocs/Architecture/SaveSystem.md\n```\n\n## 文档一致性检查\n\n已经对齐：\n\n- 新代码默认不加 `World` / `Game` 前缀，旧 `World*` 可保留。\n- 游戏任务系统使用 `Quest`，不是 `Task`。\n- 制作 / 生产配置使用 `Blueprint`，不是 `Recipe`。\n- Quest / Blueprint / Story 的 Excel、Defines、Bin、Json、Generated 代码均存在。\n- UI Framework 文档和当前 `PanelManager` 的 Stack / Exclusive 实现基本一致。\n\n仍需注意：\n\n- `Framework/Task` 是 C# async helper，不是业务任务系统。\n- 不要重新创建 `Assets/Scripts/Game/Tasks` 作为游戏任务系统入口。\n- 新 UI 文本规则要求进入 `localization.xlsx`，但当前 Quest / Story 内容仍有部分配置文本 fallback，这是阶段性过渡。\n- 当前 shell 是 Windows PowerShell 5.1；复杂 `rg` 正则优先拆开或用单引号，避免双引号内反斜杠和管道被 PowerShell 预解析。\n\n## 建议的下一轮顺序\n\n1. 先规划 Story 中途保存策略：不保存未完成 Story，或完整恢复当前行。\n2. 增加 Progression 配置校验，覆盖 Quest / Story / Blueprint / Reward。\n3. 补任务奖励 Toast / 获得反馈。\n4. 后续每次改某个管理 UI panel 时，把该 panel 的稳定节点从 `Transform.Find` 收敛到序列化字段。\n\n\r\n\r\n"

    const navList = document.getElementById('navList');
    const searchInput = document.getElementById('searchInput');
    const reader = document.getElementById('reader');
    const toc = document.getElementById('toc');
    const docGroup = document.getElementById('docGroup');
    const docTitle = document.getElementById('docTitle');
    const docSummary = document.getElementById('docSummary');
    const docPath = document.getElementById('docPath');
    const rawLink = document.getElementById('rawLink');
    const openNavButton = document.getElementById('openNavButton');

    let activeDoc = docs[0];
    let activeHeading = '';
    const expandedDocOutlines = new Set();
    const docHeadingCache = new Map();

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function renderInline(text) {
      let html = escapeHtml(text);
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
        return `<a href="${escapeAttr(href)}">${label}</a>`;
      });
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return html;
    }

    function isTableLine(line) {
      const trimmed = line.trim();
      return trimmed.startsWith('|') && trimmed.endsWith('|');
    }

    function isSeparatorRow(line) {
      return /^\|?[\s:-]+\|[\s|:-]*$/.test(line.trim());
    }

    function splitTableRow(line) {
      return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
    }

    function markdownToHtml(markdown, options = {}) {
      const lines = markdown.replace(/\r\n/g, '\n').split('\n');
      const html = [];
      const headings = [];
      const collapsibleLevel3 = Boolean(options.collapsibleLevel3);
      let paragraph = [];
      let listType = '';
      let tableRows = [];
      let inCode = false;
      let codeLines = [];
      let codeLang = '';
      let detailsOpen = false;
      let currentSection = '';

      function flushParagraph() {
        if (!paragraph.length) return;
        html.push(`<p>${renderInline(paragraph.join(' '))}</p>`);
        paragraph = [];
      }

      function closeList() {
        if (!listType) return;
        html.push(`</${listType}>`);
        listType = '';
      }

      function flushTable() {
        if (!tableRows.length) return;
        const rows = tableRows.filter(row => !isSeparatorRow(row)).map(splitTableRow);
        tableRows = [];
        if (!rows.length) return;
        const head = rows[0];
        const body = rows.slice(1);
        const thead = `<thead><tr>${head.map(cell => `<th>${renderInline(cell)}</th>`).join('')}</tr></thead>`;
        const mergeFirstColumn = head.length === 3 &&
          head[0] === '分类' &&
          head[1] === '来源字段' &&
          head[2] === '关联目标';
        let bodyHtml = '';

        if (mergeFirstColumn) {
          for (let rowIndex = 0; rowIndex < body.length; rowIndex += 1) {
            const row = body[rowIndex];
            let firstCell = '';
            if (row[0]) {
              let rowSpan = 1;
              while (rowIndex + rowSpan < body.length && !body[rowIndex + rowSpan][0]) rowSpan += 1;
              firstCell = `<td class="merged-group-cell" rowspan="${rowSpan}">${renderInline(row[0])}</td>`;
            }

            bodyHtml += `<tr>${firstCell}<td>${renderInline(row[1] || '')}</td><td>${renderInline(row[2] || '')}</td></tr>`;
          }
        } else {
          bodyHtml = body.map(row => `<tr>${row.map(cell => `<td>${renderInline(cell)}</td>`).join('')}</tr>`).join('');
        }

        const tbody = `<tbody>${bodyHtml}</tbody>`;
        html.push(`<div class="table-wrap"><table>${thead}${tbody}</table></div>`);
      }

      function closeDetails() {
        if (!detailsOpen) return;
        html.push('</div></details>');
        detailsOpen = false;
      }

      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        const trimmed = line.trim();

        if (trimmed.startsWith('```')) {
          if (inCode) {
            html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
            inCode = false;
            codeLines = [];
            codeLang = '';
          } else {
            flushParagraph();
            closeList();
            flushTable();
            inCode = true;
            codeLang = trimmed.slice(3).trim();
          }
          continue;
        }

        if (inCode) {
          codeLines.push(line);
          continue;
        }

        if (!trimmed) {
          flushParagraph();
          closeList();
          flushTable();
          continue;
        }

        if (isTableLine(line)) {
          flushParagraph();
          closeList();
          tableRows.push(line);
          const next = lines[index + 1] || '';
          if (!isTableLine(next)) flushTable();
          continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          closeList();
          flushTable();
          const level = heading[1].length;
          const text = heading[2].trim();
          const id = `heading-${headings.length + 1}`;
          if (level <= 3) closeDetails();
          if (level === 2) currentSection = text;
          if (level <= 3) headings.push({ id, level, text, section: currentSection });

          if (collapsibleLevel3 && level === 3) {
            html.push(`<details class="table-section" id="${id}"><summary><span class="table-section-title">${renderInline(text)}</span><span class="table-section-hint" aria-hidden="true"></span></summary><div class="table-section-body">`);
            detailsOpen = true;
            continue;
          }

          html.push(`<h${level} id="${id}">${renderInline(text)}</h${level}>`);
          continue;
        }

        const bullet = line.match(/^\s*-\s+(.+)$/);
        const numbered = line.match(/^\s*\d+\.\s+(.+)$/);
        if (bullet || numbered) {
          flushParagraph();
          flushTable();
          const type = bullet ? 'ul' : 'ol';
          if (listType && listType !== type) closeList();
          if (!listType) {
            listType = type;
            html.push(`<${type}>`);
          }
          html.push(`<li>${renderInline((bullet || numbered)[1])}</li>`);
          continue;
        }

        const quote = line.match(/^\s*>\s+(.+)$/);
        if (quote) {
          flushParagraph();
          closeList();
          flushTable();
          html.push(`<blockquote>${renderInline(quote[1])}</blockquote>`);
          continue;
        }

        const definition = line.match(/^:\s+(.+)$/);
        if (definition) {
          flushParagraph();
          closeList();
          flushTable();
          html.push(`<p class="definition">${renderInline(definition[1])}</p>`);
          continue;
        }

        paragraph.push(trimmed);
      }

      if (inCode) html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
      flushParagraph();
      closeList();
      flushTable();
      closeDetails();

      return { html: html.join('\n'), headings };
    }

    function renderTableIndex(headings) {
      const tableHeadings = headings.filter(item => item.level === 3);
      if (!tableHeadings.length) return '';

      const groups = tableHeadings.reduce((result, item) => {
        const section = item.section || '其他';
        if (!result.has(section)) result.set(section, []);
        result.get(section).push(item);
        return result;
      }, new Map());

      return `
        <nav class="table-index" aria-label="Excel 表目录">
          <div class="table-index-header">
            <p class="table-index-title">表目录</p>
            <p class="table-index-note">按业务查找配置表，点击表名后自动展开。</p>
          </div>
          <div class="table-index-table-wrap">
            <table class="table-index-table">
              <thead>
                <tr><th>分类</th><th>具体配置表</th></tr>
              </thead>
              <tbody>
                ${Array.from(groups.entries()).map(([section, items]) => `
                  <tr>
                    <th scope="row">${renderInline(section)}</th>
                    <td><div class="table-index-links">
                      ${items.map(item => `<a class="table-index-link" href="#${activeDoc.id}:${item.id}">${renderInline(item.text)}</a>`).join('')}
                    </div></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </nav>
      `;
    }

    function groupDocs(items) {
      return items.reduce((groups, doc) => {
        if (!groups.has(doc.group)) groups.set(doc.group, []);
        groups.get(doc.group).push(doc);
        return groups;
      }, new Map());
    }

    function matchesQuery(doc, query) {
      if (!query) return true;
      const haystack = `${doc.title}\n${doc.path}\n${doc.summary}\n${doc.content}`.toLowerCase();
      return haystack.includes(query.toLowerCase());
    }

    function getDocumentHeadings(doc) {
      if (!docHeadingCache.has(doc.id)) {
        docHeadingCache.set(doc.id, markdownToHtml(doc.content).headings);
      }

      return docHeadingCache.get(doc.id).filter(item => item.level === 2);
    }

    function renderNav() {
      const query = searchInput.value.trim();
      const filtered = docs.filter(doc => matchesQuery(doc, query));
      const groups = groupDocs(filtered);

      if (!filtered.length) {
        navList.innerHTML = '<div class="empty-state">没有匹配的文档</div>';
        return;
      }

      navList.innerHTML = Array.from(groups.entries()).map(([group, items]) => `
        <section class="nav-group">
          <div class="nav-group-title">${escapeHtml(group)} <span class="nav-count">${items.length}</span></div>
          <div class="nav-group-items">
            ${items.map(doc => {
              const headings = getDocumentHeadings(doc);
              const expanded = expandedDocOutlines.has(doc.id);
              return `
            <div class="doc-nav-entry ${headings.length ? 'has-outline' : ''} ${expanded ? 'outline-expanded' : ''}">
              <button class="doc-button ${doc.id === activeDoc.id ? 'active' : ''}" type="button" data-doc-id="${doc.id}">
                <strong>${escapeHtml(doc.title)}</strong>
                <span>${escapeHtml(doc.summary)}</span>
              </button>
              ${headings.length ? `
                <button class="doc-outline-toggle" type="button" data-doc-outline-toggle="${doc.id}" aria-label="${expanded ? '收起' : '展开'} ${escapeAttr(doc.title)} 的标题" aria-expanded="${String(expanded)}" title="${expanded ? '收起标题' : '展开标题'}">›</button>
                <div class="doc-outline">
                  ${headings.map(heading => `
                    <button class="doc-heading-button level-${heading.level} ${doc.id === activeDoc.id && heading.id === activeHeading ? 'active' : ''}" type="button" data-doc-id="${doc.id}" data-heading-id="${heading.id}">${escapeHtml(heading.text)}</button>
                  `).join('')}
                </div>
              ` : ''}
            </div>
            `;
            }).join('')}
          </div>
        </section>
      `).join('');
    }

    function renderToc(headings) {
      if (!headings.length) {
        toc.innerHTML = '<p class="toc-title">本文目录</p><p>没有可用标题</p>';
        return;
      }

      toc.innerHTML = `
        <p class="toc-title">本文目录</p>
        ${headings.map(item => `<a class="level-${item.level}" href="#${activeDoc.id}:${item.id}">${escapeHtml(item.text)}</a>`).join('')}
      `;
    }

    function renderDocument(doc, headingId = '') {
      activeDoc = doc;
      activeHeading = headingId;
      expandedDocOutlines.add(doc.id);
      const isExcelDictionary = doc.path === 'Architecture/ExcelDataDictionary.md';
      const result = markdownToHtml(doc.content, { collapsibleLevel3: isExcelDictionary });
      docHeadingCache.set(doc.id, result.headings);
      docGroup.textContent = `${doc.group} / ${doc.path}`;
      docTitle.textContent = doc.title;
      docSummary.textContent = doc.summary;
      docPath.textContent = doc.path;
      rawLink.href = `../${doc.path}`;
      reader.innerHTML = result.html;
      if (isExcelDictionary) {
        const firstSection = reader.querySelector('h2');
        if (firstSection) firstSection.insertAdjacentHTML('beforebegin', renderTableIndex(result.headings));
      }
      renderToc(isExcelDictionary ? result.headings.filter(item => item.level <= 2) : result.headings);
      renderNav();

      if (headingId) {
        requestAnimationFrame(() => {
          const target = document.getElementById(headingId);
          if (target) {
            if (target.matches('details')) target.open = true;
            const parentDetails = target.closest('details');
            if (parentDetails) parentDetails.open = true;
            target.scrollIntoView({ block: 'start' });
          }
        });
      } else {
        window.scrollTo({ top: 0, behavior: 'auto' });
      }
    }

    function findDoc(id) {
      return docs.find(doc => doc.id === id) || docs[0];
    }

    function parseHash() {
      const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
      const [docId, headingId] = raw.split(':');
      return { docId, headingId };
    }

    navList.addEventListener('click', event => {
      const outlineButton = event.target.closest('[data-doc-outline-toggle]');
      if (outlineButton) {
        const docId = outlineButton.dataset.docOutlineToggle;
        const entry = outlineButton.closest('.doc-nav-entry');
        const expanded = entry.classList.toggle('outline-expanded');
        outlineButton.setAttribute('aria-expanded', String(expanded));
        outlineButton.setAttribute('aria-label', `${expanded ? '收起' : '展开'}标题`);
        outlineButton.title = expanded ? '收起标题' : '展开标题';
        if (expanded) expandedDocOutlines.add(docId);
        else expandedDocOutlines.delete(docId);
        return;
      }

      const button = event.target.closest('[data-doc-id]');
      if (!button) return;
      const headingId = button.dataset.headingId || '';
      const hash = headingId ? `${button.dataset.docId}:${headingId}` : button.dataset.docId;
      if (decodeURIComponent(location.hash.replace(/^#/, '')) === hash) {
        renderDocument(findDoc(button.dataset.docId), headingId);
      } else {
        location.hash = hash;
      }
      document.body.classList.remove('nav-open');
    });

    searchInput.addEventListener('input', renderNav);

    openNavButton.addEventListener('click', () => {
      document.body.classList.add('nav-open');
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') document.body.classList.remove('nav-open');
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        searchInput.focus();
      }
    });

    window.addEventListener('hashchange', () => {
      const { docId, headingId } = parseHash();
      renderDocument(findDoc(docId), headingId || '');
    });

    const initial = parseHash();
    renderDocument(findDoc(initial.docId), initial.headingId || '');
  </script>
</body>
</html>
