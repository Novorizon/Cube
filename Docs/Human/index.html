    "summary": "地图运行时生成、MapData.Objects 和地图标记边界。",
    "content": "# Map Runtime\n\n本文记录地图运行时、地图对象、寻路、交互站位、资源移除和存档边界。地图美术见 `Docs/Modules/MapAndTileArt.md`，地图对象和 UI 标记边界见 `Docs/Decisions/0003-map-object-vs-marker.md`。\n\n## 运行时链路\n\n当前地图不是整张场景 Prefab，也不是把完整地图作为一个 Prefab 绑定到 UI 或场景中。\n\n```text\nAssets/Data/Map/{mapId}.json\n  -> MapData\n  -> MapManager.LoadWorldMap(mapId)\n     或 MapManager.LoadBattleMap(mapConfigId)\n  -> MapManager.LoadMapData(...)\n  -> ApplyRemovedMapObjects(...)\n  -> RebuildTileIndex()\n  -> RebuildObjectIndex()\n  -> WorldBuildingManager.RegisterMapObjects()\n  -> MapManager.CreateMap()\n  -> 根据 Cells / Objects / SpawnPoints / GoalPoint 动态生成地图视图\n```\n\n相关代码：\n\n```text\nAssets/Scripts/Game/Map/Runtime/MapManager.cs                # shared state, creation, indexes, queries\nAssets/Scripts/Game/Map/Runtime/MapManager.World.cs          # LoadWorldMap and world post-load flow\nAssets/Scripts/Game/Map/Runtime/MapManager.Battle.cs         # LoadBattleMap and battle flow/UI/navigation\nAssets/Scripts/Game/Map/Runtime/MapManager.Loading.cs        # shared JSON loading pipeline\nAssets/Scripts/Game/Map/Runtime/MapManager.Persistence.cs    # removed-map-object save state\nAssets/Scripts/Game/Map/Data/MapData.cs\nAssets/Scripts/Game/Map/Data/MapCellData.cs\nAssets/Scripts/Game/Map/Data/MapObjectData.cs\nAssets/Scripts/Game/Map/Pathfinding/MapPathFinder.cs\nAssets/Scripts/Game/Island/Exploration/GameplayController.cs\nAssets/Scripts/Game/Island/Exploration/NavigationController.cs\nAssets/Scripts/Game/Island/Exploration/ActionController.cs\nAssets/Scripts/Game/Island/Exploration/ResourceInteractionController.cs\n```\n\n## 数据分层\n\n地图相关数据分三层：\n\n```text\n静态地图数据\n  MapData.Cells\n  MapData.Objects\n  SpawnPoints / GoalPoint\n\n运行时索引和视图\n  tileDataMap / topLogicTileDataMap\n  objectsByCoord\n  TileView / WorldResourceView / building views\n\n长期存档状态\n  SaveRemovedMapObjectData\n  SaveGatherNodeData\n  SaveWorldBuildingData\n  SaveFarmData / SaveWorldFarmPlotData\n  SavePlayerData\n```\n\n`Renderer.enabled = false`、`Collider.enabled = false`、`GameObject.SetActive(false)` 只影响 Unity 视图和物理碰撞。当前寻路、建造占用和地图对象查询主要看 `MapManager` 的运行时索引，不看 view 是否隐藏。\n\n## MapData.Cells\n\n`Cells` 表示地形格子和逻辑属性：\n\n```text\n地形\n覆盖层\n是否可走\n是否可建\n移动成本\n高度 / 逻辑层\n```\n\n`MapManager.CreateMap()` 遍历 `Cells`，根据 `MapTilePrefabConfig` 找到地块资源并实例化运行时 `TileView`。\n\n当前 `MapManager.IsWalkable(coord)` 判断：\n\n```text\ncoord 在 tileDataMap 中\n是逻辑地块\n是 exposed 顶层逻辑格\n没有 BlocksMove 的地图对象\ntileData.IsRuntimeWalkable == true\n```\n\n当前 `MapManager.IsBuildable(coord)` 判断：\n\n```text\ncoord 在 tileDataMap 中\n是逻辑地块\n是 exposed 顶层逻辑格\n没有 BlocksBuild 的地图对象\ntileData.IsRuntimeBuildable == true\n```\n\n`GetMoveCost(coord)` 会先要求 `IsWalkable(coord)`，不可走时返回 `int.MaxValue`。\n\n## MapData.Objects\n\n`Objects` 表示地图上真实存在、需要生成视图或影响占用和交互的对象：\n\n```text\nDecoration\nResource\nBuilding\nInteractable\n```\n\n字段边界：\n\n```text\nObjectId      地图对象实例 id，同一张地图内应稳定唯一\nObjectType    Decoration / Resource / Building / Interactable\nConfigId      业务配置 id，例如 Resource 使用 resource.id\nX/Y/Z         对象所在逻辑格\nLocalPosition 对象相对格子的局部偏移\nLocalEuler    对象局部旋转\nLocalScale    对象局部缩放\nBlocksBuild   是否阻挡建造\nBlocksMove    是否阻挡移动\n```\n\n对象类别默认值：\n\n```text\n资源类别默认属性来自 Excel / Luban 配置，例如 resource.blocksBuild / resource.blocksMove。\n地图编辑器放置资源时默认使用 Excel 属性，只有需要单个对象特殊处理时才在编辑器里单独修改。\n当前 MapObjectData 保存的是最终 BlocksBuild / BlocksMove 值，不保存“是否覆盖”的三态信息。\n如果以后要求已放置对象自动跟随 Excel 默认值变化，需要新增覆盖标记或提供地图迁移工具。\n```\n\n`RebuildObjectIndex()` 会把 `MapData.Objects` 注册到 `objectsByCoord`。建筑等多格对象会按 footprint 注册到多个 coord。\n\n重要规则：\n\n```text\nobjectsByCoord 是当前寻路 / 建造 / 对象查询的主要占用索引\n隐藏 view 不会自动从 objectsByCoord 删除对象\n只有 MapManager.TryRemoveMapObject 会从 currentMap.Objects 和 objectsByCoord 移除对象\n```\n\n## 寻路规则\n\n当前经营模式角色移动使用格子 A*，不是 Unity NavMesh，也不是 Collider-based 寻路。\n\n```text\nNavigationController\n  -> MapPathFinder.TryFindPath(startCoord, goalCoord)\n  -> MapManager.GetMoveCost(toCoord)\n  -> MapManager.IsWalkable(toCoord)\n```\n\n当前 `MapPathFinder` 规则：\n\n```text\n四方向邻居：+X / -X / +Z / -Z\n不直接走对角\n邻居必须是 top logic tile\n邻居必须通过 MapPathConnectionRules.CanConnect\n邻居必须通过 MapManager.IsWalkable\n上坡额外消耗 UphillExtraCost = 5\n启发式使用 x/z/y 曼哈顿距离\n```\n\n路径平滑：\n\n```text\nNavigationController.UsePathSmoothing = true 时\nMapPathSmoother.SmoothBySupercoverLineOfSight 会减少中间路径点\nLine of sight 只允许同一 y 层\n沿线所有经过格仍必须通过 MapManager.IsWalkable\n```\n\n移动终点：\n\n```text\n普通移动：\n  点击地块时记录 raycast / 数学拾取的 world point\n  A* 仍以点击点所在 top logic tile 为 goal\n  最后一段移动终点使用点击 world point 的 X/Z，加角色站立高度\n\n格子回退移动：\n  SetPlayerDestination(coord)\n    -> MapManager.GetTileWorldPosition(coord)\n    -> 加角色高度偏移\n```\n\n也就是说，寻路目标仍是格子坐标，但最终移动点不一定是格中心。普通移动可以落到鼠标点击点；资源交互可以落到候选格内的动作站位。寻路系统本身不把“物体边缘外一点”作为 path node；物体边缘、交互距离、站位选择属于交互系统职责。\n\n## 交互站位\n\n点击资源时当前流程：\n\n```text\nResourceInteractionController.TryStartAtPointer\n  -> Start\n  -> TryMoveNearTarget\n  -> NavigationController.TryMoveToBestApproach\n  -> ActionController.TryStart(ActionRequest, ActionCallbacks)\n  -> OnMarker 结算拾取 / 采集 / 建矿\n  -> OnCompleted 结束动作或开始下一次采集\n```\n\n这里的 `OnMarker` 是 `ActionController` 根据 Animator `normalizedTime` 触发的一次性阶段回调，不是动画文件里的 `Animation Event`。完整定义、取消语义、当前 Marker 和 timeout 数值见 `Docs/Modules/Island.md` 的“动作阶段点”。\n\n`GetResourceInteractionPosition` 优先使用资源 Collider 的 `ClosestPoint`，否则使用地图对象坐标和局部偏移。这个点用于距离判断和转向，不是寻路算法的节点。\n\n当前交互距离：\n\n```text\nInteractionDistance = 1.35f\n```\n\n当前已实现的行为：\n\n```text\n如果点击时已经在交互距离内，立即停下并执行交互\n如果不在距离内，先从资源对象周围扫描可站立格\n候选格必须可走、可寻路到达，并且站在该格时处于 InteractionDistance 内\n在半径 MoveTargetSearchRadius 内选择路径成本较低的候选格作为 goal\n资源交互最终移动点可以是候选格内的自定义 world position，不强制走到格中心\n有自定义资源动作站位时，不因为刚进入最大 InteractionDistance 就提前执行，会继续走到站位附近\n没有自定义动作站位时，移动过程中一旦进入交互距离，会提前停下并执行交互\n每帧移动前也会先判断交互距离，避免已到交互范围后又被继续拉向格中心\n如果一直没提前进入距离，走到格子路径终点后再尝试执行\n```\n\n当前站位规则：\n\n```text\n不要把交互物体本身加入 path node\n物体通过 BlocksMove / BlocksBuild 参与阻挡\n交互系统从目标对象周围找可站立格\n对候选可站立格运行现有 MapPathFinder\n选择路径成本最低的格子作为 goal\n走到可站立格或中途进入交互距离后，转向目标并执行动作\n```\n\n当前候选站位以对象所在格为中心扫描外圈。以后资源支持多格 footprint 时，应改为取 footprint 外圈。\n\n## 资源生命周期\n\n当前资源分两类。\n\n拾取资源：\n\n```text\nBranch / Loose Stone 等\ninteractionType = Pickup\nPickupResource\n  -> BagManager.TryAddItems\n  -> RemoveResourceView\n  -> MapManager.TryRemoveMapObject\n  -> MapManager.MarkMapObjectRemoved\n  -> Destroy(resourceView.gameObject)\n```\n\n拾取后会从 `currentMap.Objects` 和 `objectsByCoord` 移除，并保存到 `SaveRemovedMapObjectData`。寻路、建造、点击查询都会认为它不存在。\n\n采集资源：\n\n```text\nTree / Rock 等\ninteractionType = Gather\nWorldGatherManager.TryGather\n  -> WorldGatherNodeState.Consume\n  -> RemainingTimes--\n  -> respawnSeconds <= 0 且耗尽：RemoveResourceView\n       -> MapManager.TryRemoveMapObject\n       -> MapManager.MarkMapObjectRemoved\n       -> Destroy(resourceView.gameObject)\n  -> respawnSeconds > 0 或未耗尽：resourceView.RefreshNow\n```\n\n当前规则：\n\n```text\nrespawnSeconds <= 0 的采集资源耗尽后，移除 MapObject 并保存 RemovedMapObjects\nrespawnSeconds > 0 的采集资源耗尽后，可以保留 MapObject，用 GatherNode 状态等待刷新\n```\n\n如果未来需要“资源耗尽后隐藏且未来刷新，同时耗尽期间不挡路”，需要新增运行时资源状态参与 `IsWalkable / IsBuildable`，例如：\n\n```text\nStage = Normal / Depleted / Growing / Hidden\nVisible\nCanInteract\nBlocksMove\nBlocksBuild\nRespawnAtUnixTime\n```\n\n这类状态应存在运行时动态数据里，需要跨存档恢复的字段进入存档。不要把这种运行时状态写回静态地图 JSON 或静态配置表。\n\n## 移除和隐藏规则\n\n逻辑上已经不存在的对象，应从地图对象数据和运行时索引移除：\n\n```text\n拾取后的树枝 / 散石 / 掉落物\n不刷新的树 / 石头 / 矿耗尽后\n拆除后的建筑\n清理后的障碍物\n一次性剧情物件\n玩家移除的装饰或地表物\n```\n\n移除流程：\n\n```text\nMapManager.TryRemoveMapObject(objectId)\nMapManager.MarkMapObjectRemoved(objectId)\nDestroy 或隐藏对应 view\nStorageManager.Save 时写入 SaveRemovedMapObjectData\n读档 LoadMapData 时 ApplyRemovedMapObjects\n```\n\n逻辑上暂时不可见但以后会回来，或仍要保留占用的对象，可以只隐藏 view，但必须明确其运行时状态：\n\n```text\n会刷新 / 再生的资源\n季节性显示对象\n成长阶段中的农作物\n剧情阶段暂时隐藏但以后还会出现的对象\n树桩 / 矿坑 / 废墟等仍需占地的残留物\n雾隐 / 视野隐藏的对象\n```\n\n只隐藏 view 时，要确认 `BlocksMove / BlocksBuild` 是否仍然符合产品规则。当前代码没有动态 BlocksMove 状态；只要 MapObject 仍在且阻挡字段为 true，就会继续阻挡。\n\n## 存档边界\n\n当前和地图相关的长期存档：\n\n```text\nSaveRemovedMapObjectData\n  MapId\n  ObjectId\n\nSaveGatherNodeData\n  ObjectId\n  GatherConfigId\n  RemainingTimes\n  AvailableAtUnixTime\n\nSaveWorldBuildingData\nSaveFarmData\nSaveWorldFarmPlotData\nSavePlayerData\n```\n\n边界：\n\n```text\nRemovedMapObjects 记录“这个地图对象已经被移除，不应从静态地图 JSON 恢复”\nGatherNodes 记录“这个采集节点仍在地图里，但采集次数 / 刷新时间改变”\nWorldBuildings 记录玩家建造的建筑运行时状态\nFarms / WorldFarmPlots 记录农田范围和作物状态\nPlayer 记录玩家位置和朝向\n```\n\n不要把普通运行时状态直接写回 `Assets/Data/Map/{mapId}.json`。静态地图 JSON 是地图初始状态；运行中变化通过 SaveData 表达。\n\n## 小地图和地图标记\n\n经营小地图应绑定 `MapManager.CurrentMap` 和运行时管理器数据。\n\n建议分层：\n\n```text\n底图层：由 MapData.Cells 生成，或使用预烘焙底图图片\n静态点层：商店、固定建筑、任务点、传送点等，加载地图时生成一次\n低频动态层：玩家建造建筑、任务状态变化后增删或换状态\n动态点层：玩家、NPC 等运行时位置，按帧或低频刷新坐标\n```\n\n后续如果需要大量纯标记点，新增 `MapMarkerData`：\n\n```text\nMarkerId\nType: Shop / Building / Quest / NpcSpawn / Teleport / Custom\nCoord 或 X/Y/Z\nIcon\nVisibleDefault\nRelatedQuestId\nRelatedNpcId\n```\n\n边界：\n\n```text\nMapData.Objects：真实存在、需要实例化或影响占用 / 交互 / 存档的对象\nMapMarkerData：地图 UI 标记、导航、任务提示、商店图标等表现数据\n```\n"
  },

    "title": "存档系统",
    "path": "Architecture/SaveSystem.md",
    "summary": "存档边界和 Calendar 存档规则。",
    "content": "# Save System\n\n本文记录当前存档边界。需要改具体存档字段时，先读代码。\n\n## 主要代码\n\n```text\nAssets/Scripts/Game/Save/SaveData.cs\nAssets/Scripts/Game/Save/StorageManager.cs\n```\n\n## Calendar 存档\n\n游戏内日历由 `CalendarManager` 管理：\n\n```text\nAssets/Scripts/Game/Island/Calendar/CalendarManager.cs\nAssets/Scripts/Game/Island/Calendar/Season.cs\n```\n\n相关存档字段：\n\n```text\nSaveData.SavedAtUnixTime\nSaveCalendarData.Year\nSaveCalendarData.Month\nSaveCalendarData.Day\nSaveCalendarData.Hour\nSaveCalendarData.Minute\nSaveCalendarData.AccumulatedRealSeconds\n```\n\n规则：\n\n- `SavedAtUnixTime` 记录真实保存时间。\n- `SaveCalendarData` 记录游戏内时间和残余累计秒。\n- `StorageManager.Load()` 读档后根据离线真实时间推进 `CalendarManager`。\n- UI 不维护独立时间，统一从 `CalendarManager` 读取。\n\n## 注意\n\n新增长期系统状态时，要明确它属于经营长期存档、塔防单局状态，还是纯 UI 临时状态。塔防单局金币、临时 Buff、波次进度不要直接混入长期经营库存。\n\n## 地图对象存档\n\n静态地图 JSON 表示地图初始状态。运行中被移除或状态改变的地图对象不要写回 `Assets/Data/Map/{mapId}.json`，应写入存档。\n\n当前地图相关字段：\n\n```text\nSaveData.RemovedMapObjects\nSaveData.GatherNodes\nSaveData.WorldBuildings\nSaveData.Farms\nSaveData.WorldFarmPlots\nSaveData.Player\n```\n\n边界：\n\n```text\nSaveRemovedMapObjectData\n  表示某张地图上的某个 MapObject 已经逻辑消失，读档时 ApplyRemovedMapObjects 会从 MapData.Objects 过滤掉。\n\nSaveGatherNodeData\n  表示采集节点仍在地图对象里，但 RemainingTimes / AvailableAtUnixTime 改变。\n\nSaveWorldBuildingData\n  表示玩家建造建筑的运行时状态。\n\nSaveFarmData / SaveWorldFarmPlotData\n  表示农田范围、地块和作物状态。\n\nSavePlayerData\n  表示玩家在地图中的位置和朝向。\n```\n\n规则：\n\n```text\n逻辑上已经不存在的对象：使用 MapManager.TryRemoveMapObject + MarkMapObjectRemoved，进入 RemovedMapObjects。\n仍在地图上、只是采集次数或刷新时间变化的资源：进入 GatherNodes。\n只隐藏 view 不等于从地图逻辑移除；寻路 / 建造仍看 MapManager 的对象索引。\n```\n\n## Story 存档\n\nStory 存档挂在：\n\n```text\nSaveData.Story\nStorageManager.StoryData\n```\n\n当前字段：\n\n```text\nCurrentStoryId\nCurrentStepIndex\nCompletedStoryIds\n```\n\n剧情 Step 改变时会保存 `CurrentStepIndex`。世界 UI 就绪后，`StoryManager.TryStartAutoStories()` 会先恢复未完成的 `CurrentStoryId`，并从该 Step 重新打开 StoryPanel；旧存档缺少字段时默认值为 0。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },

    "title": "消息系统",
    "path": "Architecture/Messaging.md",
    "summary": "消息系统使用边界和 Quest 消息。",
    "content": "# Messaging\n\n本文记录消息系统的使用边界。\n\n## 框架位置\n\n```text\nAssets/Scripts/Framework/Message\nAssets/Scripts/Game/Message\n```\n\nFramework 负责通用消息能力，Game 层定义业务消息和 topic。\n\n## Quest 相关消息\n\n任务系统当前重要消息：\n\n```text\nQuestAcceptedMessage\nQuestChangedMessage\nQuestCompletedMessage\n```\n\n`QuestManager` 负责发消息，UI、Toast、Story、引导、音频等系统按需要订阅。Toast 应该是监听器，不要写死在任务目标逻辑里。\n\n当前 topic 仍在 `WorldMessageTopic`，这是历史共享枚举；不要因此把 Quest 域类改成 `WorldQuest*`。\n\n## 使用原则\n\n- 消息用于跨模块通知，不用于替代清晰的同步 API。\n- 任务、剧情、UI 提示这类松耦合联动可以用消息。\n- 同一模块内部的直接状态变更优先用 manager 方法。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },
  {
    "id": "product-gameoverview-md",
    "group": "产品",
    "title": "游戏概览",
    "path": "Product/GameOverview.md",
    "summary": "项目整体方向和经营 / 塔防模式关系。",
    "content": "# Game Overview\n\n本文记录项目整体方向，适合先了解“这个游戏要做什么”。\n\n## 核心方向\n\n玩家漂流到岛上后，进入长期岛屿经营和生存建设。项目同时保留独立塔防战斗模式，两者通过资源、奖励、剧情和进度连接，但运行时状态分开。\n\n岛屿经营负责：\n\n```text\n长期资源和背包\n工具和采集\n农田和生产\n建筑建造 / 升级 / 产出\n科技树\n任务和剧情入口\n进入塔防前后的数据交换\n```\n\n塔防模式负责：\n\n```text\n单局波次\n敌人\n基地\n防御塔\n战斗内金币\n塔防内建塔 / 升级 / 出售\n结算奖励\n```\n\n## 当前开发重点\n\n当前重点不是塔防战斗本身，而是岛屿经营主循环：\n\n```text\n开场 Story\n  -> 接取第一个 Quest\n  -> 采集资源\n  -> 制作 Blueprint\n  -> 建造 / 农田 / 工具 / 科技\n  -> 解锁更多内容\n```\n\n## 设计边界\n\n- 经营长期库存和塔防单局资源要分开。\n- 配置可共享，但运行时状态不要混用。\n- UI 类型按 `Docs/Architecture/UIFramework.md` 的 Page / Panel / Popup / Overlay / Toast 选择。\n- 命名按 `Docs/Decisions/0001-naming-rules.md`，新代码默认不要加 `World` 或 `Game` 前缀。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },
  {
    "id": "product-managementmode-md",
    "group": "产品",
    "title": "经营模式",
    "path": "Product/ManagementMode.md",
    "summary": "岛屿经营模式的产品范围和当前缺口。",
    "content": "# Management Mode\n\n本文记录岛屿经营模式的产品和业务边界。\n\n## 范围\n\n岛屿经营模式负责长期局外进度：\n\n```text\n资源和背包\n工具\n采集\n农田\n建筑建造 / 升级 / 生产\n科技树\n任务和剧情入口\n塔防战斗前后的奖励和消耗\n```\n\n## 当前系统\n\n物品和资源：\n\n```text\nAssets/Scripts/Game/Island/Resources\nAssets/Scripts/Game/Items\nData/Excel/item.xlsx\n```\n\n工具和采集：\n\n```text\nAssets/Scripts/Game/Island/Tools\nAssets/Scripts/Game/Island/Exploration\nData/Excel/gather.xlsx\nData/Excel/resource.xlsx\n```\n\n农田：\n\n```text\nAssets/Scripts/Game/Island/Farming\nData/Excel/world_crop.xlsx\n```\n\n建筑和生产：\n\n```text\nAssets/Scripts/Game/Island/Buildings\nAssets/Scripts/Game/Blueprints\nData/Excel/world_building.xlsx\nData/Excel/world_building_level.xlsx\nData/Excel/world_building_income.xlsx\nData/Excel/world_cost.xlsx\nData/Excel/reward.xlsx\n```\n\n科技：\n\n```text\nAssets/Scripts/Game/Island/Tech\nData/Excel/tech_node.xlsx\n```\n\n## 当前缺口\n\n```text\n任务奖励 Toast / 获得反馈\n新手开局完整体验打磨\n更多工具等级：石斧 -> 铜斧 -> 铁斧等\n农田产出、成熟、补种等长期规则打磨\n科技树和生产链的内容扩展\n```\n\n## UI\n\n经营 UI 见 `Docs/Modules/ManagementUI.md`。UI 互斥、返回栈和关闭规则见 `Docs/Architecture/UIFramework.md`。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },
  {
    "id": "product-towerdefensemode-md",
    "group": "产品",
    "title": "塔防模式",
    "path": "Product/TowerDefenseMode.md",
    "summary": "塔防模式范围和与经营模式的边界。",
    "content": "# Tower Defense Mode\n\n本文记录塔防模式边界。\n\n## 范围\n\n塔防模式负责单局战斗：\n\n```text\n波次\n敌人\n基地\n防御塔\n战斗内金币\n塔防内建塔 / 升级 / 出售\n技能和效果\n结算\n```\n\n## 代码位置\n\n```text\nAssets/Scripts/Game/TowerDefense\nAssets/Scripts/Game/Tower\nAssets/Scripts/Game/Wave\nAssets/Scripts/Game/Battle\nAssets/Scripts/Game/AbilityAdapters\nAssets/Scripts/Ability\nAssets/Scripts/Skill\n```\n\n## 进入战斗\n\n塔防关卡统一通过实例入口加载：\n\n```csharp\nMapManager.Instance.LoadBattleMap(mapConfigId);\n```\n\n`mapConfigId` 是 `map.xlsx` 的配置 id。经营大地图使用 `MapManager.Instance.LoadWorldMap(worldMapId)`，不要用无模式语义的 `LoadMap` 混用两种流程。\n\n经营主界面通过 `RightBar/BattleEntry` 进入战斗，当前入口加载默认关卡配置 `30950001`。战斗 UI 位于 `Assets/Arts/UI/Panels/Battle`。\n\n战斗主界面是 `BattlePage`。其内部功能区是由 Page 统一管理生命周期的多个 Panel；系统菜单复用经营模式的 `WorldMenuPanel`，战斗结算使用独立模态 Popup。战场菜单隐藏存档并显示“撤退”；撤退需要二次确认，结束当前战斗且不发放奖励。当前小地图入口保留但默认关闭，其余战斗 HUD 模块进入正式功能闭环。\n\n## 与经营模式的边界\n\n- 塔防单局金币不直接等于长期经营库存。\n- 塔防内建塔不直接复用经营建筑管理器。\n- 结算奖励需要通过明确接口写回经营长期资源。\n- 技能系统优先走 Ability，旧 Skill 作为兼容层保留一段时间。\n\nAbility 细节见 `Docs/Modules/AbilityAndSkill.md`。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },
  {
    "id": "product-progressionandquests-md",
    "group": "产品",
    "title": "成长与任务",
    "path": "Product/ProgressionAndQuests.md",
    "summary": "开局、任务、剧情和奖励流程。",
    "content": "# Progression And Quests\n\n本文记录剧情、任务和制作在产品流程中的位置。Story 实现细节见 `Docs/Modules/Story.md`，Quest / Blueprint 实现细节见 `Docs/Modules/QuestStoryBlueprint.md`。\n\n## 推荐开局链路\n\n```text\n玩家新开局\n  -> StoryManager 自动开始开场 Story\n  -> 玩家点击继续\n  -> Story 完成\n  -> StoryManager 发送 QuestEventType.CustomFlag + StoryFlags.OpeningFinished\n  -> QuestManager 接取匹配配置的第一个任务\n  -> 玩家拾取开局散落资源\n  -> BlueprintManager 完成制作\n  -> QuestManager 更新任务\n```\n\n第一个正式任务建议由开场剧情结束触发，而不是直接监听建造 House。\n\n当前第一版开局链路：\n\n```text\n60000001 Scavenge the Shore      ItemGainCount Wood 6 + Stone 4\n60000002 Build a House           BuildBuildingType House\n60000003 Craft a Basic Axe       Blueprint 30600001\n60000004 Chop Down a Tree        ItemGainCount Wood 6\n60000005 Craft a Basic Pickaxe   Blueprint 30600002\n60000006 Break Rocks             ItemGainCount Stone 4\n60000007 Build a Workbench       BuildBuildingType Workbench\n```\n\n开局地图对应：\n\n```text\nAssets/Data/Map/1001.json 是 GameEntry 当前默认世界地图。\n地图对象使用 MapObjectData.ObjectType = Resource + ConfigId = resource.id。\n30300008 Branch      -> pickupRewardGroupId 30902015 -> Wood\n30300009 Loose Stone -> pickupRewardGroupId 30902016 -> Stone\n30300001 Tree        -> gatherConfigId 30400001 -> Wood，需要斧\n30300002 Rock        -> gatherConfigId 30400002 -> Stone，需要镐\n```\n\n`ItemGainCount` 统计的是获得物品事件，不绑定地图对象实例。只要地图编辑器放的是对应 `resource.id`，任务就能推进。\n\n开局工具制作：\n\n```text\n30600001 Stone Axe     buildingId = 0，不需要 Workbench\n30600002 Stone Pickaxe buildingId = 0，不需要 Workbench\n```\n\n这类 `buildingId = 0` 的基础工具用于开局教学，直接在 QuestPanel 详情按钮点击“制作”完成。后续需要建筑参与的生产蓝图，再通过对应建筑详情面板制作。\n\n## 任务顺序\n\n不要设计通用的“开始下一个任务”作为核心 API。任务顺序由配置的 `preQuestIds` 和触发条件控制。\n\n## 奖励\n\n任务奖励当前通过 `quest.rewardGroupId` 指向 `reward.groupId`。\n\n领取流程：\n\n```text\nQuestManager.TryClaim\n  -> RewardResolver.GetRewardGroup\n  -> BagManager.TryAddItems\n  -> 成功后改为 Claimed\n```\n\n当前规则：\n\n- 没有奖励组的任务可以直接领取。\n- 配了奖励组但找不到奖励，领取失败。\n- 背包容量不足时领取失败，不会提前改为 `Claimed`。\n\n后续仍需继续打磨：\n\n```text\nToast / UI 反馈\n奖励配置规范\n是否需要任务奖励专用弹窗\n```\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },
  {
    "id": "modules-island-md",
    "group": "模块",
    "title": "岛屿经营模块",
    "path": "Modules/Island.md",
    "summary": "岛屿经营业务模块、工具、农田、建筑和 Calendar。",
    "content": "# Island Module\n\n本文记录岛屿经营业务模块。\n\n## 目录\n\n```text\nAssets/Scripts/Game/Island\n  Buildings\n  Calendar\n  Exploration\n  Farming\n  Gathering\n  Income\n  Mining\n  Production\n  Resources\n  Tech\n  Tools\n  Workers\n  WorldMessage.cs\n```\n\n## 资源和背包\n\n长期经营库存使用：\n\n```text\nAssets/Scripts/Game/Items/ItemManager.cs\nAssets/Scripts/Game/Items/ItemStack.cs\n```\n\n全项目物品定义：\n\n```text\nData/Excel/item.xlsx\nAssets/Scripts/Game/Items/ItemIds.cs\n```\n\n塔防单局物品或金币由 `BattleItemManager` 保存，不要直接复用为长期库存。塔防结算时应通过明确奖励流程写回 `ItemManager`。\n\n物品使用规则：\n\n```text\nBag / HotBar 点击 -> BagManager.TryUseSlot -> ItemManager.Use\n工具点击只完成选择，不算真实使用\n未配置效果的食物、消耗品或其它物品返回失败\n采集、建矿、开垦、种植成功后，由业务完成点调用 ItemManager.NotifyUseCompleted\nQuestEventType.UseItem 只记录已经完成的使用，不负责执行物品效果\n```\n\n## 采集和工具\n\n采集相关：\n\n```text\nAssets/Scripts/Game/Island/Exploration/GameplayController.cs\nAssets/Scripts/Game/Island/Exploration/NavigationController.cs\nAssets/Scripts/Game/Island/Exploration/ActionController.cs\nAssets/Scripts/Game/Island/Exploration/ResourceInteractionController.cs\nAssets/Scripts/Game/Island/Exploration/PlacementController.cs\nAssets/Scripts/Game/Island/Tools/ActionToolResolver.cs\nAssets/Scripts/Game/Island/Tools/ToolKitDefinitions.cs\nAssets/Scripts/Game/Island/Tools/ToolKitManager.cs\n```\n\n当前工具规则：\n\n```text\n树 -> 斧\n石头 / 矿 -> 镐\n农田开垦 -> 锄\n钓鱼 -> 鱼竿\n```\n\nToolKit 当前能力：\n\n```text\n默认 10 个格子\n新存档默认工具槽为空\n获得工具时自动放入 ToolKit 并选中；加载已有存档时，也会把已拥有的工具补入空槽\n只允许使用玩家实际拥有的工具；旧存档里只有槽位但没有对应物品时不能使用\n可点击选择工具\n可拖动到空格\n可拖动到另一个工具上交换\n```\n\n开局地图资源和任务对应：\n\n```text\nMapObjectData.ObjectType = Resource\nMapObjectData.ConfigId = resource.id\n\n30300008 Branch      -> 拾取 -> Wood\n30300009 Loose Stone -> 拾取 -> Stone\n30300001 Tree        -> 斧采集 -> Wood\n30300002 Rock        -> 镐采集 -> Stone\n```\n\n资源生命周期和寻路关系见 `Docs/Architecture/MapRuntime.md`。当前关键规则：\n\n```text\n寻路 / 建造占用看 MapManager 的 objectsByCoord，不看 WorldResourceView 是否隐藏\n拾取资源成功后会 TryRemoveMapObject + MarkMapObjectRemoved\n采集资源 respawnSeconds <= 0 且耗尽后会 TryRemoveMapObject + MarkMapObjectRemoved\n采集资源 respawnSeconds > 0 耗尽后保留 MapObject，用 GatherNode 等待刷新\n资源交互会先从目标周围选择可走、可到达、在交互距离内的站位，再移动执行动作\nGameplayController 只路由输入和生命周期；NavigationController 负责移动，ActionController 负责动作阶段，ResourceInteractionController 负责资源结算\n采集工具动作只使用 Assets/Arts/Character/Player 内的玩家动画资源；当前 UseTool 使用 Meshy_AI_Forestbound_Adventure_biped_Animation_Heavy_Hammer_Swing_withSkin.fbx，但必须通过 WorldPlayer.controller 的 UseTool Upper Body 层和 WorldPlayer_UseToolUpperBody.mask 播放，只影响手臂/手指，避免 Heavy_Hammer_Swing 的全身后撤姿态把角色视觉上弹出去。不要引用 Assets/Arts/FBX/CharacterFBX 的其他角色动作，也不要叠加额外程序化采集动作\n```\n\n`ActionController` 的上层入口统一为：\n\n```csharp\nbool TryStart(ActionRequest request, ActionCallbacks callbacks = default);\nbool Stop(ActionStopReason reason, ActionExitMode exitMode);\n```\n\n规则：\n\n```text\nTryStart 表示动作可能因已有动作、无效请求或表现层未就绪而失败\nStop 是幂等命令；无当前动作时仍可通过 ToIdle / ToMove 修正表现状态\nTryStart 只有在 Animator 参数、State、Layer 和所需工具模型都准备好时才返回 true\nOnMarker 用于拾取、采集、建矿、开垦、命中、投放等一次性业务结算\nOnCompleted 表示 Animator 动作达到 normalizedTime >= 1 或已经退出动作状态；只有动画未进入或未结束时才使用 timeout 兜底\n拾取、资源交互和农田动作统一通过 ActionController 播放或停止，不直接调用 WorldPlayerView 的动作 API\n移动是连续 locomotion，由 NavigationController 更新 WorldPlayerView.SetMoveSpeed，不作为离散动作进入 ActionController\n工具拥有与业务条件由上层检查，ActionController 只管理播放、阶段、完成和停止\nWorldPlayerView 是 Animator 和工具模型的低层适配器，不维护独立的动作完成计时\n```\n\n## 动作阶段点\n\n代码中的 `Marker` 表示一次动作里的业务阶段点，不是 Animation Clip 时间轴上的 `Animation Event`。\n\n`ActionRequest.MarkerNormalizedTime` 使用 Animator 的归一化进度，取值范围是 `0..1`。例如 `0.55` 表示动作播放到约 55% 时触发，不是第 55 帧，也不是 0.55 秒。动画状态速度改变后，Marker 对应的真实时间会一起改变。\n\n当前流程：\n\n```text\nTryStart\n  -> WorldPlayerView 触发 Animator 状态\n  -> ActionController 每帧读取 normalizedTime\n  -> normalizedTime >= MarkerNormalizedTime\n  -> OnMarker 触发一次业务结算\n  -> 动作达到 normalizedTime >= 1 或退出状态\n  -> OnCompleted 触发动作完成\n```\n\nMarker 的语义：\n\n| 情况 | 结果 |\n| --- | --- |\n| 到达 Marker | `OnMarker` 只触发一次 |\n| Marker 前调用 `Stop` | 不触发 `OnMarker`，不结算 |\n| Marker 后调用 `Stop` | 已完成的结算不回滚 |\n| 动画提前退出或超过 timeout | 触发 Marker 作为兜底，然后完成动作 |\n\n当前用途：\n\n| 动作 | Marker 结算内容 | Marker | timeout |\n| --- | --- | ---: | ---: |\n| 拾取 | 物品进入背包、移除地图资源 | `0.55` | `0.75s` |\n| 采集 | 扣减采集次数、发放奖励、记录工具使用 | `0.55` | `1.25s` |\n| 建矿 | 创建矿场、记录工具使用 | `0.55` | `1.25s` |\n| 开垦 | 创建农田、记录工具使用 | `0.55` | `1.25s` |\n\n这些值当前是代码常量：\n\n```text\nResourceInteractionController\n  PickupCollectNormalizedTime\n  PickupTimeoutSeconds\n  ToolActionMarkerNormalizedTime\n  ToolActionTimeoutSeconds\n\nPlacementController\n  CultivateMarkerNormalizedTime\n  CultivateTimeoutSeconds\n```\n\n当前实现不要求在动画资源上逐个添加事件，适合同类动作共用统一阶段比例。以后如果需要精确到斧头接触树木的具体帧、一个动作内多个命中点，或动作片段速度变化很大，再改为 Animation Event 或 StateMachineBehaviour 向 `ActionController` 报告阶段事件。\n\n如果后续做会刷新的资源，不能只靠隐藏 view 表示状态，需要显式运行时状态控制：\n\n```text\nRemainingTimes\nRespawnAtUnixTime\nVisible\nCanInteract\nBlocksMove / BlocksBuild\nStage\n```\n\n## 农田\n\n```text\nAssets/Scripts/Game/Island/Farming\nAssets/Scripts/Game/Island/Farming/FarmRequirementChecker.cs\nAssets/Scripts/Game/Island/Exploration/PlacementController.cs\nAssets/Scripts/Game/UI/Management/WorldFarmPanel.cs\nAssets/Scripts/Game/UI/Management/WorldFarmPanelView.cs\nAssets/Scripts/Game/UI/Management/WorldFarmSeedView.cs\nAssets/Scripts/Game/Core/RequirementResult.cs\nAssets/Scripts/Game/UI/Toasts/Toast.cs\nData/Excel/world_crop.xlsx\n```\n\n当前规则：\n\n```text\nFarmPanel 是独立 UIPanel\n打开时贴 BottomBar 快捷栏上方\n左侧 Info 显示作物图标、名称、产量\n种子消耗 = 地块数量 * 作物种子系数\n种子系数应配置在作物数据里\n```\n\n### 开垦入口和前置条件\n\n右侧 `QuickFarm` 点击后不会无条件进入画农田模式。`WorldMainPanel` 先确认\n`GameplayController` 已准备，再由 `GameplayController.SelectFarmAreaMode` 调用\n`FarmRequirementChecker.CheckCanEnterCultivation`，按顺序检查：\n\n```text\n当前地图已加载\n已有一座 Active 状态的 House\n玩家已拥有锄头\n锄头已放入 ToolKit\n```\n\n缺少锄头时禁止进入开垦模式，不再等到松开鼠标后才失败。玩家已经拥有锄头、但未放入\nToolKit 时，提示“请先将锄头放入工具箱”；尚未拥有锄头时，提示“需要先获得一把锄头”。\n\n进入开垦模式后，拖拽和执行阶段还会检查：\n\n```text\n按住并拖拽，屏幕距离至少达到 PlacementController.DragThresholdPixels\n拖拽起点和终点都位于有效地图格\n当前未处于建筑放置模式\n松开鼠标时重新检查地图、House、锄头拥有状态和 ToolKit 状态\n角色 Animator、UseTool 状态和锄头模型能够启动开垦动作\n所选矩形内至少有一个可建造、可开垦的格子\n```\n\n绿色区域是候选范围预览，不代表农田已经创建。松开鼠标后先启动锄地动作，在动作\n`Marker` 到达时才创建农田并记录锄头使用。矩形中不可开垦的格子会被跳过；如果没有\n任何可开垦格子，则不创建农田并显示 Toast。\n\n`FarmAreaPreview` 使用一个运行时动态 Mesh 绘制完整格子顶面，不再为每格实例化\n`WorldFarmPlot`。相邻格共享连续覆盖范围，不露出草地缝；有效与无效格分别进入绿、红\nSubMesh，内部只保留低强度格线。拖拽范围或 TileSize 没有变化时不重复重建 Mesh。\n预览高度使用 `MapManager.GetTileSurfaceWorldPosition` 取得地块真实顶面，再只增加\n`0.005 * TileSize` 的防闪烁偏移；不要继续沿用有厚度方块使用的 `1.03 * TileSize`\n整体抬高值。\n该规则只影响开垦虚影，正式农田地块表现仍由 `FarmManager` 管理。\n\n所有入口检查都必须在真正执行动作时再次检查，不能只依赖按钮显示状态，避免背包、\nToolKit、地图或模式在点击后发生变化造成错误执行。\n\n当前开垦与种植失败码：\n\n| 阶段 | Code | 玩家提示含义 |\n| --- | --- | --- |\n| 点击 QuickFarm | `farm.gameplay_unavailable` | 经营地图控制器未准备 |\n| 点击 / 松开时复检 | `farm.map_not_ready` | 当前地图未加载 |\n| 点击 / 松开时复检 | `farm.missing_house` | 尚无 Active House |\n| 点击 / 松开时复检 | `farm.missing_hoe` | 尚未拥有锄头 |\n| 点击 / 松开时复检 | `farm.hoe_not_in_toolkit` | 已拥有锄头，但未放入 ToolKit |\n| 开垦模式单击 | `farm.drag_required` | 需要按住并拖拽 |\n| 松开鼠标 | `farm.invalid_drag` | 起点或终点不是有效地图格 |\n| 松开鼠标 | `farm.building_mode_active` | 需要先退出建筑放置模式 |\n| 启动动作 | `farm.action_unavailable` | Animator、动作状态或锄头模型未准备 |\n| 动作结算 | `farm.no_buildable_cells` | 候选范围没有可开垦格子 |\n| 点击种子 | `farm.no_selected_farm` | 尚未选择农田 |\n| 点击种子 | `farm.empty_area` | 农田没有可用格子 |\n| 点击种子 | `farm.already_planted` | 农田已有作物 |\n| 点击种子 | `farm.missing_crop_config` | 作物配置缺失或未启用 |\n| 点击种子 | `farm.not_enough_seed` | 种子数量不足，并显示需要量和现有量 |\n\n### 种植条件和提示\n\n点击种子时通过 `FarmRequirementChecker.CheckCanPlant` 检查：\n\n```text\n已经选择农田\n农田至少有一个格子\n农田尚未种植其它作物\n作物配置存在且启用\n拥有足够种子\n```\n\n种子消耗使用：\n\n```text\n每格消耗 = max(1, world_crop.seedCost)\n总消耗 = 每格消耗 * Farm.CellCount\n```\n\n种子条目可以用降低透明度表现当前不可种植，但仍保留点击，让\n`RequirementToast.TryPass` 告诉玩家具体缺少的条件。最终扣除种子和写入作物状态由\n`FarmManager.TryPlant` 执行，并在执行前复用同一条件检查。\n\n### 当前缺口\n\n- 基础锄头已有物品和 Blueprint 配置，但正常游戏流程尚未提供明确的制作入口、任务奖励\n  或其它获取引导；补齐获取链路前，玩家会在 QuickFarm 入口收到“需要先获得一把锄头”。\n- 农田条件提示已经提供本地化 key 和中英文 fallback；对应 key 仍应补入\n  `Data/Excel/localization.xlsx`，再执行 `Data/gen_all.bat`，避免长期依赖代码 fallback。\n\n## 建筑和生产\n\n经营建筑不复用塔防 `TowerConfig`，经营建造不直接复用塔防 `TowerBuildManager`。\n\n相关配置：\n\n```text\nData/Excel/world_building.xlsx\nData/Excel/world_building_level.xlsx\nData/Excel/world_building_income.xlsx\nData/Excel/world_cost.xlsx\nData/Excel/reward.xlsx\n```\n\n生产/制作配置使用 `Blueprint`，见 `Docs/Modules/QuestStoryBlueprint.md`。\n\n## Calendar\n\n```text\nAssets/Scripts/Game/Island/Calendar/CalendarManager.cs\nAssets/Scripts/Game/Island/Calendar/Season.cs\n```\n\n规则：\n\n```text\n一年 4 个月\n每月 28 天\n每个月对应一个季节\n默认 600 秒真实时间 = 1 游戏日\n```\n\n`CalendarManager` 提供 `SetTimeOfDay`、`SetDateTime`、`AdvanceMinutes/Hours/Days`、`SetGameTimeScale`。UI 不自己维护独立时间，统一从 `CalendarManager` 取值。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },

    "summary": "经营主界面、浮动面板、入口互斥和布局规则。",
    "content": "# Management UI\n\n本文记录经营主界面和浮动面板。框架能力见 `Docs/Architecture/UIFramework.md`。\n\n## 常驻 HUD\n\n常驻 HUD 在 `WorldMainPanel`：\n\n```text\nTopBar\nBottomBar\nRightBar\nMiniMap\nLeftBar / entry buttons\nSetting\n```\n\n当前子模块：\n\n```text\nWorldTopBarPanel.cs\nWorldBottomBarPanel.cs\nWorldEntryBarPanel.cs\nWorldRightBarPanel.cs\nWorldBuildingDetailPanel.cs\nWorldBagPanel.cs（BottomBar 内部 Bag 抽屉）\n```\n\n规则：\n\n- 这些子模块都是挂在 prefab 上的 `MonoBehaviour`。\n- `WorldMainPanel` 通过 `[SerializeField]` 引用，不在代码里 `new World*Panel()`。\n- 子模块内部按钮、文本、图标、slot 用 prefab 序列化字段绑定。\n- 不运行时 `Find(\"TopBar\")`、`Find(\"Resources\")`、`Find(\"HotPanel\")`、`Find(\"Bag\")` 等节点。\n- `WorldTopBarView` 已合并回 `WorldTopBarPanel`，后续不要再新增同类只转发的 View 包装层。\n- `RightBar/BattleEntry` 由 `WorldRightBarPanel` 绑定，点击后由 `WorldMainPanel` 调用 `MapManager.Instance.LoadBattleMap(30950001)` 进入当前默认塔防关卡；它是模式切换入口，不注册到 `ManagementFloating` 浮层组。\n\nBagPanel prefab 当前作为 `BottomBar` 的子节点嵌在 `WorldMainPanel` 中。`WorldBagPanel` 是本地节点控制组件，不是独立 `UIPanel`。\n\n## 独立浮动面板\n\n```text\nBuildPanel\nToolKitPanel\nFarmPanel\nProductionPanel\nQuestPanel\nTechTreePanel\nMenuPanel\n```\n\nPrefab 当前按模块放在：\n\n```text\nAssets/Arts/UI/Panels/Bag\nAssets/Arts/UI/Panels/Build\nAssets/Arts/UI/Panels/ToolKit\nAssets/Arts/UI/Panels/Farm\nAssets/Arts/UI/Panels/Production\nAssets/Arts/UI/Panels/Quest\nAssets/Arts/UI/Panels/TechTree\nAssets/Arts/UI/Panels/Menu\n```\n\n## 入口互斥\n\n入口统一注册到 `WorldPanelEntryController`：\n\n```text\nBuild\nToolKit\nProduction\nQuest\nTechTree\nMenu\n```\n\n这些独立 Panel 入口当前注册到同一个 `ManagementFloating` Exclusive group。Bag 入口由 `WorldBottomBarPanel` 本地处理，不注册 `WorldPanelEntry`。\n\n行为：\n\n- 点击已打开入口会关闭自己。\n- 点击未打开入口会先关闭同组其它面板，再打开自己。\n- 入口状态读取 `UIManager.Instance.Panels.IsShown(prefabPath)`，不要额外记 bool。\n- 新增“等等”面板时注册新的 entry 和 group，不写点对点互相关闭逻辑。\n- Panel outside close 不会拦截入口按钮射线。点击 Build / ToolKit / Quest / TechTree / Menu 入口时，按钮自身仍能进入同一套 toggle / Exclusive 逻辑。\n- 打开 Bag 会先关闭 `ManagementFloating` 组、Farm 和 BuildingDetail；打开这些独立浮层也会关闭 Bag，以保持界面互斥。\n\n## Bag Toggle\n\nBottomBar 的 Bag 展开/收起统一由 Bag 根按钮触发。Bag 是 BottomBar 内部抽屉，通过节点 `SetActive` 开关。\n\n规则：\n\n- `Open` / `Close` 三角图标只显示状态，不接独立点击逻辑。\n- `Open` / `Close` 图标的 `Image.raycastTarget` 必须为 `false`。\n- `WorldBottomBarPanel.SetBagOpen()` 同时切换 Bag 节点和 Open / Close 图标，不通过 `UIManager.Panels.Show/Hide`。\n- `WorldBagPanel` 只负责内部背包格和 Close 按钮；BagChanged 订阅、开关状态和共享拖拽控制器由 `WorldBottomBarPanel` 持有。\n- 旧 Bag prefab 内如果仍有 HotBarGrid，由 `WorldBagPanel` 隐藏；实际快捷栏只使用 BottomBar 自身的一份节点。\n- Build / ToolKit 当前没有 Open / Close 状态图标设计，不要给它们补图标状态切换。\n\n## Bag / HotBar Slots\n\nBag 和 HotBar 共用 `BagManager` 的 slot：\n\n```text\n0-9   HotBar / 快捷栏\n10+   Bag / 背包\n```\n\n规则：\n\n- 快捷栏和背包 slot 可以互相拖动。\n- BottomBar 持有唯一 `BagDragController`，只绑定自身 HotBar 与 Bag 子节点的 slots，因此拖拽不会跨到其它 Panel。\n- 拖拽时显示跟随鼠标的物品图标和数量，源格图标暂时变淡；结束、关闭 Bag 或销毁 BottomBar 时必须清理拖拽状态。\n- 拖到空格是移动，拖到已有物品格是交换。\n- slot 只保存 `itemId`；物品数量由 `ItemManager` 统一保存。\n- HotBar 每个 slot 的 `Hotkey` 和 `Count` 都使用 `TextMeshProUGUI`；`Hotkey` 固定显示 `1-0`，`Count` 由 `BagSlotView` 刷新物品数量，两者都不拦截射线。\n- 点击 slot 走 `BagManager.TryUseSlot -> ItemManager.Use`；UI 不按物品类型分支。\n- 主键盘区顶排 `1-0` 映射快捷栏 slot `0-9`；不响应小键盘数字。键盘和点击共用 `BagManager.TryUseSlot`，仅在经营世界输入模式、没有文本框聚焦且未拖拽时响应。\n- 工具点击只选择或装入 ToolKit，不立即累计 `UseItem` 任务进度。\n- 未配置使用效果的物品返回失败，不扣数量，也不发送任务事件。\n- 任务 `UseItem` 只在采集、开垦、种植或消耗效果真正完成后累计。\n- 不拆堆；当前同一种物品只占一个 slot。\n\n## 布局\n\n布局规则：\n\n```text\nBuild / ToolKit / Farm / Production：下边贴 BottomBar 快捷栏上边\nBag：作为 BottomBar 子节点，位置直接由 prefab 布局决定\nTechTree：居中\nQuestPanel：居中，大面板，左列表右详情\n```\n\n运行时对齐工具：\n\n```text\nAssets/Scripts/Game/UI/Management/WorldFloatingPanelLayout.cs\n```\n\n位置优先通过 prefab 节点和序列化引用调整，不写死单分辨率像素。\n\n经营 UI 的屏幕度量和安全区来自框架\n`UIManager.Instance.Viewport` / `UISafeAreaFitter`。季节、天气、日期格式和经营 HUD 的\nCompact / Normal / Wide 规则属于业务层，不进入 `UIManager`、`UIView` 或 `UIPanel`。\n当前没有足够多的业务响应式脚本，因此不额外创建 `Management/Responsive` 文件夹；\n后续出现至少两个独立布局档位组件时，再集中到该目录。\n\n## TopBar\n\nPrefab：\n\n```text\nAssets/Arts/UI/Panels/World/TopBar.prefab\n```\n\n绑定脚本：`WorldTopBarPanel`。年份、月日、季节、时间、天气、温度、季节图标、天气图标、\n四季底板和日夜图都通过序列化字段引用；脚本只更新 prefab 已有节点，不在运行时创建、\n按名称查找或调整布局。\n\n`Setting` 为 `WorldMainPanel` 根节点的同级常驻入口，不属于 `TopBar.prefab`。按钮通过\n`WorldMainPanel.settingButton` 序列化绑定并打开 Menu；这样 Setting 的右上角定位不会参与\nTopBar 的日历、天气布局计算。\n\n日历块必须由 prefab 中的布局组件保持整体居中：\n\n```text\nCalendarBlock（HorizontalLayoutGroup）\n  SeasonIcon\n  DateColumn（VerticalLayoutGroup / MiddleLeft）\n    Header\n      HorizontalLayoutGroup（MiddleLeft，不强制拉伸子项）\n        Year / Dot / Season\n    MonthDay（横向 Stretch，文字 Left）\n```\n\n日期不能通过手工 x 坐标对齐。`Header` 和 `MonthDay` 共用 `DateColumn` 左边界，使文字\n始终贴近季节图标；切换为 `Year 1 · Summer` 后，内容按 preferred width 向右扩展，不会\n在图标和文字之间重新产生大块空白。\n\n显示规则：\n\n```text\n年份：第N年；英文为 Year N\n日期：M月D日；英文为 M/D\n季节：独立图标 + 季节名称\n天气：独立图标 + 天气名称\n温度：数值由脚本更新，单位 °C 由 prefab 固定节点显示\n日夜圆图：12:00 为初始外观\n```\n\n季节名称使用固定强调色，年份、日期、天气等主要文字保持深色：\n\n```text\n春 Spring  #4A8F3C  深叶绿\n夏 Summer  #E2A72B  阳光金\n秋 Autumn  #C86A2A  枫叶橙\n冬 Winter  #4F86B8  冰霜蓝\n```\n\n色值由 `WorldTopBarPanel.GetSeasonTextColor()` 统一维护，语言切换只改变季节名称，不改变\n对应颜色。\n\nTopBar 使用固定 HUD 尺寸，不根据本地化字符串动态拉长：\n\n```text\nTopBar：620 × 90\nWeather：190 × 79\nWeather/Value：110 × 30\n```\n\n天气名称保持单行，TMP 自动字号范围为 `18–25`；超过当前语言可用宽度时使用省略号。\n四季底板只铺满固定 TopBar，不参与 preferred width 计算。这样切换中文、英文或其他语言\n时，HUD 的整体宽度和屏幕位置不会跳动。\n\n季节与天气资源配置位于 `WorldTopBarPanel`：\n\n```text\nseasonIconBindings   Season -> Sprite\nweatherIconBindings  WeatherType -> Sprite\nseasonBackgroundBindings Season -> Sprite\n```\n\n当前天气还没有独立的天气管理器，TopBar 使用 `initialWeather` 和\n`initialTemperatureCelsius` 作为初始显示；后续天气业务通过\n`SetWeather(WeatherType, temperatureCelsius)` 更新。没有配置对应 Sprite 时隐藏该图标，\n避免继续显示上一个季节或天气的错误图标。\n\n四季底板复用 prefab 根节点下已有的 `Background/Image`，不动态创建节点。春、夏、秋、冬\n分别由 `seasonBackgroundBindings` 配置；漏配时回退到 `defaultSeasonBackground`，避免\n整个 TopBar 底板消失。\n\n`Sky` 的旋转直接由 `CalendarManager` 的当天时间计算，不按帧累计角度：\n\n```text\n12:00 -> noonRotationZ\n经过 24 游戏小时 -> 旋转一整圈 360 度\n默认 600 秒真实时间 / 游戏日 -> 0.6 度 / 真实秒\n```\n\n`WorldTopBarPanel.dayNightSkyNoonRotationZ` 是图片在 12:00 时的校准角，当前\n`DayNightSkyDisk.png` 使用 `0`。不要从运行时已经旋转过的 `Transform` 缓存中午基准，\n否则父子对象 `Awake` 顺序不同会产生额外角度偏移。\n\n## 系统设置\n\n当前代码中 Menu、Sound、Language、Save、GM 是独立 `UIPanel`，短期可用 Stack 保持 Menu -> 子面板 -> 返回 Menu。`MenuPanel` 同时被经营大地图和塔防战场复用，并根据当前模式切换 `Save` / `Retreat`：经营模式只显示存档，战场只显示撤退。\n\n后续更推荐：\n\n```text\nMenuPanel\n  Sound\n  Language\n  Save\n  Retreat（仅战场）\n  GM\n```\n\n`Retreat` 表示放弃当前战斗并返回进入战斗前的世界地图。它不是普通页面 `Return`，也不是正常完成关卡的 `Finish`；点击后必须显示无奖励确认。战场隐藏 `Save`，避免保存单局战斗中的临时状态。\n\n如果 Sound、Language、Save 只是设置页，就作为 Menu 内部节点由 `WorldMenuPanel` 通过序列化字段切换。不要为了 Stack 强行拆 panel。\n\n## 关闭规则\n\n独立经营大面板默认支持：\n\n```text\nCloseButton\nBack\nRightOutside\n```\n\nQuest、TechTree、Menu、Sound、Language、Save、GM 等有空白或遮罩的大面板，右键外部区域应关闭。移动端点击外部区域即可，不要求右键。\n\n经营 panel 的 outside close 统一走框架创建的 `PanelOutsideBlocker` + `UIOutsideClickDetector` + `PanelManager`。Panel prefab 内如果有半透明 `Overlay`，它只负责视觉变暗，`Image.raycastTarget` 必须关闭，脚本里不要再 `Find(\"Overlay\")` 绑定点击关闭。\n\nBag 不是独立 Panel，不参与框架 outside / Back close；通过 BottomBar 的 Bag 按钮、Bag 内 Close 按钮，或打开其它互斥业务浮层时关闭。\n\n`PanelOutsideBlocker` 是 `UICanvasRoot` 的底层 UI，排序低于所有 UI layer，不挡住任何正常 UI。它只让空白处命中 UI 并阻止世界输入，点击后仍由 `PanelManager` 关闭最上层可 outside close 的 panel。世界输入必须通过 `WorldPointerPicker.IsPointerOverUi()` 过滤，避免右键关闭 Quest / TechTree 等面板时同一帧又让玩家移动到鼠标位置。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },

    "summary": "剧情播放、触发、存档和 StoryPanel 当前实现。",
    "content": "# Story Module\n\n本文记录当前 Story 与轻量新手引导实现。修改剧情播放、静态插画镜头、按钮高亮、剧情存档或 StoryPanel 时，优先读本文。\n\n## 定位\n\nStory 是基于 `StoryStep` 的轻量剧情表现系统，支持文字、静态插画、文字与插画混合，以及简单按钮指引。它不是视频播放器，也不是带时间轴、角色走位、分支选项的完整 Cutscene/Dialog 系统。\n\n```text\nStoryManager：加载配置、触发、进度和存档\nStoryPresenter：打开 StoryPanel\nStoryPanel：按 Step 切换文字、插画、Guide 表现\nStoryMotionPlayer：静态插画的平移与缩放\nSimpleGuideManager：等待并绑定 GuideTarget\nGuideOverlay：遮罩、镂空区域、焦点框和提示文本\nGuideTargetRegistry：查找当前可见的按钮目标\n```\n\n## 文件\n\n```text\nAssets/Scripts/Game/Story/StoryManager.cs\nAssets/Scripts/Game/Story/StoryPresenter.cs\nAssets/Scripts/Game/Story/StoryPanel.cs\nAssets/Scripts/Game/Story/StoryConfig.cs\nAssets/Scripts/Game/Story/StoryStep.cs\nAssets/Scripts/Game/Story/StoryEnums.cs\nAssets/Scripts/Game/Story/StoryMotionPlayer.cs\nAssets/Scripts/Game/Story/SimpleGuideManager.cs\nAssets/Scripts/Game/Story/GuideOverlay.cs\nAssets/Scripts/Game/Story/GuideTarget.cs\nAssets/Scripts/Game/Story/GuideTargetRegistry.cs\nAssets/Scripts/Tools/Editor/StoryPanelPrefabBuilder.cs\n```\n\n`DialogManager` 和 `EventTriggerSystem` 仍是占位文件，不表示已经有完整对话树或通用事件编排系统。\n\n## 数据表\n\n```text\nData/Defines/story.xml\nData/Defines/story_step.xml\nData/Excel/story.xlsx\nData/Excel/story_step.xlsx\nAssets/Data/Bin/tbstory.bytes\nAssets/Data/Bin/tbstorystep.bytes\nAssets/Data/Json/tbstory.json\nAssets/Data/Json/tbstorystep.json\n```\n\n运行时入口：\n\n```text\nDataManager.Instance.Story\nDataManager.Instance.StoryStep\n```\n\n`story_step.xlsx` 字段：\n\n| 字段 | 类型 | 说明 |\n| --- | --- | --- |\n| `id` | int | Step 唯一 Id。 |\n| `storyId` | int | 所属 Story Id。 |\n| `stepIndex` | int | Story 内顺序；相同时按 `id`。 |\n| `stepType` | int | `StoryStepType`。 |\n| `text` | string | Text/Mixed 的正文。 |\n| `illustrationPath` | string | Illustration/Mixed 使用的 Texture2D 资源路径。 |\n| `motionPreset` | int | `StoryMotionPreset`。 |\n| `motionDuration` | float | 镜头运动秒数，使用不受暂停影响的时间。 |\n| `advanceMode` | int | `StoryAdvanceMode`。 |\n| `autoAdvanceDelay` | float | AutoAfterDelay 等待秒数。 |\n| `guideTargetId` | string | Guide 要高亮的稳定目标 Id。 |\n| `guideText` | string | Guide 提示语。 |\n| `allowTargetInteraction` | bool | 是否允许点击镂空区域下方的真实 UI。 |\n| `enable` | bool | 是否启用。 |\n\n## Step 类型\n\n```text\n0 Text          只显示现有文本剧情框\n1 Illustration 只显示静态剧情插画\n2 Mixed         插画与文本剧情框同时显示\n3 Guide         高亮某个 GuideTarget，显示简单提示\n```\n\n文本框与静态插画不是二选一。不同 Step 可以使用不同类型，`Mixed` 也可在同一个 Step 中同时显示二者。\n\n进度文本由 `GameConfig.Story.ProgressDisplayMode` 控制：\n\n```text\nHidden        不显示进度\nDialogueOnly 只统计 Text / Mixed；当前默认值\nAllSteps      统计全部 Story Step\n```\n\n因此在“1 个纯插画 Step + 3 个 Mixed Step”的开场中，当前第一句文字显示为 `1/3`；纯插画 Step 不占对话序号。内部播放和存档仍使用统一的 `stepIndex`，不会产生两套剧情进度。\n\n## 静态插画镜头\n\n剧情插画使用 `Texture2D + RawImage`。`StoryMotionPlayer` 插值 `RawImage.uvRect`，改变图片的可见区域来模拟虚拟镜头，不修改真实 Unity Camera，也不缩放 StoryPanel UI：\n\n```text\n0 None\n1 ZoomOut          从局部慢慢拉远到完整画面\n2 PanLeftToRight   从左侧缓慢移动到右侧\n3 PanRightToLeft   从右侧缓慢移动到左侧\n4 ZoomIn           从全图缓慢推进到局部\n```\n\n插画保持 Unity `Default Texture`，把资源路径填入 `illustrationPath`。Story 目录必须被 YooAsset 收集；当前规则包含 `Assets/Arts/UI/Texture/Story`。AI 生成的静态图可以直接进入这条流程，镜头运动由 Unity 完成，不需要为每个镜头重新生成图片。\n\nZoomOut、ZoomIn 和横向平移的默认取景范围集中在 `GameConfig.Story`，无需到 `StoryMotionPlayer` 内寻找散落数值。\n\n## 推进方式\n\n```text\n0 Click               点击 Continue\n1 MotionComplete      插画运动完成后进入下一 Step\n2 AutoAfterDelay      等待 autoAdvanceDelay 后进入下一 Step\n3 GuideTargetClicked  玩家点击高亮的真实 UI 后进入下一 Step\n```\n\nGuideTargetClicked 会自动允许目标交互，避免配置成不可点击后卡住。\n\n## 新手引导\n\n新手引导不另建复杂流程图系统，由 Story 的 `Guide` Step 负责流程；Guide 子系统只负责“找到目标、遮罩、高亮和监听点击”。\n\n当前经营模式底栏会在运行时注册：\n\n```text\nworld.bottomBar.bag\nworld.bottomBar.build\nworld.bottomBar.toolKit\nworld.bottomBar.tech\nworld.hotBar.slot.1 ... world.hotBar.slot.N\n```\n\n其他按钮需要指引时，在按钮 GameObject 上添加 `GuideTarget` 并配置稳定 Id，或在初始化代码中调用：\n\n```csharp\nGuideTarget.Attach(button.gameObject, \"module.panel.action\");\n```\n\nGuideOverlay 使用四块遮罩围出镂空区域；目标允许交互时，点击会穿过镂空区域到真实按钮。目标尚未出现时，SimpleGuideManager 会等待注册，而不是立即失败。\n\n## 配表示例\n\n现有开场三行已迁移为 Text Step：\n\n```text\n1000100,10001,0,Illustration,\"\",...,ZoomOut,5,AutoAfterDelay,6,...\n1000101,10001,1,Mixed,\"You wake to the sound of waves.\",...,Click,...\n1000102,10001,2,Mixed,\"The ship is gone...\",...,Click,...\n1000103,10001,3,Mixed,\"Gather wood and stone...\",...,Click,...\n```\n\n插画拉远并在运动结束后推进：\n\n```text\nstepType=Illustration\nillustrationPath=Assets/Arts/UI/Texture/Story/chapter1/4a9f3a69-3782-4806-81de-860315f46645.png\nmotionPreset=ZoomOut\nmotionDuration=5\nadvanceMode=AutoAfterDelay\nautoAdvanceDelay=6\n```\n\n插画加文字、由玩家点击推进：\n\n```text\nstepType=Mixed\ntext=The island finally comes into view.\nillustrationPath=Assets/Arts/UI/Texture/Story/chapter1/4a9f3a69-3782-4806-81de-860315f46645.png\nmotionPreset=PanLeftToRight\nmotionDuration=5\nadvanceMode=Click\n```\n\n简单指示建造按钮：\n\n```text\nstepType=Guide\nadvanceMode=GuideTargetClicked\nguideTargetId=world.bottomBar.build\nguideText=Open the build menu.\nallowTargetInteraction=true\n```\n\n表内填写的是枚举整数，不是枚举名。\n\n## 触发与完成\n\n`StoryTriggerMode` 保持不变：Manual、AutoOnNewGame、QuestCompleted、CustomFlag、EnterArea、TalkNpc。\n\n```text\nStoryManager.LoadConfigs()\n  -> 读取 Story / StoryStep\n  -> 按 stepIndex、id 排序\n  -> TryStartAutoStories / TryStart / NotifyEvent\n  -> StoryPresenter.Present\n  -> StoryPanel 按 Step 表现和推进\n  -> 最后一 Step 完成\n  -> 写入 completedStoryIds、通知 Quest、尝试 nextStoryId\n```\n\n## 存档\n\n存档类型名称是现有的 `StorageManager.StoryData`，不要创建带 `Save` 前缀的替代类型。\n\n```text\nStoryData.CurrentStoryId\nStoryData.CurrentStepIndex\nStoryData.CompletedStoryIds\n```\n\nStep 改变时会标记存档 dirty。读档后，`TryStartAutoStories()` 会先调用 `TryResumeCurrentStory()`，从 `CurrentStepIndex` 重新打开未完成剧情；旧存档没有该字段时默认从第 0 个 Step 开始。\n\n## Prefab\n\n```text\nAssets/Arts/UI/Panels/Story/StoryPanel.prefab\n```\n\nPrefab 使用序列化字段绑定插画视口、文本卡片、Continue 按钮和 GuideOverlay，不再依赖 StoryPanel 在运行时临时创建整套节点。\n\n重新生成 prefab：\n\n```text\nUnity 菜单：Tools/Story/Rebuild Story Panel Prefab\n批处理：StoryPanelPrefabBuilder.BuildForBatch\n```\n\n生成器是初始结构和绑定工具。美术调整 prefab 后，不要无故重新运行生成器覆盖布局。\n\n## 生成配置\n\n修改表后执行：\n\n```text\nData/gen_all.bat\n```\n\n字段结构发生变化时，也可以使用 Unity 菜单 `Luban/Update All`。生成后应检查 `StoryStepTableConfig`、`TbStoryStep`、`tbstorystep.bytes` 与 `tbstorystep.json`。\n\n## 当前边界\n\n```text\n没有分支选择、条件跳转和对话树\n没有角色立绘槽位、口型、配音时间轴\n没有 Timeline/Cinemachine 场景演出编排\n插画镜头当前使用预设，不是任意关键帧曲线\n文本与 Guide 提示尚未切换为本地化 key\n```\n\n这些能力以后可以继续增加新的 Step 类型或演出播放器，不需要把轻量 Guide 扩展成独立复杂剧情系统。\n"

    "content": "# Quest / Blueprint\n\n本文记录任务、蓝图以及它们和剧情的衔接。Story 模块自身实现见 `Docs/Modules/Story.md`。\n\n## 核心结论\n\n- 任务系统叫 `Quest`，不要改成 `Task`。\n- Quest 域新代码默认不要加 `World` 或 `Game` 前缀。\n- 制作/生产配置叫 `Blueprint`，不要再叫 `Recipe`。\n- Quest / Blueprint / Story 已接入正式 Excel / Luban 表，运行时从 `DataManager` 读取。\n- JSON 只是导出查看，正式运行以 `.bytes` 为准。\n\n## 数据来源\n\n当前正式表：\n\n```text\nData/Defines/quest.xml\nData/Defines/quest_objective.xml\nData/Defines/blueprint.xml\nData/Defines/blueprint_item.xml\nData/Defines/story.xml\nData/Defines/story_step.xml\n\nData/Excel/quest.xlsx\nData/Excel/quest_objective.xlsx\nData/Excel/blueprint.xlsx\nData/Excel/blueprint_item.xlsx\nData/Excel/story.xlsx\nData/Excel/story_step.xlsx\n\nAssets/Data/Bin/tbquest.bytes\nAssets/Data/Bin/tbquestobjective.bytes\nAssets/Data/Bin/tbblueprint.bytes\nAssets/Data/Bin/tbblueprintitem.bytes\nAssets/Data/Bin/tbstory.bytes\nAssets/Data/Bin/tbstorystep.bytes\n```\n\n运行时代码：\n\n```text\nQuestManager      DataManager.Instance.Quest + QuestObjective\nBlueprintManager  DataManager.Instance.Blueprint + BlueprintItem\nStoryManager      DataManager.Instance.Story + StoryStep\n```\n\n## 当前文件\n\n```text\nAssets/Scripts/Game/Quests/QuestManager.cs\nAssets/Scripts/Game/Quests/QuestToastListener.cs\nAssets/Scripts/Game/Blueprints/BlueprintManager.cs\nAssets/Scripts/Game/Story/StoryManager.cs\nAssets/Scripts/Game/Story/StoryPresenter.cs\nAssets/Scripts/Game/Story/StoryPanel.cs\nAssets/Scripts/Game/UI/Management/QuestPanel.cs\nAssets/Scripts/Game/UI/Management/QuestSlotView.cs\n```\n\nPrefab：\n\n```text\nAssets/Arts/UI/Panels/Quest/QuestPanel.prefab\nAssets/Arts/UI/Panels/Quest/QuestSlot.prefab\nAssets/Arts/UI/Panels/Story/StoryPanel.prefab\n```\n\n## Quest 状态\n\n```csharp\npublic enum QuestState\n{\n    Locked = 0,\n    Available = 1,\n    Accepted = 2,\n    Completed = 3,\n    Claimed = 4,\n}\n```\n\n显示规则：\n\n```text\nLocked 隐藏\nEvent-only Available 隐藏\nAccepted 显示\nCompleted 显示\nClaimed 领奖后隐藏\n```\n\n## QuestData\n\n使用 `QuestData`，不要新增 `QuestRuntimeData` 作为同义概念。\n\n```csharp\npublic sealed class QuestData\n{\n    public int QuestId;\n    public QuestState State;\n    public QuestObjectiveData[] Objectives;\n}\n```\n\n只有事件型目标需要保存进度。查询型目标从当前系统实时计算。\n\n## 接取方式\n\n```csharp\npublic enum QuestAcceptMode\n{\n    Auto = 0,\n    Manual = 1,\n    Event = 2,\n}\n```\n\n建议：\n\n```text\nAuto    前置满足后自动接取\nManual  UI / NPC / 任务板接取\nEvent   剧情 / 对话 / 区域 / 自定义事件触发\n```\n\n开局链路见 `Docs/Product/ProgressionAndQuests.md`。\n\n## 目标类型\n\n```csharp\npublic enum QuestObjectiveType\n{\n    None = 0,\n    ItemCount = 1,\n    ItemGainCount = 2,\n    ItemUseCount = 3,\n    Blueprint = 4,\n    BuildBuilding = 5,\n    BuildBuildingType = 6,\n    UpgradeBuilding = 7,\n    FarmCount = 8,\n    PlantCrop = 9,\n    HarvestCrop = 10,\n    TechResearched = 11,\n    TalkNpc = 12,\n    EnterArea = 13,\n    CustomFlag = 14,\n}\n```\n\n查询型目标：\n\n```text\nItemCount\nBuildBuilding\nBuildBuildingType\nFarmCount\nTechResearched\n```\n\n事件型目标：\n\n```text\nItemGainCount\nItemUseCount\nBlueprint\nUpgradeBuilding\nPlantCrop\nHarvestCrop\nTalkNpc\nEnterArea\nCustomFlag\n```\n\n## QuestEvent\n\n统一入口示例：\n\n```csharp\nQuestManager.Instance.StartQuest(questId);\nQuestManager.Instance.NotifyEvent(QuestEventType.CustomFlag, flagId);\nQuestManager.Instance.NotifyEvent(QuestEventType.TalkNpc, npcId);\nItemManager.Instance.NotifyUseCompleted(itemId, count);\nQuestManager.Instance.NotifyEvent(QuestEventType.GainItem, itemId, count);\nQuestManager.Instance.NotifyEvent(QuestEventType.BlueprintCompleted, blueprintId);\n```\n\n`UseItem` 是完成通知，不是物品效果处理入口。UI 点击、工具选择、种子选择、进入目标模式都不能直接累计；只有效果或对应业务动作提交成功后才调用 `ItemManager.NotifyUseCompleted`。\n\n不要设计“开始下一个任务”作为核心 API。任务顺序由配置的 `preQuestIds` 和触发条件控制。\n\n## Blueprint\n\n`Blueprint` 有两个含义：\n\n```text\n制作 / 生产定义\n任务目标类型，表示完成某个蓝图\n```\n\n当前 `BlueprintManager` 支持：\n\n```text\nInputs\nOutputs\nBuildingId\nUnlockTechId\nUnlockQuestId\nCanComplete\nTryComplete\n完成后发送 QuestEventType.BlueprintCompleted\n```\n\n开局基础工具蓝图：\n\n```text\n30600001 Stone Axe     buildingId = 0\n30600002 Stone Pickaxe buildingId = 0\n```\n\n`buildingId = 0` 表示不需要建筑。当前用于开局教学，QuestPanel 详情按钮会在任务存在未完成 Blueprint 目标时显示“制作”，点击后直接调用 `BlueprintManager.TryComplete`。建筑生产蓝图仍通过 `WorldBuildingDetailPanel` 的制作按钮完成。\n\n## Quest 奖励\n\n任务表字段：\n\n```text\nquest.rewardGroupId -> reward.groupId\n```\n\n领取流程：\n\n```text\nQuestManager.TryClaim\n  -> RewardResolver.GetRewardGroup\n  -> BagManager.TryAddItems\n  -> 成功后状态改为 Claimed\n```\n\n规则：\n\n- `rewardGroupId <= 0` 表示没有奖励，可以直接领取完成。\n- `rewardGroupId > 0` 但奖励组为空时，领取失败，不改 `Claimed`。\n- 背包容量不足时，`BagManager.TryAddItems` 返回失败，不改 `Claimed`。\n- Quest UI 详情奖励行从 `reward` 读取，显示固定数量或 `min-max` 范围。\n\n当前开局任务奖励：\n\n```text\n60000001 Scavenge the Shore      -> 60090001 -> Food x3\n60000002 Build a House           -> 60090002 -> Wheat Seed x5\n60000003 Craft a Basic Axe       -> 60090003 -> Food x2\n60000004 Chop Down a Tree        -> 60090004 -> Food x2\n60000005 Craft a Basic Pickaxe   -> 60090005 -> Food x2\n60000006 Break Rocks             -> 60090006 -> Stone x2\n60000007 Build a Workbench       -> 60090007 -> Plank x2\n```\n\n示例蓝图：\n\n```text\n30600001  Stone Axe       Wood x1 + Stone x1 -> Stone Axe x1\n30600002  Stone Pickaxe   Wood x1 + Stone x1 -> Stone Pickaxe x1\n30600003  Stone Hoe       Wood x2 + Stone x1 -> Stone Hoe x1\n30601001  Saw Planks      Wood x5            -> Plank x1\n30601002  Mill Wheat      Wheat x5           -> Food x1\n30601003  Smelt Copper    CopperOre x5       -> CopperIngot x1\n30601004  Smelt Iron      IronOre x5         -> IronIngot x1\n```\n\n当前开局任务链：\n\n```text\n开场 Story 10001\n  -> 60000001 Scavenge the Shore\n  -> 60000002 Build a House\n  -> 60000003 Craft a Basic Axe\n  -> 60000004 Chop Down a Tree\n  -> 60000005 Craft a Basic Pickaxe\n  -> 60000006 Break Rocks\n  -> 60000007 Build a Workbench\n```\n\n地图对象对应：\n\n```text\n任务目标用 ItemGainCount / Blueprint / BuildBuildingType，不直接绑定地图对象实例。\n地图编辑器放置 Resource 对象时，ConfigId 应填写 resource.id：\n\n30300008 Branch      -> 拾取后获得 Wood\n30300009 Loose Stone -> 拾取后获得 Stone\n30300001 Tree        -> 斧采集后获得 Wood\n30300002 Rock        -> 镐采集后获得 Stone\n\n当前默认世界地图 Assets/Data/Map/1001.json 已放置开局资源：\nBranch x3、Loose Stone x2、Tree x1、Rock x1 在地图中心附近。\n```\n\n## Story 衔接\n\n当前 Story 是简单文字剧情系统，不是视频系统或复杂 cutscene 系统。更完整的 Story 实现细节见 `Docs/Modules/Story.md`。\n\n流程：\n\n```text\nStoryManager 加载 StoryConfig\nStoryPresenter 打开 StoryPanel\nStoryPanel 显示几行文字\n玩家点击继续\nStory 完成\nStory 完成后可通知 QuestManager\n```\n\n当前正式开场 Story：\n\n```text\nId: 10001\nTitle: Ashore\nTriggerMode: AutoOnNewGame\n完成事件: QuestEventType.CustomFlag + 10001\n```\n\n## Quest UI\n\n```text\nAssets/Arts/UI/Panels/Quest/QuestPanel.prefab\nAssets/Arts/UI/Panels/Quest/QuestSlot.prefab\nAssets/Scripts/Game/UI/Management/QuestPanel.cs\nAssets/Scripts/Game/UI/Management/QuestSlotView.cs\n```\n\n行为：\n\n```text\n左侧显示当前可见任务\n点击左侧 slot，右侧显示任务详情\nTrack 按钮根据是否当前追踪改变文字\n右侧目标行显示图标和数量，不显示目标类型名\n右侧按钮根据任务状态改变文字\n领奖后任务从列表隐藏\n```\n\n注意：`QuestSlotView` 不应在运行时强改 slot 子节点布局。Prefab 布局、`LayoutElement`、`VerticalLayoutGroup` 负责尺寸和排列；代码只绑定数据、进度、选中态和按钮回调。\n\n## 当前状态\n\n已完成：\n\n```text\nQuest 多目标 snapshot\nQuest state / save / event / message\nQuest 前置任务判断\nQuest 追踪任务\nQuest 完成和领取状态\nQuest 完成消息与 Toast 监听器\nStory 简单文字流程\nStory 完成触发 QuestEvent\nBlueprint 完成触发 QuestEvent\nQuestPanel 左列表右详情\nQuestSlot 点击切换详情\nTrack / Tracking 文本状态\n右侧按钮状态文本\nClaimed 任务隐藏\nQuest 领取奖励发放到 BagManager / ItemManager\nQuest UI 详情奖励行读取 reward\nQuest / Blueprint / Story 正式 Luban 表读取\n```\n\n仍需完善：\n\n```text\n任务配置编辑规范\n更多目标类型接入具体玩法\nQuest / Blueprint / Story 的多语言内容继续补进 localization.xlsx\n任务奖励 Toast / 获得反馈继续打磨\n```\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"

    "content": "# Ability And Skill\n\n本文记录 Ability / Skill 系统当前状态。\n\n## 定位\n\nAbility 系统主要服务塔防战斗中的技能、Buff、投射物和效果。岛屿经营当前不是 Ability 系统的重点。\n\n## 目录\n\n```text\nAssets/Scripts/Ability\nAssets/Scripts/Skill\nAssets/Scripts/Game/TowerDefense/AbilityAdapters\nAssets/Scripts/Game/TowerDefense\n```\n\n## 当前数据\n\n正式 Luban 表包括：\n\n```text\nData/Excel/AbilityConfig.xlsx\nData/Excel/AbilityAction.xlsx\nData/Excel/AbilityModifier.xlsx\nData/Excel/AbilityModifierProperty.xlsx\nData/Excel/AbilityProjectile.xlsx\nData/Excel/AbilitySpecialValue.xlsx\nData/Excel/AbilitySystemEnum.xlsx\n\nData/Excel/skill.xlsx\nData/Excel/skill_action.xlsx\nData/Excel/skill_modifier.xlsx\nData/Excel/skill_system_enum.xlsx\n```\n\n生成代码：\n\n```text\nAssets/Scripts/Game/Data/Generated\n```\n\n当前 `Tables` 同时包含 Ability 表和旧 Skill 表。\n\n当前接入状态不是对等的：`Ability*.xlsx` 目前为空，`DataManager` 也没有把这些表转换成 Ability 运行时定义；现有可运行技能来自 `skill.xlsx`、`skill_action.xlsx`、`skill_modifier.xlsx`，再由 `AbilityConfigConverter` 转入 Ability core。完整字段说明见 `Docs/Architecture/ExcelDataDictionary.md`。\n\n## 当前结构\n\n```text\nAbility core\n  -> 通用技能运行时\n\nSkill legacy\n  -> 较旧技能配置和兼容\n\nGame/TowerDefense/AbilityAdapters\n  -> 把基地、防御塔、敌人、地图等业务对象适配到 Ability core\n```\n\n## 当前中间层\n\n项目已经存在 Ability 与塔防业务之间的中间层，不需要重新编写一套平行系统：\n\n```text\nAbilityManager\n  -> 中间层入口；初始化 AbilitySystem、注册配置定义、缓存业务对象适配器并转发施法/战斗请求\n\nTdUnit\n  -> 把 Npc、Tower、Base 包装为 Ability core 的 IUnit\n\nTdWorld\n  -> 把塔防场景中的动态对象提供给 Ability core 做范围和目标查询\n\nTdResourceOwner\n  -> 把业务资源映射为技能消耗资源\n\nTdPresentation\n  -> 把技能框架的特效和音效请求映射到业务表现系统\n\nAbilityConfigConverter\n  -> 把当前 Excel/Luban 数据转换为 AbilityDefinition、ModifierDefinition 等运行时定义\n```\n\n当前绑定由两条路径共同完成：`NpcManager`、`TowerManager` 和 `BaseManager` 发布不包含 Ability 类型的业务生命周期事件，中间层订阅事件后立即注册或注销对应适配器；`AbilityManager.GetUnit(...)` 的延迟绑定和每帧同步继续作为兼容与异常销毁兜底。适配器使用战斗内稳定实体 ID，注销时由 Ability core 统一清理关联技能、Modifier、投射物、Thinker 和持续表现句柄。`BattleFlowManager` 在结算完成后发布业务中立的战斗结束事件，中间层随即清空 Ability Runtime、适配器缓存和实体 ID；统一清理期间不会执行配置型 Modifier 的销毁伤害、治疗或派生动作。状态与现有移动/攻击属性已经通过中间层回传；以后增加新的业务属性时仍须沿用同一边界补充映射。\n\n第二阶段在现有中间层上增量修改，不推倒重写，也不再建立另一套重复的适配系统。只有当现有单个适配器确实无法继续扩展时，才在保持现有接口和调用兼容的前提下拆分实现。\n\n## 解耦与接入原则\n\n以下三条是 Ability 系统后续设计、实现和代码审查必须遵守的边界：\n\n1. **技能框架不能耦合业务层代码。** `Game.Ability` 不得引用 `Npc`、`Tower`、`BaseManager`、`DataManager`、业务单例、业务配置类型或具体资源/表现实现。框架只依赖自身定义和抽象接口。\n2. **业务对象不能以耦合方式直接传入技能框架。** `Npc`、`Tower`、`Base`、召唤物、陷阱和其他动态目标不直接实现或持有 Ability 框架类型。它们由中间层注册或绑定，中间层使用适配器将业务对象转换为 `IUnit`、`IResourceOwner`、`IWorld`、`IPresentation` 等框架接口后再交给 Ability core。增加新的业务目标类型时，应增加或注册适配器，不应修改 Ability core 以认识该业务类型。\n3. **技能框架产生的属性、状态和表现必须在业务对象上形成闭环。** 中间层负责把业务对象的阵营、类型、位置、存活、基础属性和基础状态提供给框架；再把框架计算出的伤害、治疗、Modifier 属性、眩晕/沉默/魔免等最终状态，以及特效、音效、投射物和持续表现请求，正确应用或映射回对应的业务对象。对象死亡、销毁、出售、升级替换或战斗结束时，中间层必须清理相关技能实例、Modifier、目标引用和持续表现。\n\n依赖方向固定为：\n\n```text\n业务对象\n  -> 业务中立的战斗调用/生命周期通知\n  -> Ability 中间层（注册、绑定、转换、回传）\n  -> Ability core\n\nAbility core\n  -> 抽象结果和表现请求\n  -> Ability 中间层\n  -> 业务属性、状态和表现\n```\n\n## 使用原则\n\n- 新塔防技能的运行时优先走 Ability core；在原生 Ability Excel 转换链完成前，配置仍写入当前已接通的 `skill*.xlsx`。\n- 旧 Skill 表和转换器可保留一段时间作为兼容层。\n- 不要把 Ability core 写死到塔防具体类里。\n- 优先扩展现有 Ability 中间层，不在业务代码中复制技能规则，也不建立第二套平行适配层。\n- 经营系统需要技能或工具效果时，先评估是否真的复用 Ability，不要强行耦合。\n\n## 阶段编号基准\n\n后续阶段沿用最初评审规划的编号，不重新合并或改名：\n\n```text\n第二阶段：修复当前会触发的问题\n第三阶段：修复 Ability Core\n第四阶段：配置验证器\n第五阶段：为 JSON 复杂技能预留 Provider\n第六阶段：技能编辑器\n```\n\n动态业务对象注册/注销、中间层生命周期和战斗结束清理属于第二阶段的补充工作，不替代也不改变第三阶段。\n\n## 第二阶段：已完成的当前问题修复\n\n- `ActionRunner` 不再使用静态共享目标列表；每次动作执行租用独立列表并在 `finally` 归还，嵌套 Modifier/Action 不会覆盖外层目标。\n- Poison Cloud 的周期组现在对 Modifier Parent 每秒造成 15 点魔法伤害。首次伤害在 1 秒后发生，持续 6 秒共 6 跳；大帧会补齐已完成周期，但不会执行过期后的额外跳数。\n- 战斗 HUD 采用 `BattlePage + UIEmbeddedPanelGroup`，由父页面完整下发嵌入面板的 Create/Open/Close；Skill、Item、Build、Info、Status、Control 和 MiniMap 不再依赖未触发的子 `UIPanel.OnCreate`。\n- 技能塔以 `TowerLevelConfig` 作为范围、基础伤害、攻击间隔和弹道表现的唯一来源；Ability 只附加冻结、分裂、眩晕等额外行为。技能失败时普通攻击继续，只有实际攻击后才重置攻击计时；Tower Level 会同步到 Ability Level。\n- 同一 Action Group 不再重复配置相同自动特效。`skill_modifier.effectLocation` 不再错误转换为一次性 `OnCreated PlayEffect`，而是映射到由 Modifier 生命周期持有的持续表现句柄。\n- 正式修改只写入 `Data/Excel/skill*.xlsx`，随后使用 Luban 同步生成 JSON/Bin；`skill_luban_excels_fixed` 仍只是历史备份。\n\n## 第三阶段：已完成的 Ability Core 修复\n\n第三阶段处理当前简单数据不容易触发、但复杂技能会立即遇到的 Core 语义问题。\n\n### Modifier 事件作用域\n\n- `DamageTaken` 默认只允许事件目标为 Modifier Parent。\n- `DamageDealt` 默认只允许事件来源为 Modifier Parent。\n- `AbilityExecuted`、`AbilityFullyCast` 默认要求施法者为 Parent 或 Caster。\n- 只有显式声明的特殊情况才允许全局事件。\n- 配置型 Modifier 不得仅按事件类型接收全局广播后直接执行动作；自定义 C# ModifierScript 仍可自行处理全局事件。\n\n### 统一单位最终状态\n\n`AbilitySystem.HasState` 作为技能框架内唯一最终状态来源，合并业务适配器提供的基础状态与 Modifier 状态。伤害、选目标、施法和业务查询都必须通过统一状态检查：\n\n```text\nInvulnerable\nMagicImmune\nUntargetable\nStunned\nSilenced\nRooted\nCommandRestricted\n```\n\n### 施法前摇与中断\n\n前摇结束时重新检查施法者存活、眩晕/沉默、Ability Activated、冷却与资源、目标存活、距离、视野及自定义 `CastFilter`。目标注销时取消仍锁定该目标的前摇或引导；失败不得消耗资源、充能或冷却。\n\n### 其他已记录 Core 缺陷\n\n- 非删除型线性投射物对同一目标只能命中一次。\n- 充能恢复从实际消耗充能后开始，并按完整恢复周期逐层恢复。\n\n### 第三阶段验收\n\n- 对应五项 KnownDefect 测试已全部解除 `Ignore`，并补充前摇结束重跑 `CastFilter`、Modifier 授予 `Untargetable`、显式全局事件、充能大帧补期和 `RootDisables` 行为测试。\n- 复杂事件链、Modifier 嵌套、目标中途失效和穿透投射物行为可预测。\n- Core 仍只依赖抽象接口，不引入任何塔防业务类型。\n\n实现结果：配置型 Modifier 事件默认按 Parent/Caster 关系过滤，只有 `TriggerEventScope = Global` 才接收无关对象事件；伤害、目标过滤、施法和业务适配查询统一通过 `AbilitySystem.HasState` 合并业务基础状态与 Modifier 状态；施法前摇及引导期间会响应死亡、眩晕、沉默、RootDisables 和 CommandRestricted，前摇结束重新验证冷却、资源、目标、距离、视野和自定义过滤；单位注销会中止仍引用该单位的前摇或引导；非删除投射物记录已命中的实体 ID；充能从首次实际消耗开始计时并保留大帧跨周期余量。自动寻敌也改为使用当前 Ability Level、脚本修正后的 CastRange 和 Modifier CastRangeBonus，不再固定读取 1 级配置。\n\n## 第四阶段：已完成的配置验证器\n\n继续使用 Excel，但技能生成前必须完成语义验证：\n\n```text\nID、内部名称及配置来源重复\nAction、Modifier、Projectile、资源和特效引用缺失\nUnitTarget 技能缺少合法目标类型\n周期 Modifier 没有周期动作\n被动技能缺少 Intrinsic Modifier\n未使用技能和孤立 Modifier\n直接或间接循环引用\n塔攻击间隔与技能冷却冲突\n同一特效被自动和显式重复播放\n配置声明了运行时尚不支持的属性\nExcel、生成 JSON/Bin 之间的版本与内容不一致\n```\n\n错误分级：`Error` 禁止生成；`Warning` 允许生成但必须在编辑器显示；`Info` 用于未使用配置和样例数据。验证器同时提供生成流程结果和 Unity Editor 可读报告，并能定位引用链。\n\n实现结果：`AbilityConfigurationValidator` 位于 Ability 配置层，只接收来源无关的配置目录和 Source 元数据，不依赖塔防业务类型；Excel 适配器读取当前权威 `skill*.xlsx`、道具/资源表和塔等级绑定，把问题定位到文件、Sheet、行号、字段与引用链。当前规则覆盖重复 ID/名称/Action 顺序、缺失 Action Group/Modifier/Projectile/资源/特效、UnitTarget 目标、周期动作 Parent 语义、被动 Intrinsic、Modifier 直接/循环引用、塔攻速与技能冷却冲突、重复特效、无效枚举/运行时不支持字段、未引用技能/Modifier/Action Group。空的 `Ability*.xlsx` 仍是未接入脚手架，一旦误填数据会按 Error 阻止生成，避免出现“配置成功但运行时完全不读取”。\n\nUnity 菜单 `Luban/Validate Ability Excel` 可独立校验并把 Error/Warning/Info 输出到 Console；`Luban/Update All` 在修改 XML 或生成前先校验。命令行 `Data/gen_client.bat` 调用同一套验证代码，Error 返回非零退出码并停止 Luban；`gen_all.bat` 也会传播失败，不再带错继续生成 Wave。当前正式 Excel 实测结果为 0 Error、0 Warning、6 Info，Info 均为“未发现配置绑定，可能由 UI/代码显式调用”。\n\n## 第五阶段：已完成的 JSON 复杂技能 Provider 基础\n\nExcel 和 JSON 只负责提供数据，核心继续接收统一的 Ability 定义：\n\n```text\nExcelAbilityDefinitionProvider ┐\n                               ├─ AbilityRegistry\nJsonAbilityDefinitionProvider  ┘\n```\n\n- 一个技能只能来自 Excel 或 JSON 中的一个权威来源。\n- 重复 ID 或名称直接报错，不按加载顺序覆盖。\n- JSON 源目录与 Excel 生成 JSON/Bin 目录分开。\n- 注册记录保留 `SourceType` 和源文件位置，便于报错定位。\n- JSON 技能可以引用全局公共 Modifier；私有 Modifier 建议使用技能命名空间。\n- Excel 和 JSON 都转换为同一套 `AbilityDefinition`、`ModifierDefinition`、`ActionDefinition`，Runtime 不判断来源。\n- 该阶段只建立 Provider 接口、校验和少量复杂技能样例，不急于迁移现有 Excel 技能。\n\n实现结果：Ability core 新增 `IAbilityDefinitionProvider`、`AbilityDefinitionBundle`、`AbilityDefinitionOrigin` 和 `AbilityDefinitionRegistry`。Registry 按技能、Modifier、Projectile 分别检查稳定 ID 与内部名称；Excel/JSON 任一来源发生冲突都会报 Error，保留两侧 SourceType、源文件和引用链，且 `ApplyTo(AbilitySystem)` 直接拒绝整个无效 Registry，不存在“后加载覆盖先加载”。合并后再次验证 Intrinsic、Aura、AddModifier 和 Projectile 引用。\n\n当前 Luban `skill*.xlsx` 由中间层 `ExcelAbilityDefinitionProvider` 转换，不再由 `AbilityManager` 直接逐表写入 Core 注册表；`AbilityManager.AddDefinitionProvider` 可在初始化前追加 JSON 等来源，之后统一合并、校验并一次性应用。JSON 由 `JsonAbilityDefinitionProvider` 转换为相同的 `AbilityDefinition`、`ModifierDefinition`、`ProjectileDefinition` 和 `ActionDefinition`，支持等级数值、Special Value、充能、生命周期动作、事件作用域、属性/状态、Aura、嵌套动作及本地 Projectile。JSON 可以按精确名称引用 Excel 或其他 Provider 的公共 Modifier；私有 Modifier/Projectile 未使用文档 namespace 前缀时会产生 Warning。\n\n手写 JSON 源目录为 `Data/AbilityJsonSources`，与 Luban 生成目录 `Assets/Data/Json` 完全分开；样例 `Samples/chain_reaction.sample.json` 只作为格式和测试数据，不会自动迁移或覆盖现有 Excel 技能。现阶段仍以 Excel Provider 为默认来源，只有显式在初始化前注册的 JSON Provider 才参与运行时。\n\n## 第六阶段：技能编辑器（基础能力已完成）\n\n编辑器分多次实施，不直接从完整节点编辑器开始：\n\n1. 先制作技能配置检查器：搜索、筛选、引用关系、错误定位和只读预览。\n2. 再制作普通字段表单和 JSON 树形编辑，支持复制子效果、折叠嵌套和局部校验。\n3. 实际复杂技能数量和重复维护成本足够高时，再扩展完整节点编辑器。\n\n编辑器必须修改权威源文件并复用第四、第五阶段的校验和 Provider 管线，不得直接修改生成 JSON/Bin。\n\n同时提供只读运行时调试窗口，查看中间层注册对象、稳定实体 ID、技能阶段/冷却/充能、Modifier 状态与属性贡献、目标过滤与 Action 链、投射物/Thinker/持续表现，以及注销或战斗结束后的残留对象。\n\n第六阶段完成标准：配置人员可以追踪任意技能的引用链；复杂 JSON 技能经过项目级合并校验后可以安全编辑；运行时调试窗口可以证明对象注销后没有残留技能、Modifier、投射物、Thinker 和表现句柄。是否继续扩大完整图编辑器，由实际技能样本决定。当前只完成单文件 JSON 表单和单 Provider 校验，项目级 Excel + 全部 JSON 合并校验仍列入下方 TODO。\n\n第一轮实现位于 Unity 菜单 `Tools/Ability/Workbench`，包含三个页签：\n\n- **Excel 检查器**：复用第四阶段验证器，显示 Error/Warning/Info 数量，支持搜索、严重级别筛选、源文件定位、技能只读字段、Action Group 及其 Modifier 引用关系。它只读取权威 Excel，不修改 Luban 生成 JSON/Bin。\n- **JSON 编辑**：打开或新建 `Data/AbilityJsonSources` 下的文档，以 Unity SerializedProperty 树形表单折叠编辑 Ability、Modifier、Projectile、Special Value 和 Action 数组；数组元素可使用 Unity 标准数组菜单复制。保存前把当前内存文档交给 `JsonAbilityDefinitionProvider + AbilityDefinitionRegistry` 做单文件校验，存在 Error 时拒绝写盘。当前不会同时加载 Excel 和其他 JSON，因此不能在这里最终证明跨来源引用、名称和 Stable ID 没有冲突。保存会格式化 JSON，不保留注释和未知字段，窗口中已明确提示。\n- **运行时调试**：Play Mode 下每 0.25 秒显示中间层业务对象 ID 到稳定 Runtime EntityId 的绑定，以及技能 Level/Phase/Cooldown/Charges、Modifier 剩余时间/状态/属性贡献、Projectile、Thinker 和持续表现句柄。`AbilitySystem.CreateRuntimeSnapshot` 只返回框架中立快照；业务对象名称和绑定信息仍由中间层补充。对象注销或战斗结束后，列表应归零，已有回归测试覆盖快照和表现句柄在 `RemoveUnit` 后清空。\n\n持续表现现在通过 `IPresentationHandle` 建立可停止生命周期：Modifier 创建时请求句柄，移除、对象注销和战斗清理时统一停止；`TdPresentation` 即使异步资源在停止后才加载，也会立即销毁实例，避免结算后“迟到特效”；调试快照可枚举活动句柄。至此第六阶段的 Excel 检查、单文件 JSON 表单和只读运行时证明链已经具备。完整节点图编辑器仍按原计划暂不制作，它是根据真实复杂技能数量决定的可选扩展，不是当前完成条件。\n\n## 完整检查后的 TODO（2026-07-18）\n\n本节来自对 Ability Core、配置/Provider、塔防适配层、Npc/Tower/Base 实际调用链、当前 7 个技能及现有测试的完整检查。它是原第二至第六阶段之后的修正和补强清单，不改变前面的阶段编号。当前结论是：简单 Excel 技能的基础链路可继续使用；JSON 只完成定义层基础，尚未端到端接入业务；复杂 Dota 式事件技能还不能直接投产。\n\n### P1：复杂技能投入前必须完成\n\n- [ ] **Action 与事件递归保护**：为一次施法/事件链增加最大嵌套深度、最大 Action 数和可诊断的中止原因；为 Modifier 周期补偿增加单帧最大触发数，防止 `DamageTaken -> Damage -> DamageTaken`、ModifierAdded 链和极小 Interval 卡死主线程。\n- [ ] **战斗事件入口**：在 Core 提供受控的业务事件通知 API，由中间层接入 `AttackStart`、`AttackLanded` 和 `Death`；当前这些事件可以配置和通过验证，但业务从未广播它们。\n- [ ] **点目标空放规则**：`CastAbilityAtBestTarget` 找不到目标时不能默认向 Caster 位置成功释放 Frost Nova、Poison Cloud 等技能并消耗资源。需要返回 `InvalidTarget`，或为允许空地释放的技能增加明确配置。\n- [ ] **运行时能力矩阵**：逐项确认并实现或禁用 `ArmorBonus`、`HealthRegen`、`CooldownReductionPercent`、`Disarmed`、`Muted`、`Hexed`、`OutOfGame`、`NoUnitCollision`、`NonLethal/HpLoss/IgnoreBlock`、`CastBackswing`、`AutoCast`、`Immediate`、`Queue` 和 Projectile Vision。未实现能力必须由 Excel/JSON 验证器按 Error 阻止，不能静默加载。\n- [ ] **独立 Modifier 动作**：修复 `AddModifierToNpc/Tower/Base` 产生的无 Ability Modifier。当前 `ActionRunner` 要求 `context.Ability != null`，导致这类 Modifier 的 OnCreated、Interval、Trigger 和 OnDestroy 配置动作静默不执行。\n- [ ] **自定义脚本清理重入**：战斗清理期间禁止或安全处理自定义 `AbilityScript/ModifierScript.OnRemoved/OnDestroy` 再创建 Ability、Modifier、Thinker 或表现句柄，确保新建对象不会被容器直接丢弃。\n\n### P1：JSON 真正接入业务\n\n- [ ] **Provider 加载清单**：建立明确的 JSON 源清单和启动加载器，在 `AbilityManager.Initialize` 之前注册批准的 JSON Provider；示例目录继续不自动加载。\n- [ ] **来源无关的技能键**：业务门面不能只接收 Excel `int skillId`。建立可同时表示 Excel ID 和 JSON Stable ID/Name 的 Ability Key，并提供不泄漏 `IUnit`、Core `CastResult` 的 Npc/Tower/Base 添加与释放接口。\n- [ ] **资源和业务绑定**：定义 JSON 技能如何选择业务资源、进入技能栏、绑定 TowerLevel/单位模板，以及如何显示本地化名称、描述和图标。完成之前，JSON Ability 即使进入 Registry 也无法通过正常业务入口使用。\n- [ ] **项目级合并校验**：Workbench 和命令行校验必须一次加载权威 Excel、全部启用 JSON 和业务绑定，检查跨来源公共 Modifier 引用、名称/Stable ID 冲突、资源及表现引用。单文件 Provider 校验只能作为局部反馈。\n- [ ] **严格 JSON 语义校验**：补 Behavior/Target/State/Attribute/Event/DamageType/DamageFlags、LevelValue、Charges、持续时间、Projectile 参数、被动 Intrinsic、Toggle 行为、Modifier 环和事件反馈环检查；未知字段和拼写错误不能由 JsonUtility 静默忽略。\n- [ ] **真实复杂技能验收**：至少制作两个实际由业务加载的 JSON 技能，一个覆盖 Projectile Hit/事件链，一个覆盖 Aura/Thinker/周期区域；不能只使用“创建投射物后立即对原目标伤害”的样例证明投射物技能完成。\n\n### P1：当前业务表现与技能语义\n\n- [ ] **实际音效适配**：`TdPresentation.PlaySound` 当前只输出日志。接入正式音频服务，并统一 Excel 数字声音 ID 与 JSON 资源名的解析规则。\n- [ ] **Modifier 表现字段拆分**：将单一 `effectLocation` 拆为 `onApplyEffect`、`loopEffect`、`onRemoveEffect`。当前 Modifier 使用非循环 `IceHitEffect.prefab` 作为持续句柄，粒子结束后空对象会保留到 Modifier 销毁；Action 命中特效与 Modifier 特效还可能重复播放。\n- [ ] **Projectile 逻辑与表现绑定**：投射物表现必须跟随 Core Projectile 位置并在销毁时停止；线性投射物改为线段/扫掠检测，避免低帧率或高速穿透；Tracking Projectile 增加最大距离或寿命；处理战斗结束后异步加载的一次性特效。\n- [ ] **Poison Cloud 设计确认**：当前实现是“释放瞬间给范围内单位添加 6 秒 DoT”，不是持续地面云，后来进入范围的单位不会中毒。若设计要求真正毒云，应使用 Thinker/区域 Modifier；否则修改名称和说明，避免配置语义误解。\n- [ ] **Attack Speed Aura 设计确认**：`50001001` 当前没有业务绑定，也不是真正 Aura，只是拥有者自身的 Intrinsic AttackSpeed Buff。决定是实现范围 Aura，还是更名为 Self Buff 并明确绑定对象。\n- [ ] **塔技能等级**：Legacy Excel 转换需要明确等级策略。当前 `AbilityDefinition.MaxLevel` 默认为 1，Tower Level 2/3 虽传入 Ability，最终仍会 Clamp 为 1；在加入等级技能前必须修复或明确全部附加行为保持常量。\n\n### P2：中间层边界与扩展性\n\n- [ ] **收紧业务门面**：减少公开 `AbilityManager.Engine`、`IUnit`、Core `CastResult`、`AbilityScript` 等类型；MapManager、TowerManager 等业务代码使用中间层自己的结果 DTO 和失败原因，避免 Core 类型继续扩散。\n- [ ] **通用动态对象绑定**：把 Npc、Tower、Base 三套硬编码字典和 `TdUnitKind` switch 收敛为适配器/绑定注册表，使召唤物、陷阱和其他动态目标只注册新适配器，不修改多处分支。\n- [ ] **统一单位身份语义**：Core 中状态、属性、Purge、Modifier 刷新等路径统一按稳定 EntityId 或明确的身份比较器判断同一单位，不能一部分按引用、一部分按 EntityId。当前 TdUnit 缓存只能保证已有三类对象不触发问题。\n- [ ] **移出塔防专属验证**：`TowerAbilityBindingRecord` 和塔攻击间隔规则从 `Game.Ability.Configuration` 移到塔防/Editor 验证扩展，保持 Core 配置层的业务中立。\n- [ ] **定义重载/重初始化**：明确 `AbilitySystem.Initialize` 是否清空定义和脚本工厂。当前只清运行时，删除或禁用的定义可能留在 Engine；若支持重新加载配置，需要原子替换 Definition Registry。\n- [ ] **死亡和治疗闭环**：死亡事件应在 HP 首次降为 0 时立即进入技能事件链，而不是等待异步死亡动画结束后注销；治疗通过业务 Manager/事件更新，而不是由 TdUnit 直接修改 NpcData，确保 UI、统计和任务系统收到一致通知。\n\n### P2：规模与性能\n\n- [ ] Modifier 按 Parent EntityId 建索引，避免每个单位每帧查询状态/属性时扫描全局 Modifier。\n- [ ] `IWorld` 接入空间索引；Projectile、Aura、AOE 不再每次扫描全部 Npc/Tower/Base。\n- [ ] 复用 Targeting、FindUnits、Projectile 和 Ability Update 的临时集合，减少战斗帧 GC。\n- [ ] 统一 Modifier、Thinker、Charge 在大帧下的周期补偿语义，并为补偿次数设置上限。\n\n### 测试与验收 TODO\n\n- [ ] 为事件递归预算、AttackLanded/Death、独立 Modifier、点目标空放、扫掠投射物、Tracking Projectile 生命周期和自定义清理重入增加 Core 回归测试。\n- [ ] 建立 `AbilityManager + TdUnit + TdWorld + TdPresentation` 的中间层测试，覆盖注册、对象替换、死亡、出售、升级替换、Base 清理和战斗结束。\n- [ ] 对 Fireball、Frost Nova、Ice Tower Shot、Heal、Poison Cloud、Stun Bolt、Attack Speed Aura 建立数据到业务结果的端到端验收，不能只验证表行和转换结果。\n- [ ] JSON 测试必须覆盖 Excel + 多 JSON 同时加载、跨来源引用/冲突、业务资源消耗、UI/Tower 绑定和 Release 后零残留。\n- [ ] 当前相关测试源码共有 44 个，项目编译与配置验证通过；按此前约定尚未执行 Unity Test Runner。正式发布前仍需在 Unity 中实际执行 EditMode/Integration 测试并保存结果。\n\n### 延后事项\n\n- [ ] 完整节点技能编辑器继续延后。先完成运行时安全、JSON 业务接入和项目级校验，再根据真实复杂技能数量决定是否制作。\n- [ ] `Assets/Scripts/Skill` 旧框架当前没有业务调用。待 Ability 端到端测试稳定并确认没有外部反射/资源引用后，再标记 Obsolete、迁移文档并最终删除，避免两套技能概念重新进入业务。\n"

    "path": "Modules/MapAndTileArt.md",
    "summary": "地图地块美术当前方向和不继续的旧方案。",
    "content": "# Map And Tile Art\n\n本文记录地图美术当前方向。地图运行时数据见 `Docs/Architecture/MapRuntime.md`。\n\n## 当前结论\n\n第一阶段不要做复杂邻接融合。\n\n当前方向：\n\n```text\n完整基础地块 prefab\n+ 自动顶部装饰 prefab\n+ 统一材质和柔和光照\n```\n\n目标：\n\n```text\n单个地块好看\n直接相邻也能接受\n不依赖邻居规则才好看\n先完成可用美术资源，再考虑过渡系统\n```\n\n## 暂不继续的旧方案\n\n第一阶段不要继续：\n\n```text\nTopSurface\nTopicTop\nShader 邻接融合\n5-slice / 9-slice 地块切片\n按邻居动态换边缘\n大量一次性生成菜单工具\n```\n\n## 地块结构\n\n推荐结构：\n\n```text\nTileRoot\n  Topic\n    TopBody\n  Base\n    Soil\n    Rock\n```\n\n规则：\n\n```text\n尺寸：1 x 1 x 1\n外轮廓：规则方形，保证稳定拼接\n顶部：可以圆角、柔和、有固定风格\n细节：靠自动装饰补，不烤进基础模型\n```\n\n## 顶部装饰\n\n顶部装饰使用独立 prefab：\n\n```text\nGrass -> grass clump / flower / pebble\nWater -> lily pad / reed / stone\nSnow -> snow lump / dead grass\nHill -> pebble / dry grass\nRoad -> pebble / footprint / crack\n```\n\n当前测试资源：\n\n```text\nAssets/Arts/Map/Tiles/Generated/Decorations/GrassClump_A.prefab\nAssets/Arts/Map/Tiles/Generated/Decorations/SmallFlower_A.prefab\nAssets/Arts/Map/Tiles/Generated/Decorations/Pebble_A.prefab\n```\n\n## Grass 原型\n\n```text\nAssets/Arts/Map/Tiles/Generated/ReferenceStyleGrassTile.blend\nAssets/Arts/Map/Tiles/Generated/ReferenceStyleGrassTile.fbx\nAssets/Arts/Map/Tiles/Generated/ReferenceStyleGrassTile_preview.png\nAssets/Arts/Map/Tiles/Generated/ReferenceStyleGrassTile_Test.prefab\n```\n\n生成脚本：\n\n```text\nTools/Art/Blender/create_reference_grass_tile.py\n```\n\n`ReferenceStyleGrassTile_Test.prefab` 是测试 prefab，不是最终 Grass prefab。\n\n## 材质方向\n\n```text\nTileTopSoftLit.shader\nGrassTop_Stylized.mat\nSnowTop_Stylized.mat\nRoadTop_Stylized.mat\nWaterTop_Stylized.mat\n```\n\n目标：\n\n```text\n柔和\n卡通\n商业化\n不要过度写实\n不要强烈噪声\n不同地块颜色要区分，不要一片单调绿\n```\n\n## 注意\n\n- 自动装饰要低密度，不能遮住地块本体。\n- 基础 tile 本身必须好看，装饰只是加分。\n- 地图编辑器和运行时都应以当前正式 prefab 为准。\n- 不要为了测试资源直接覆盖正式地块，先做预览确认。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },
