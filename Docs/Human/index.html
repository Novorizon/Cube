<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cube 项目文档</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --panel: #ffffff;
      --panel-soft: #fbfaf7;
      --text: #202124;
      --muted: #667085;
      --line: #ded8cb;
      --blue: #315fbd;
      --teal: #0f766e;
      --amber: #b45309;
      --shadow: 0 18px 40px rgba(32, 33, 36, .08);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      line-height: 1.65;
    }

    button, input {
      font: inherit;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: #fdfcf9;
    }

    .brand {
      padding: 22px 22px 16px;
      border-bottom: 1px solid var(--line);
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .search-area {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .search-input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text);
      background: var(--panel);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(49, 95, 189, .13);
    }

    .nav-scroll {
      flex: 1;
      overflow: auto;
      padding: 10px 12px 18px;
    }

    .nav-group {
      margin: 10px 0 16px;
    }

    .nav-group-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 40px;
      margin: 0 4px 8px;
      border-left: 4px solid var(--teal);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      background: #f1ede4;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .nav-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 25px;
      height: 22px;
      border: 1px solid #d8d0c2;
      border-radius: 11px;
      padding: 0 7px;
      color: var(--muted);
      background: var(--panel);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .doc-button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 10px 10px;
      margin: 3px 0;
      text-align: left;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    .doc-nav-entry {
      position: relative;
    }

    .doc-nav-entry.has-outline .doc-button {
      padding-right: 42px;
    }

    .doc-outline-toggle {
      position: absolute;
      z-index: 1;
      top: 7px;
      right: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      transform: rotate(0deg);
      transition: transform .16s ease, background .16s ease;
    }

    .doc-outline-toggle:hover {
      color: var(--blue);
      background: rgba(49, 95, 189, .1);
    }

    .doc-nav-entry.outline-expanded .doc-outline-toggle {
      transform: rotate(90deg);
    }

    .doc-outline {
      display: none;
      margin: 2px 8px 8px 17px;
      border-left: 1px solid #d8d0c2;
      padding: 2px 0 3px 10px;
    }

    .doc-nav-entry.outline-expanded .doc-outline {
      display: block;
    }

    .doc-heading-button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 5px;
      padding: 5px 7px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      line-height: 1.35;
      letter-spacing: 0;
      text-align: left;
      overflow-wrap: anywhere;
      cursor: pointer;
    }

    .doc-heading-button:hover {
      color: var(--text);
      background: #f1ede4;
    }

    .doc-heading-button.active {
      color: #173b82;
      background: #eaf0ff;
      font-weight: 700;
    }

    .doc-button:hover {
      background: #f1ede4;
    }

    .doc-button.active {
      background: #eaf0ff;
      color: #173b82;
      box-shadow: inset 3px 0 0 var(--blue);
    }

    .doc-button strong {
      display: block;
      font-size: 14px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .doc-button span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .main {
      min-width: 0;
      padding: 24px clamp(20px, 4vw, 52px) 60px;
    }

    .mobile-topbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .menu-button,
    .small-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      min-height: 36px;
      padding: 7px 12px;
      cursor: pointer;
    }

    .menu-button:hover,
    .small-button:hover {
      border-color: #b8b0a2;
      background: #fdfaf3;
    }

    .doc-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      margin: 0 auto 18px;
      max-width: 1120px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--teal);
      font-size: 13px;
      font-weight: 700;
    }

    .doc-title {
      margin: 4px 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .doc-summary {
      margin: 0;
      max-width: 760px;
      color: var(--muted);
      font-size: 16px;
    }

    .source-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .source-path {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--muted);
      background: rgba(255,255,255,.7);
      font-size: 12px;
      white-space: nowrap;
    }

    .content-layout {
      display: grid;
      grid-template-columns: minmax(0, 860px) minmax(190px, 240px);
      gap: 28px;
      align-items: start;
      max-width: 1120px;
      margin: 0 auto;
    }

    .reader {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: clamp(22px, 3vw, 36px);
    }

    .toc {
      position: sticky;
      top: 22px;
      max-height: calc(100vh - 44px);
      overflow: auto;
      border-left: 2px solid var(--line);
      padding-left: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .toc-title {
      margin: 0 0 8px;
      color: var(--text);
      font-weight: 700;
    }

    .toc a {
      display: block;
      padding: 4px 0;
      color: var(--muted);
      text-decoration: none;
    }

    .toc a:hover {
      color: var(--blue);
    }

    .toc a.level-3 {
      padding-left: 12px;
      font-size: 12px;
    }

    .reader h1,
    .reader h2,
    .reader h3,
    .reader h4 {
      line-height: 1.3;
      letter-spacing: 0;
    }

    .reader h1 {
      margin: 0 0 18px;
      font-size: 32px;
    }

    .reader h2 {
      margin: 34px 0 12px;
      padding-top: 4px;
      font-size: 24px;
      border-top: 1px solid #eee8db;
    }

    .reader h3 {
      margin: 26px 0 10px;
      font-size: 19px;
    }

    .reader h4 {
      margin: 22px 0 8px;
      font-size: 16px;
    }

    .table-index {
      margin: 18px 0 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .table-index-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
    }

    .table-index-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .table-index-note {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .table-index-table-wrap {
      overflow-x: auto;
    }

    .table-index-table {
      min-width: 560px;
      border-collapse: collapse;
      background: var(--panel);
    }

    .table-index-table thead th {
      color: var(--text);
      background: #eae4d8;
      font-size: 13px;
    }

    .table-index-table tbody th {
      width: 180px;
      color: var(--text);
      background: #f7f3eb;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .table-index-links {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 14px;
    }

    .reader .table-index-link {
      display: inline-block;
      border-bottom: 0;
      color: var(--blue);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .reader .table-index-link:hover {
      border-bottom: 0;
      text-decoration: underline;
    }

    .table-section {
      margin: 18px 0 22px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--teal);
      border-radius: 8px;
      background: var(--panel);
      scroll-margin-top: 18px;
    }

    .table-section > summary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 12px 15px;
      cursor: pointer;
      list-style: none;
      background: #f4efe5;
      font-size: 18px;
      font-weight: 700;
    }

    .table-section > summary::-webkit-details-marker {
      display: none;
    }

    .table-section > summary::before {
      content: "›";
      flex: 0 0 auto;
      color: var(--teal);
      font-size: 25px;
      line-height: 1;
      transform: rotate(0deg);
      transition: transform .16s ease;
    }

    .table-section[open] > summary {
      border-bottom: 1px solid var(--line);
    }

    .table-section[open] > summary::before {
      transform: rotate(90deg);
    }

    .table-section-title {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .table-section-hint {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .table-section-hint::after {
      content: "展开";
    }

    .table-section[open] .table-section-hint::after {
      content: "收起";
    }

    .table-section-body {
      padding: 8px 16px 12px;
    }

    .table-section-body > p:first-child {
      margin-top: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee8db;
    }

    .table-section-body > p:first-child::before {
      content: "说明";
      display: inline-block;
      margin-right: 8px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
    }

    .reader p {
      margin: 10px 0;
    }

    .reader .definition {
      margin: -6px 0 14px 0;
      color: var(--muted);
    }

    .reader ul,
    .reader ol {
      padding-left: 1.25rem;
      margin: 10px 0 14px;
    }

    .reader li {
      margin: 4px 0;
    }

    .reader a {
      color: var(--blue);
      text-decoration: none;
      border-bottom: 1px solid rgba(49, 95, 189, .25);
    }

    .reader a:hover {
      border-bottom-color: var(--blue);
    }

    .reader code {
      border-radius: 5px;
      padding: 2px 5px;
      background: #f2eee6;
      color: #5d3b00;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: .92em;
    }

    .reader pre {
      overflow: auto;
      border: 1px solid #e1d8c8;
      border-radius: 8px;
      padding: 14px 16px;
      background: #f2eee6;
      color: #5d3b00;
      line-height: 1.55;
    }

    .reader pre code {
      padding: 0;
      color: inherit;
      background: transparent;
      font-size: 13px;
    }

    .table-wrap {
      overflow-x: auto;
      margin: 14px 0 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 560px;
      background: var(--panel);
    }

    th,
    td {
      border-bottom: 1px solid #ebe4d8;
      padding: 9px 11px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f4efe5;
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td.merged-group-cell {
      width: 150px;
      vertical-align: middle;
      color: var(--text);
      background: #faf7f1;
      font-weight: 700;
    }

    blockquote {
      margin: 16px 0;
      border-left: 4px solid var(--amber);
      padding: 8px 14px;
      color: #5f4b32;
      background: #fff7e7;
    }

    mark {
      background: #fde68a;
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }

    .empty-state {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 980px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        z-index: 20;
        inset: 0 auto 0 0;
        width: min(86vw, 340px);
        transform: translateX(-105%);
        transition: transform .2s ease;
        box-shadow: 20px 0 40px rgba(0,0,0,.16);
      }

      body.nav-open .sidebar {
        transform: translateX(0);
      }

      .mobile-topbar {
        display: flex;
      }

      .main {
        padding-top: 16px;
      }

      .doc-header {
        grid-template-columns: 1fr;
      }

      .source-actions {
        justify-content: flex-start;
      }

      .content-layout {
        grid-template-columns: 1fr;
      }

      .toc {
        position: static;
        border-left: 0;
        border-top: 1px solid var(--line);
        padding: 14px 0 0;
        order: -1;
      }
    }

    @media (max-width: 640px) {
      .table-section > summary {
        align-items: flex-start;
      }

      .table-section-body {
        padding-inline: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="文档导航">
      <div class="brand">
        <h1>Cube 项目文档</h1>
        <p>Markdown 作为数据源，HTML 提供阅读界面。</p>
      </div>
      <div class="search-area">
        <input id="searchInput" class="search-input" type="search" placeholder="搜索文档标题、路径和内容" autocomplete="off">
      </div>
      <nav id="navList" class="nav-scroll"></nav>
    </aside>

    <main class="main">
      <div class="mobile-topbar">
        <button id="openNavButton" class="menu-button" type="button">目录</button>
        <span class="source-path">Docs/Human/index.html</span>
      </div>

      <header class="doc-header">
        <div>
          <div id="docGroup" class="eyebrow"></div>
          <h2 id="docTitle" class="doc-title"></h2>
          <p id="docSummary" class="doc-summary"></p>
        </div>
        <div class="source-actions">
          <span id="docPath" class="source-path"></span>
          <a id="rawLink" class="small-button" href="#" target="_blank" rel="noreferrer">Markdown 源文件</a>
        </div>
      </header>

      <section class="content-layout">
        <article id="reader" class="reader"></article>
        <aside id="toc" class="toc" aria-label="本文目录"></aside>
      </section>
    </main>
  </div>

  <script>
    const docs = [
  {
    "id": "readme-md",
    "group": "入口",
    "title": "文档总入口",
    "path": "README.md",
    "summary": "项目文档总入口和按任务选读指南。",
    "content": "# Cube Docs\n\n本目录是项目文档入口。新对话不要默认阅读所有文档；先按任务选入口，只读必要模块。\n\n## Codex 快速入口\n\n先读：\n\n```text\nDocs/CodexProjectMemory.md\n```\n\n然后按任务继续：\n\n| 任务 | 继续阅读 |\n| --- | --- |\n| UI 框架、关闭规则、Stack、Exclusive | `Architecture/UIFramework.md` |\n| 背景音乐、普通音效、音量设置 | `Architecture/AudioSystem.md` |\n| 不确定模块该看哪些表、工具、文件 | `Architecture/ModuleWorkMap.md` |\n| 经营主界面、Bag、Build、ToolKit、Quest、TechTree | `Modules/ManagementUI.md` |\n| 岛屿经营业务、资源、工具、农田、建筑 | `Product/ManagementMode.md`、`Modules/Island.md` |\n| Story 剧情播放和触发 | `Modules/Story.md`、`Product/ProgressionAndQuests.md` |\n| Quest / Blueprint | `Modules/QuestStoryBlueprint.md`、`Product/ProgressionAndQuests.md` |\n| 数据表、Luban、本地化 | `Architecture/DataPipeline.md`、`Architecture/ExcelDataDictionary.md` |\n| 项目级代码参数、时间比例、表现微调 | `Architecture/GameConfig.md` |\n| 地图运行时、小地图标记 | `Architecture/MapRuntime.md`、`Decisions/0003-map-object-vs-marker.md` |\n| 地块美术 | `Modules/MapAndTileArt.md` |\n| 塔防和技能 | `Product/TowerDefenseMode.md`、`Modules/TowerDefense.md`、`Modules/AbilityAndSkill.md` |\n| 命名、移动脚本、Prefab 安全 | `Decisions/0001-naming-rules.md`、`Architecture/CodebaseOverview.md` |\n| 项目中期审核、风险清单 | `Audits/ProjectMidpointAudit-2026-07-09.md` |\n| 项目模块盘点、开发文档排期、飞书表格导入 | `Planning/项目开发模块与文档排期_飞书粘贴版.tsv` |\n\n## 文档结构\n\n```text\nDocs\n  Architecture   底层框架、数据、地图、存档、消息\n  Product        游戏整体和产品流程\n  Modules        具体业务模块\n  Decisions      需要反复引用的决策\n  Audits         阶段性审核、风险清单、整理记录\n  Planning       模块清单、排期和可导入协作表格\n  Human          人类阅读入口 HTML\n```\n\n`Docs/Human/index.html` 是人类阅读入口，Markdown 仍是源文档。HTML 页面由 `Docs/Human/build-human-docs.ps1` 读取 Markdown 后生成，不要把长期内容只改在 HTML 里。\n\n刷新人类阅读页面：\n\n```text\npowershell.exe -ExecutionPolicy Bypass -File Docs/Human/build-human-docs.ps1\n```\n\n## 当前开发重点\n\n当前重点是岛屿经营主循环：\n\n```text\nStory -> Quest -> 采集 -> Blueprint -> 建造 / 农田 / 科技 -> 更多内容\n```\n\n塔防模式保留为独立战斗模式，结算后通过明确奖励流程回写经营长期数据。\n\n## 全局硬规则\n\n- 新代码默认不要加 `World` 或 `Game` 前缀；已有 `World*` 类名短期保留。\n- 新增 Luban / Excel 表同样不要加 `World` 或 `Game` 前缀；已有 `world_*` 表是历史命名，短期保留，不作为新表命名模板。\n- 任务域使用 `Quest`，不要改成 `Task`。\n- 制作 / 生产配置使用 `Blueprint`，不要新增 `Recipe` 或 `WorldRecipe`。\n- 重新生成配置统一执行 `Data/gen_all.bat`，不要单独建议执行 `Data/gen_client.bat`。\n- UI 节点优先通过 prefab 序列化字段绑定，不运行时按名字动态 `Find` 常驻节点。\n- 移动 Unity 脚本必须保留 `.meta`，不要为了整理随意重命名已挂 Prefab 的脚本。\n- 重要框架规则、业务流程、命名约定、易踩坑细节或长期设计决策发生变化时，必须同步更新对应 Markdown 源文档；改完后重新生成 `Docs/Human/index.html`。不要只把长期规则写在聊天记录或 HTML 里。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },
  {
    "id": "codexprojectmemory-md",
    "group": "入口",
    "title": "Codex 项目记忆",
    "path": "CodexProjectMemory.md",
    "summary": "给 Codex 新对话使用的最小项目记忆。",
    "content": "# Codex Project Memory\n\n这是给 Codex 新对话的最小入口，不是完整设计文档。读完本文件后，只按当前任务继续读相关模块。\n\n## Project Basics\n\n```text\nWorkspace: D:\\Cube\nEngine: Unity 2022\nUser language: Chinese\nMain direction: island survival / island management, with separate tower-defense combat mode\nCurrent focus: management UI, Story -> Quest flow, Blueprint production, data-driven configuration\n```\n\n重要路径：\n\n```text\nAssets/Scripts/Framework\nAssets/Scripts/Game\nAssets/Scripts/Game/UI/Management\nAssets/Scripts/Game/Island\nAssets/Scripts/Game/Quests\nAssets/Scripts/Game/Story\nAssets/Scripts/Game/Blueprints\nAssets/Scripts/Game/Data/Generated\n\nAssets/Arts/UI/Panels\nAssets/Arts/UI/Icons\nAssets/Arts/Map\n\nData/Excel\nData/Defines\nAssets/Data/Bin\nAssets/Data/Json\nDocs\n```\n\n## Read Only What You Need\n\n```text\nUI framework work:\n  Docs/Architecture/UIFramework.md\n\nManagement UI work:\n  Docs/Architecture/UIFramework.md\n  Docs/Modules/ManagementUI.md\n\nModule tables / tools / related files:\n  Docs/Architecture/ModuleWorkMap.md\n\nIsland gameplay work:\n  Docs/Product/ManagementMode.md\n  Docs/Modules/Island.md\n\nQuest / Story / Blueprint work:\n  Docs/Modules/QuestStoryBlueprint.md\n  Docs/Product/ProgressionAndQuests.md\n\nStory-only work:\n  Docs/Modules/Story.md\n  Docs/Product/ProgressionAndQuests.md\n\nData / Luban / localization work:\n  Docs/Architecture/DataPipeline.md\n\nMap / minimap / tile art work:\n  Docs/Architecture/MapRuntime.md\n  Docs/Modules/MapAndTileArt.md\n\nTower defense / ability work:\n  Docs/Product/TowerDefenseMode.md\n  Docs/Modules/TowerDefense.md\n  Docs/Modules/AbilityAndSkill.md\n\nNaming or file movement:\n  Docs/Decisions/0001-naming-rules.md\n  Docs/Architecture/CodebaseOverview.md\n\nProject audit / cleanup:\n  Docs/Audits/ProjectMidpointAudit-2026-07-09.md\n```\n\n## Hard Rules\n\n- New code defaults to no `World` or `Game` prefix. Existing `World*` classes may stay because Prefabs and serialized data may reference them.\n- New Luban / Excel tables follow the same rule: do not add `World` or `Game` prefixes. Existing `world_*` tables are historical and should not be used as templates for new tables; use `tool.xlsx` / `ToolConfig` / `TbTool`, not `world_tool.xlsx` / `WorldToolConfig` / `TbWorldTool`.\n- Quest domain uses `Quest`, not `Task`, and not `WorldQuest`.\n- Production / crafting config uses `Blueprint`, not `Recipe` or `WorldRecipe`.\n- Story save model is `StorageManager.StoryData`, reached through `SaveData.Story`; do not recreate `Assets/Scripts/Game/Story/StoryData.cs`.\n- Bag domain uses `Bag`, not `Inventory`; do not create new bag code or UI folders named `Inventory`.\n- Regenerate data with `Data/gen_all.bat`; do not suggest running only `Data/gen_client.bat`.\n- Runtime config source is `Assets/Data/Bin/*.bytes`; JSON is for inspection and debugging.\n- Do not manually edit Luban generated code or generated data as a lasting solution.\n- Move Unity scripts with `.meta`; do not delete and recreate scripts that may be referenced by Prefabs.\n- UI nodes should be wired through serialized fields. Do not reintroduce runtime `Transform.Find` for stable HUD nodes.\n- Avoid changing Prefab layout from runtime code unless the script is explicitly responsible for generated lists, grids, or layout.\n- The current shell is Windows PowerShell 5.1. Prefer simple commands and single-quoted `rg` patterns; split complex searches instead of using dense quoted regex.\n\n## Current UI Agreements\n\n- UI framework identity is currently `prefabPath`; `Show`、`Hide`、`IsShown` all work by path.\n- `RightOutside` supports desktop right-click outside close. Mobile touch / click outside is mapped by the framework.\n- Common management panels should support `CloseButton | Back | RightOutside`.\n- Panel outside close is handled by the framework-created bottom `PanelOutsideBlocker` + `UIOutsideClickDetector` + `PanelManager`; Panel no longer creates outside mask objects.\n- A panel's visual `Overlay` must not receive raycasts or bind its own close handler. `PanelOutsideBlocker` is below every UI layer, so it catches blank space without blocking normal UI.\n- Outside close consumes the pointer for that frame through `UIManager`; world input must call `WorldPointerPicker.IsPointerOverUi()` so a right-click that closes Quest / TechTree does not also move or interact in the world.\n- BottomBar 入口状态图标目前只用于 Bag 的 Open / Close 箭头。Build / ToolKit 没有 Open / Close 状态图标设计，不要补。\n- Exclusive group is for same-level independent panels, currently Build / ToolKit / Production / Quest / TechTree / Menu. Bag is a BottomBar child node and is coordinated locally with those panels.\n- Stack group is for panel-level return history. Do not split ordinary child nodes into `UIPanel` just to use Stack.\n- Sound / Language / Save currently exist as independent UIPanel and can use Stack short term. Product-wise they are closer to Menu internal pages and can later become serialized child nodes under Menu.\n- Tooltip 使用 `UIManager.Instance.Tooltips`、全局唯一 `TooltipView` 和 `UILayer.Tooltip = 35`；外部 API 是 `Show` / `Hide`。每个 Tooltip 都必须有 `TooltipData` 来源：固定内容来自 Trigger，动态塔 / 物品 / 技能由各自可复用 View 按业务 ID 统一 `Bind`，已有 Pointer 组件可直接调用 Manager；不要误解成只有塔需要提供数据。`TooltipTrigger` 不带 UI 前缀且没有视觉职责。Tooltip prefab 必须关闭 raycast，并在离开、点击、拖拽、禁用或 UI 清理时隐藏。\n\n## Current Feature Status\n\nData:\n\n```text\nQuest / Blueprint / Story 已接入正式 Luban 表\nAbility / Skill / Item / Localization / Map / Tower / Wave / Tech / World* 表也在 Tables 中\n```\n\nManagement UI:\n\n```text\nWorldMainPanel 是常驻 HUD 容器\nTopBar / BottomBar / EntryBar / RightBar / BuildingDetail 是 prefab 上的 MonoBehaviour 子模块\nRightBar/BattleEntry 是经营到塔防的模式入口，当前调用 MapManager.Instance.LoadBattleMap(30950001)\nBuild / ToolKit / Production / Quest / TechTree / Menu 入口由 WorldPanelEntryController 注册\nBag 是 BottomBar 内部节点，由 WorldBottomBarPanel 开关；WorldMainPanel 协调它与独立浮动面板互斥\n独立浮动面板的互斥关闭交给 PanelManager Exclusive group\n浮动面板布局使用 WorldFloatingPanelLayout\n```\n\nQuest / Story / Blueprint:\n\n```text\nStory 可触发 QuestEvent\nQuest 支持多目标、前置、追踪、完成、领取、奖励发放、保存和消息\nBlueprint 完成可触发 QuestEventType.BlueprintCompleted\n当前开局链路是 Story 10001 -> 拾取 -> 建 House -> 做斧 -> 砍树 -> 做镐 -> 挖石 -> 建 Workbench\n任务奖励 Toast / 获得反馈仍需完善\n```\n\nIsland opening resources:\n\n```text\n默认世界地图是 Assets/Data/Map/1001.json\n地图编辑器放置 Resource 时使用 resource.id\n30300008 Branch / 30300009 Loose Stone 是开局拾取物\n30300001 Tree 需要斧，30300002 Rock 需要镐\nToolKit 新存档默认空槽，获得工具后自动放入；加载已有存档时会把已拥有的工具补入空槽；不要假设玩家开局已有斧/镐/锄\n开局基础工具 Blueprint 的 buildingId = 0，不需要 Workbench；QuestPanel 详情按钮直接“制作”\nBag slot 0-9 是 HotBar，10+ 是 Bag；BottomBar 持有唯一 BagDragController，快捷栏和 Bag 子节点之间支持带跟随图标的拖动移动/交换，不拆堆，且不跨其它 Panel\n```\n\nStory:\n\n```text\nStoryManager 从 Story / StoryStep Luban 表加载配置，StoryStep 是正式推进单位，不使用 Beat\nStoryPanel prefab 已绑定文字卡片、静态插画视口和 GuideOverlay；支持 Text / Illustration / Mixed / Guide\nStoryData 保存 CurrentStoryId、CurrentStepIndex、CompletedStoryIds，可从未完成 Step 恢复\nDialogManager / EventTriggerSystem 目前只是占位\n```\n\nMap:\n\n```text\n地图由 MapData 运行时生成，不是整张场景 Prefab\n经营地图入口是 MapManager.Instance.LoadWorldMap(worldMapId)\n塔防地图入口是 MapManager.Instance.LoadBattleMap(mapConfigId)；不要重新增加含糊的 LoadMap\n两种入口共用同一个 MapManager、CurrentMap、LoadMapData 和 CreateMap，不维护双份地图运行时状态\nMapManager 用 partial 文件按 World / Battle / Loading / Persistence 组织；这只是代码分区，不是多个 Manager 实例\n塔防 UI 资源位于 Assets/Arts/UI/Panels/Battle；塔和技能图标分别位于 Assets/Arts/UI/Icons/Towers、Assets/Arts/UI/Icons/Skills\nMapData.Objects 是真实地图对象\n纯 UI 标记后续应进入 MapMarkerData 或等价结构\n寻路使用 MapPathFinder 格子 A*，不是 NavMesh；角色移动目标是可走格中心附近\nMapManager.IsWalkable / IsBuildable 看 objectsByCoord 和 BlocksMove / BlocksBuild，不看 view/collider 是否隐藏\n逻辑上消失的地图对象要 TryRemoveMapObject + MarkMapObjectRemoved；只隐藏 view 仍可能挡路\n拾取资源会移除 MapObject；采集资源 respawnSeconds <= 0 且耗尽后也会移除 MapObject，respawnSeconds > 0 则保留并等待刷新\n资源交互站位由 ResourceInteractionController 生成候选，NavigationController 选择可走、可到达、处于交互距离内的格子；不要把资源本体加入 path node\n地图编辑器放置资源默认使用 Excel / Luban 的 resource 阻挡属性；当前 MapObjectData 存最终值，不记录是否覆盖\n采集工具动作只使用 Assets/Arts/Character/Player 内的玩家动画资源；当前 UseTool 使用 Meshy_AI_Forestbound_Adventure_biped_Animation_Heavy_Hammer_Swing_withSkin.fbx，但必须通过 WorldPlayer.controller 的 UseTool Upper Body 层和 WorldPlayer_UseToolUpperBody.mask 播放，只影响手臂/手指，避免 Heavy_Hammer_Swing 的全身后撤姿态把角色视觉上弹出去。不要引用 Assets/Arts/FBX/CharacterFBX 的其他角色动作，也不要叠加额外程序化采集动作\n```\n\n## Documentation Rule\n\n如果发现文档与代码冲突，先读代码和 Prefab，再更新对应主题文档。重要框架规则、业务流程、命名约定、易踩坑细节或长期设计决策发生变化时，必须同步更新 Markdown 源文档，并重新生成 `Docs/Human/index.html`。不要把过时探索继续堆进 `CodexProjectMemory.md`，也不要只把长期规则写在聊天记录或 HTML 里。\n"

    "path": "Architecture/CodebaseOverview.md",
    "summary": "代码分层、目录边界和 Unity 安全规则。",
    "content": "# Codebase Overview\n\n本文记录项目代码分层和主要目录。新对话如果只改某个业务模块，不需要读完整文档树；从 `Docs/README.md` 的任务入口跳到对应模块即可。\n\n## 顶层结构\n\n```text\nAssets/Scripts\n  Bootstrap\n  Framework\n  Game\n  MapEditor\n  Ability\n  Skill\n  Tools\n  Sandbox\n```\n\n## Bootstrap\n\n```text\nAssets/Scripts/Bootstrap/GameEntry.cs\n```\n\n职责是初始化资源、数据、管理器和主流程。不要让 `GameEntry` 继续膨胀；复杂流程应下沉到明确的 manager。\n\n## Framework\n\n跨玩法基础设施放在 `Assets/Scripts/Framework`：\n\n```text\nDevice\nEffect\nEvent\nInputSystem\nLogging\nMessage\nResource\nSingleton\nTask        C# async helper，不是游戏任务系统\nThreading\nUI\nLogger.cs\nNetLogger.cs\n```\n\nFramework 不写具体经营、任务、塔防规则。UI 框架细节见 `Docs/Architecture/UIFramework.md`。\n\n`Device/DeviceManager` 是设备与屏幕事实的统一来源：平台、设备类别、系统与显卡概况，\n以及当前游戏窗口尺寸、安全区、方向和全屏状态。它不包含画质档位、UI 布局档位或玩法\n规则，也不读取或保存设备唯一标识。\n\n## Game\n\n正式游戏运行时代码放在 `Assets/Scripts/Game`：\n\n```text\nAbilityAdapters\nAnimator\nBase\nBattle\nBlueprints\nBuild\nCamera\nCharacters\nCore\nData\nDebug\nDrop\nEffect\nEffects\nEntity\nInput\nIsland\nItem\nItems\nLocalization\nMap\nMessage\nNpc\nPathFinding\nQuests\nSave\nStory\nTower\nTowerDefense\nUI\nWave\n```\n\n业务文档按主题拆分：\n\n```text\nDocs/Modules/Island.md\nDocs/Modules/ManagementUI.md\nDocs/Modules/QuestStoryBlueprint.md\nDocs/Modules/AbilityAndSkill.md\nDocs/Modules/TowerDefense.md\nDocs/Modules/MapAndTileArt.md\n```\n\n## Game/Data\n\n```text\nAssets/Scripts/Game/Data\nAssets/Scripts/Game/Data/Generated\n```\n\n`Generated` 由 Luban 生成，不手动修改。数据流水线见 `Docs/Architecture/DataPipeline.md`。\n\n## Game/UI\n\n业务 UI 放在 `Assets/Scripts/Game/UI`，通用 UI 能力放在 `Assets/Scripts/Framework/UI`。\n\n当前经营 UI 主要在：\n\n```text\nAssets/Scripts/Game/UI/Management\nAssets/Arts/UI/Panels\nAssets/Arts/UI/Icons\n```\n\n## MapEditor / Tools / Sandbox\n\n`MapEditor` 只放地图编辑器窗口和编辑器工具。运行时地图逻辑放 `Game/Map`。\n\n`Tools` 放编辑器工具、一次性工具和 prefab 绑定工具。如果只在编辑器用，必须放在 `Editor` 子目录。\n\n`Sandbox` 只用于实验和样例，正式玩法不要依赖 Sandbox。\n\n游戏任务系统使用 `Quests`。不要重新创建 `Tasks` 作为业务任务目录，避免和 C# async `Task` 混淆。\n\n## Unity 安全规则\n\n- 不为了目录整洁随意移动已经挂在 Prefab 或 Scene 上的脚本。\n- 移动 `.cs` 必须同时移动 `.meta`，保持 Unity GUID。\n- 不删除再新建同名脚本，否则 Prefab 可能 Missing Script。\n- 改序列化字段名要考虑 `[FormerlySerializedAs]`。\n- Runtime 代码不要放进 `Editor` 目录。\n- Luban 生成代码和生成数据不手动改。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"

    "content": "# Module Work Map\n\n本文是“更高一级”的工作索引，用来回答：改某个模块时，需要读哪些文档、看哪些代码、改哪些表、用哪些工具、检查哪些生成物。\n\n具体设计细节仍放在各模块文档里；本文只做总览和入口。\n\n## 使用方式\n\n1. 先在本文找到模块。\n2. 按“先读文档”进入细节文档。\n3. 修改表时按“配置表”和“生成工具”执行。\n4. 修改代码或 prefab 前按“相关文件”确认边界。\n5. 如果本文和代码冲突，以代码和实际 prefab 为准，然后更新本文。\n\n## 通用数据工具\n\n配置生成：\n\n```text\nData/gen_all.bat\n```\n\nUnity 菜单：\n\n```text\nLuban/Update All\n```\n\n对应工具代码：\n\n```text\nAssets/Scripts/Tools/Editor/LubanTool.cs\n```\n\n规则：\n\n- 只改表内容时，通常跑 `Data/gen_all.bat`。\n- 新增字段或改字段结构时，可用 `Luban/Update All`，它会根据 Excel 前三行更新 `Data/Defines/*.xml`，再执行 `gen_all.bat`。\n- 不要单独建议执行 `Data/gen_client.bat`，除非明确只调试 client 生成脚本本身。\n\n通用生成物：\n\n```text\nAssets/Scripts/Game/Data/Generated\nAssets/Data/Bin\nAssets/Data/Json\n```\n\n## 模块总表\n\n| 模块 | 先读文档 | 代码入口 | 配置表 | 工具 / 生成 | 备注 |\n| --- | --- | --- | --- | --- | --- |\n| Story | `Modules/Story.md`、`Product/ProgressionAndQuests.md` | `Assets/Scripts/Game/Story` | `story.xlsx`、`story_step.xlsx` | `gen_all.bat`、`Luban/Update All`、`StoryPanelPrefabBuilder` | StoryStep 同时承载文字、插画与轻量 Guide；当前没有专门 Story 配表校验器 |\n| Quest | `Modules/QuestStoryBlueprint.md`、`Product/ProgressionAndQuests.md` | `Assets/Scripts/Game/Quests`、`Assets/Scripts/Game/UI/Management/QuestPanel.cs` | `quest.xlsx`、`quest_objective.xlsx`、`reward.xlsx` | `gen_all.bat`、`Luban/Update All` | 奖励发放已走 BagManager；Toast / 获得反馈继续打磨 |\n| Blueprint | `Modules/QuestStoryBlueprint.md`、`Modules/Island.md` | `Assets/Scripts/Game/Blueprints` | `blueprint.xlsx`、`blueprint_item.xlsx` | `gen_all.bat`、`Luban/Update All` | 不要新增 `Recipe` 同义概念 |\n| Management UI | `Architecture/UIFramework.md`、`Modules/ManagementUI.md` | `Assets/Scripts/Game/UI/Management` | 通常不直接改表；文本走 `localization.xlsx` | Prefab + Inspector 绑定；必要时用 `WorldSystemMenuPrefabBuilder` / `WorldLocalizationPrefabBinder` | 不要把稳定 HUD 节点改回运行时 `Find` |\n| UI Framework | `Architecture/UIFramework.md`、`Decisions/0002-ui-kind-usage.md` | `Assets/Scripts/Framework/UI`、`Assets/Scripts/Game/Core/RequirementResult.cs`、`Assets/Scripts/Game/UI/Toasts` | 通用 UI 无；业务提示文本走 `localization.xlsx` | 代码验证为主；本地化改动跑 `gen_all.bat` | Stack / Exclusive / outside close 属框架能力；业务条件统一返回 RequirementResult |\n| Island Resources / Tools | `Modules/Island.md` | `Assets/Scripts/Game/Island/Resources`、`Assets/Scripts/Game/Island/Tools` | `item.xlsx`、`resource.xlsx`、`gather.xlsx` | `gen_all.bat` | ToolKit UI 另读 `Modules/ManagementUI.md` |\n| Farming | `Modules/Island.md`、`Product/ManagementMode.md` | `Assets/Scripts/Game/Island/Farming`、`PlacementController.cs`、`WorldFarmPanel.cs` | `world_crop.xlsx`；锄头获取链路还涉及 `item.xlsx`、`blueprint.xlsx`、Quest / Reward 表 | `gen_all.bat` | QuickFarm 已检查 Active House、锄头拥有与 ToolKit；各失败阶段走 RequirementResult + Toast；锄头正常获取链路仍待补齐 |\n| Buildings / Production | `Modules/Island.md`、`Product/ManagementMode.md` | `Assets/Scripts/Game/Island/Buildings`、`WorldBuildingDetailPanel.cs` | `world_building.xlsx`、`world_building_level.xlsx`、`world_building_income.xlsx`、`world_cost.xlsx`、`reward.xlsx` | `gen_all.bat`、`WorldConfigValidator` | `WorldConfigValidator` 主要校验建筑 / 科技关系 |\n| Tech | `Modules/Island.md`、`Modules/ManagementUI.md` | `Assets/Scripts/Game/Island/Tech`、`TechTreePanel.cs` | `tech_node.xlsx` | `gen_all.bat`、`WorldConfigValidator` | TechUnlock 后续更适合 Popup |\n| Calendar / Save | `Architecture/SaveSystem.md`、`Modules/Island.md` | `CalendarManager.cs`、`StorageManager.cs`、`SaveData.cs` | 无主要表 | `WorldSaveDevTool` 可辅助存档测试 | 存档字段变更要注意兼容 |\n| Map Runtime | `Architecture/MapRuntime.md`、`Decisions/0003-map-object-vs-marker.md` | `Assets/Scripts/Game/Map` | `map.xlsx` 及 `Assets/Data/Map/*.json` | MapEditor 工具、`SceneMapDataExporter` | `MapData.Objects` 不是 UI 标记表 |\n| Tile Art | `Modules/MapAndTileArt.md` | `Tools/Art`、`Assets/Arts/Map` | 通常无 Luban 表 | Blender / PowerShell 美术脚本 | 第一阶段不做复杂邻接融合 |\n| Tower Defense | `Product/TowerDefenseMode.md`、`Modules/TowerDefense.md` | `Assets/Scripts/Game/TowerDefense` | `tower.xlsx`、`tower_level.xlsx`、`wave.xlsx` 等 | `gen_all.bat`、`gen_wave_all_no_overwrite.bat` | 单局状态不要混入经营长期状态 |\n| Ability / Skill | `Modules/AbilityAndSkill.md` | `Assets/Scripts/Ability`、`Assets/Scripts/Skill`、`Assets/Scripts/Game/AbilityAdapters` | `Ability*.xlsx`、`skill*.xlsx` | `gen_all.bat` | 新塔防技能优先走 Ability |\n| Localization | `Architecture/DataPipeline.md` | `Assets/Scripts/Game/Localization` | `localization.xlsx` | `gen_all.bat` | 新 UI 文本不要写代码 fallback |\n\n## 工具索引\n\n数据生成：\n\n```text\nData/gen_all.bat\nData/gen_client.bat\nData/gen_wave_all_no_overwrite.bat\nAssets/Scripts/Tools/Editor/LubanTool.cs\n```\n\n配置校验：\n\n```text\nAssets/Scripts/Game/Data/Editor/WorldConfigValidator.cs\n```\n\nPrefab / UI 辅助：\n\n```text\nAssets/Scripts/Tools/Editor/WorldSystemMenuPrefabBuilder.cs\nAssets/Scripts/Tools/Editor/WorldLocalizationPrefabBinder.cs\n```\n\n地图编辑：\n\n```text\nAssets/Scripts/MapEditor/Editor/MapEditorWindow.cs\nAssets/Scripts/MapEditor/Editor/WorldMapEditorWindow.cs\nAssets/Scripts/MapEditor/Editor/TowerDefenseMapEditorWindow.cs\nAssets/Scripts/MapEditor/Editor/SceneMapDataExporter.cs\nAssets/Scripts/MapEditor/Editor/MapJsonService.cs\nAssets/Scripts/MapEditor/Editor/MapEditorValidator.cs\n```\n\n存档辅助：\n\n```text\nAssets/Scripts/Game/Save/Editor/WorldSaveDevTool.cs\n```\n\n美术生成：\n\n```text\nTools/Art\nTools/Art/Blender\nTools/Art/Texture\n```\n\n## 每个模块文档应包含\n\n后续新增或整理模块文档时，尽量包含这些段落：\n\n```text\n定位\n当前文件\nPrefab / UI\n配置表\n如何配表\n生成工具\n运行时链路\n存档 / 消息\n当前缺口\n```\n\n不是每个模块都必须有每一项。例如 UI Framework 没有配置表，Tile Art 不一定有 Luban 表，但文档里要明确“没有”或“当前不覆盖”，避免下次误找。\n\n\r\n\r\n\r\n"

    "summary": "UI 类型、关闭规则、Stack、Exclusive 和 prefabPath 语义。",
    "content": "# UI Framework\n\n本文记录 UI 框架当前约定。只改业务 UI 时，通常还需要读 `Docs/Modules/ManagementUI.md`；只改框架时优先读本文。\n\n## UI 类型\n\nPage\n: 全屏大流程，例如登录、主菜单、经营主界面、塔防主界面、加载流程。当前 `WorldMainPanel` 概念上接近经营主 Page，但短期不为命名重构。\n\nPanel\n: 当前 Page 上的浮动功能面板，例如 Build、ToolKit、Production、Quest、TechTree、Menu。当前 Bag 是 BottomBar 内部抽屉节点，不属于框架 Panel。\n\nPopup\n: 必须先处理的小确认或详情层，例如 Confirm、ItemDetail、TechUnlock。`TechUnlockPanel` 后续更适合迁到 Popup，使用 `PopupManager` blocker，不再自己创建遮罩。\n\nOverlay\n: 全局 Loading、转场黑屏、网络等待、强制输入阻塞。不要用业务 panel 反复自造全屏遮罩替代 Overlay。\n\nToast\n: 自动消失、不中断操作的小提示，例如保存成功、资源不足、获得物品、科技解锁成功。Sound、Language、Save 这类设置界面不是 Toast。\n\nTooltip\n: 鼠标停留一段时间后显示的上下文说明，例如物品名称、工具描述、技能属性和按钮用途。Tooltip 不阻塞输入，不进入 Panel / Popup 关闭栈，也不等同于自动消失的 Toast。\n\n## 条件失败提示\n\n需要告诉玩家“为什么不能执行”的业务功能，统一返回\n`Assets/Scripts/Game/Core/RequirementResult.cs`，再由\n`Assets/Scripts/Game/UI/Toasts/Toast.cs` 中的 `RequirementToast.TryPass` 转成 Warning\nToast。\n\n职责边界：\n\n```text\nRequirementResult\n  只描述成功或失败\n  携带稳定错误 Code、本地化 key、中英文 fallback 和格式参数\n\n各业务 RequirementChecker\n  拥有本业务规则\n  检查不产生副作用\n  入口 UI 和最终执行路径复用同一检查\n\nRequirementToast\n  只负责把失败结果显示为 Toast\n  不认识农田、建造、科技等业务\n```\n\n调用方式：\n\n```csharp\nRequirementResult result = feature.TryExecute();\nif (RequirementToast.TryPass(result))\n{\n    Refresh();\n}\n```\n\n不要建立一个同时知道农田、建造、生产、科技全部规则的全局条件管理器。通用层只统一\n结果结构和展示方式；每个模块继续使用自己的 `FarmRequirementChecker`、\n`BuildingRequirementChecker` 等检查器。这样其它功能可以复用 Toast 协议，同时不会把\n业务依赖集中成新的大型耦合类。\n\n规则：\n\n- UI 预检查用于尽早反馈，真正产生消耗或状态变化的业务方法必须再次检查并返回同一个\n  `RequirementResult`。\n- `Code` 用于日志、测试或后续埋点，玩家文本使用 `LocalizationKey`，不要根据显示文本\n  判断错误类型。\n- 新提示应补入 `Data/Excel/localization.xlsx`；fallback 只保证配表尚未生成或 key 缺失\n  时仍能显示可理解的信息。\n- 如果禁用按钮会让玩家无法知道原因，可以保留点击能力并只做灰态表现，点击后显示具体\n  条件 Toast；是否完全禁用仍由业务交互设计决定。\n- 一次操作只显示当前最直接的一条失败原因；Toast 自身通过相同内容的 MergeKey 合并\n  连续重复提示。\n\n### Page 内嵌 Panel\n\n一个全屏 Page 可以由多个职责独立的 `UIPanel` 组成。例如塔防采用：\n\n```text\nBattlePage : UIPage\n  TopPanel : UIPanel\n  BuildTowerPanel : UIPanel\n  ItemPanel : UIPanel\n  InfoPanel : UIPanel\n  SkillPanel : UIPanel\n  BattleControlPanel : UIPanel\n  MiniMapPanel : UIPanel（当前禁用）\n```\n\n这些 Panel 与 Page 位于同一个 prefab，由 Page 通过 `UIEmbeddedPanelGroup` 显式传递 `Create / Open / Close` 生命周期，不注册为 `PanelManager` 的独立窗口。Panel 内负责按钮、条目和局部表现的叶子组件使用普通 `MonoBehaviour`。\n\n内嵌 Panel 必须由序列化引用组成，不允许运行时使用 `GetComponentInChildren`、递归名称查找或遍历 Transform 自动发现。独立浮动 Panel 仍由 `PanelManager` 管理，两种所有权不要混用。\n\n## 身份和路径\n\n当前 UI 框架以 `prefabPath` 作为运行时身份，`Show`、`Hide`、`IsShown` 都按路径工作。\n\n这不是明显性能问题：运行时主要是字典查找和少量字符串 key，比加载 prefab 和实例化 UI 的成本低很多。相比改成脚本类名，`prefabPath` 更能区分同脚本不同 prefab、不同皮肤、不同入口实例。后续如果需要更强管理能力，可以在业务层增加枚举或配置表映射到 `prefabPath`，不建议直接把框架身份改成脚本类名。\n\n## 屏幕与安全区\n\n屏幕适配的统一入口是：\n\n```text\nDeviceManager.Instance.Screen       通用设备 / 屏幕事实\nUIManager.Instance.Viewport\n```\n\n`DeviceManager` 位于 `Assets/Scripts/Framework/Device`，启动时采集平台、设备类别、设备\n型号、操作系统、处理器、内存和显卡概况，并持续维护 `DeviceScreenInfo`。只有游戏窗口\n尺寸、显示器分辨率、安全区、方向、全屏模式或 DPI 发生变化时才触发 `ScreenChanged`。\n不采集设备唯一标识。\n\n`UIViewportService` 由 `UIManager` 持有，只订阅 `DeviceManager.ScreenChanged` 并把通用\n屏幕信息转换为 UI 视口语义；UI 框架不再各自读取 `Screen`。当前快照\n`UIViewportInfo` 提供：\n\n```text\nPixelSize\nSafeAreaPixels\nSafeAreaNormalized\nSafeInsetsPixels\nAspectRatio\nOrientation\nIsPortrait\n```\n\n通用安全区组件是 `UISafeAreaFitter`，位于\n`Assets/Scripts/Framework/UI/Runtime/UI/Viewport`。原塔防专用安全区脚本已迁入这里并保留\n原 `.meta` GUID，因此现有 prefab 引用不需要重绑。需要避开刘海、圆角或系统手势区域的\n全屏容器可以直接挂该组件。当前经营 `WorldMainPanel` 与塔防 `BattlePage` 的根节点都已\n使用该组件。\n\n职责边界：\n\n- 框架层只提供屏幕度量、变化通知、CanvasScaler 配置和通用安全区约束。\n- 业务层决定 Compact / Normal / Wide 等布局语义，以及哪些内容允许换行、缩小或隐藏。\n- `UIView` / `UIPanel` 不写具体响应式布局；需要监听时由具体视图或组合组件订阅\n  `Viewport.Changed`。\n- 普通分辨率适配优先使用 CanvasScaler、锚点、LayoutGroup、ContentSizeFitter 和 TMP\n  preferred size，不为每个面板编写坐标调整脚本。\n\n布局输入按以下顺序进入同一次布局求解，不让多个脚本反复改最终坐标：\n\n```text\n屏幕尺寸 / 方向 / 安全区\n  -> 选择布局档位并确定根容器约束\n  -> 写入本地化文本、字体和动态内容\n  -> Unity LayoutGroup / TMP 完成一次重排\n  -> 根据最终 Rect 定位 Tooltip、引导和其它浮层\n```\n\n仅切换语言时只更新内容并重排；仅改变分辨率或方向时只更新屏幕约束并重排。\n\n## Tooltip\n\nTooltip 使用全局唯一显示层和唯一 `TooltipView`：\n\n```text\nUILayer.Panel    25\nUILayer.Toast    30\nUILayer.Tooltip  35\nUILayer.Overlay  40\n```\n\n代码和 prefab：\n\n```text\nAssets/Scripts/Framework/UI/Runtime/UI/Tooltip\nAssets/Arts/UI/Panels/Common/Tooltip.prefab\nAssets/Scripts/Tools/Editor/TooltipPrefabBuilder.cs\n```\n\n职责：\n\n```text\nTooltipManager  延迟、所有权、取消、显示、隐藏和定位\nTooltipTrigger  只监听 Pointer 事件，没有视觉节点，不带 UI 前缀\nTooltipView     全局唯一的实际显示视图\nTooltipData     一次显示需要的标题、描述、图标、Values 和 Footer\nTooltipValue    一条结构化表现值，例如“伤害: 25”\n```\n\n业务调用入口：\n\n```csharp\nUIManager.Instance.Tooltips.Show(owner, anchor, dataProvider, options);\nUIManager.Instance.Tooltips.Hide(owner);\n```\n\n### TooltipData 来源\n\n每个 Tooltip 都必须有一个 `TooltipData` 来源，不存在“只有某种 UI 需要提供数据、其它 UI 自动拥有内容”的例外。区别只在于内容从哪里取得：\n\n```text\n固定按钮             TooltipTrigger 的序列化静态内容\n动态塔 / 物品 / 技能  复用 View 按 TowerId / ItemId / SkillId 调用 Bind\n已有 Pointer 处理组件 直接向 TooltipManager 传入 dataProvider\n```\n\n`Bind` 写在可复用的 View 类型中，不为每个运行时实例重复写一套。例如所有建塔卡片共用一次绑定：\n\n```csharp\ntooltipTrigger.Bind(CreateTooltipData);\n\nprivate TooltipData CreateTooltipData()\n{\n    return new TooltipData\n    {\n        Title = LocalizedConfigText.TowerName(TowerId),\n        Description = LocalizedConfigText.TowerDescription(TowerId),\n        Icon = iconImage != null ? iconImage.sprite : null,\n    };\n}\n```\n\n这里的 `TowerId` 属于塔卡片业务，通用 `TooltipTrigger` 不应认识它。物品格和技能格同理，分别由自己的可复用 View 提供内容。写死 `\"箭塔\"` 的 Lambda 只能作为 API 示例，正式内容必须通过 `localization.xlsx` 和 `LocalizedConfigText` 获取。\n\n规则：\n\n- 每个目标不创建独立 Tooltip UI 层；所有目标共享一个 `TooltipView`。\n- 普通按钮可以挂轻量 `TooltipTrigger`；已经实现 `IPointerEnterHandler` / `IPointerExitHandler` 的组件直接调用 `TooltipManager`。\n- `TooltipTrigger` 不查询游戏业务数据；业务层通过 `Func<TooltipData>` 提供已经本地化的表现数据。\n- Tooltip prefab 的稳定节点使用序列化字段绑定，不在运行时 `Find`。\n- Tooltip 的 `CanvasGroup.blocksRaycasts` 和 `interactable` 必须为 `false`，避免出现后抢走源按钮射线并造成闪烁。\n- 首次默认延迟 `0.55` 秒；刚查看过 Tooltip 时相邻目标使用 `0.08` 秒 reshow delay；warm window 默认 `0.75` 秒。\n- 鼠标离开、点击、开始拖拽、目标禁用、Back、`UIManager.ClearAll`、资源加载器重建时隐藏或取消等待。\n- Tooltip 默认锚定到目标旁边，按 Right / Left / Above / Below 自动选择空间并限制在 Canvas 内；它不跟随鼠标遮挡源目标。\n- 阻塞型 Overlay 显示期间不打开 Tooltip，Overlay 层级始终高于 Tooltip。\n\n## 关闭方式\n\n框架关闭枚举：\n\n```text\nCloseButton\nLeftOutside\nRightOutside\nBack\n```\n\n常见经营浮动面板推荐：\n\n```csharp\nUICloseTriggers.CloseButton |\nUICloseTriggers.Back |\nUICloseTriggers.RightOutside\n```\n\n规则：\n\n- 桌面端右键 panel 外部区域关闭支持 `RightOutside` 的面板。\n- 移动端没有右键，触摸或点击 panel 外部区域会由框架映射为可用的 outside 关闭原因。\n- Panel outside close 统一由 `UIOutsideClickDetector` + `PanelManager` 处理，不再为 Panel 创建外部遮罩节点。\n- `UIManager` 会统一创建透明的 `PanelOutsideBlocker`，它是 `UICanvasRoot` 的底层 UI，排序低于所有 UI layer。它只接没有命中其它 UI 的空白点击，不挡住任何正常 UI。\n- `PanelOutsideBlocker` 只负责让空白处成为 UI raycast 命中和阻止世界输入；真正关闭哪个 panel、是否允许右键/触摸关闭，仍由 `UIOutsideClickDetector` + `PanelManager` 按 top outside target 和 `UICloseTriggers` 判断。\n- outside close 会被 `UIManager` 标记为本帧 UI 指针消费；世界输入通过 `WorldPointerPicker.IsPointerOverUi()` 查询时必须把这类点击当作 UI 输入，不能同一帧再触发移动、建造、采集等场景操作。\n- 业务 panel 内的 `Overlay` 只作为视觉遮罩，`Image.raycastTarget` 必须为 `false`，不要在 panel 内再接一套遮罩点击关闭。\n- Quest、TechTree、Menu、Sound、Language、Save、GM 等大面板应支持空白或遮罩关闭。\n\n## Exclusive Group\n\nExclusive 表示同级互斥，不保留返回历史。适合主界面入口：\n\n```text\nBuild\nToolKit\nProduction\nQuest\nTechTree\nMenu\n```\n\nAPI：\n\n```csharp\nRegisterExclusivePanel(groupId, prefabPath)\nShowExclusiveAsync(groupId, prefabPath)\nHideExclusiveGroup(groupId)\n```\n\n一个 group 可以注册多个面板。项目也可以同时存在多个互斥 group，例如经营主界面浮动面板一组、某个编辑器工具局部面板一组。业务层负责决定 `groupId`，框架负责关闭同组其它面板。\n\nBottomBar 内部 Bag 节点不注册 Exclusive group。`WorldMainPanel` 在业务层协调 Bag 与独立浮动面板的互斥：打开一方时关闭另一方。\n\n## Stack Group\n\nStack 表示 panel 级返回栈。Push 新 panel 时隐藏旧 top，Pop 当前 top 时恢复上一个 top。适合真正独立 prefab、独立生命周期、需要返回历史的流程。\n\nAPI：\n\n```csharp\nPushStackAsync(groupId, prefabPath)\nPopStack(groupId)\nHideStack(groupId)\n```\n\n`PanelOptions.GroupId` 是旧兼容入口，语义按 Stack 处理。新代码优先写 `StackGroupId` 或直接调用 Stack API。\n\nStack 和 Exclusive 不冲突：Stack 解决“返回上一个 panel”，Exclusive 解决“同级只能开一个”。同一个 panel 是否同时参与两种管理，要由业务明确设计，避免用户看见一个入口组和一个返回栈互相抢状态。\n\n## Panel 内部子节点\n\n框架当前管理的是 `UIPanel` / prefab，不全局管理不带脚本的普通子节点。\n\n如果 Sound、Language、Save 只是 Menu 内部设置页，更合理做法是：\n\n```text\nMenuPanel\n  Sound node\n  Language node\n  Save node\n  GM node\n```\n\n由 `MenuPanel` 通过序列化字段切换 `SetActive`，或在本地维护一个 node stack。不要为了使用框架 Stack 强行把普通子节点拆成多个 `UIPanel`。\n\n当前 Bag 采用同一规则：\n\n```text\nWorldMainPanel\n  BottomBar\n    HotBarGrid\n    BagPanel node\n```\n\n`WorldBottomBarPanel` 负责 Bag 节点的开关、消息订阅和 HotBar/Bag 共享拖拽控制器；`WorldBagPanel` 只是该节点的本地控制组件。\n\n如果多个 panel 都反复需要“内部节点互斥”或“内部节点返回栈”，再考虑抽 `UINodeExclusive` / `UINodeStack` 这类轻量组件。\n\n## 业务层配置位置\n\n框架提供能力，业务层配置分组。\n\n经营主界面的独立 Panel 入口当前由 `WorldPanelEntryController` 注册 entry：\n\n```text\nid\ngroupId\nprefabPath\n入口开关状态刷新回调（可选）\n```\n\nBag 入口不在该表中，由 `WorldBottomBarPanel` 本地处理。\n\n节点位置优先在 prefab 里调；需要运行时对齐时使用业务自己的布局工具和序列化引用，不写死某个分辨率像素。\n\n## 当前系统设置\n\n当前代码结构中 Menu、Sound、Language、Save、GM 是独立 `UIPanel`，短期可以走 `WorldMenuPanel.SettingsStackGroupId` 的 Stack。\n\nSound、Language、Save 子面板各自只绑定一个 prefab 序列化的 `Return` 按钮；点击后优先 `PopStack(SettingsStackGroupId)` 返回设置菜单，栈不存在时才隐藏当前面板。不要同时保留 `Close` 与 `Return` 两套有效监听。\n\n`SoundPanel` 直接使用 prefab 序列化的 `Slider` 组件引用，不在运行时按名称查找或创建控件；因此 Slider 及其子节点允许改名和调整层级。\n\n声音开关使用独立的 `On / Off` Button 状态：点击 On 记录当前音量后静音，点击 Off 恢复该音量；如果由 Slider 或增减按钮把音量调到 0，Off 默认恢复到 50%。\n\n从产品结构看，Sound、Language、Save 更像 Menu 内部子页面。后续如果要整理，优先改成 Menu 内部节点，由 Menu 脚本统一管理；GM 如果仍是调试大面板，可以保留独立 Panel。\n\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  },

    "title": "音频系统",
    "path": "Architecture/AudioSystem.md",
    "summary": "背景音乐、普通音效、播放参数、句柄和音量设置。",
    "content": "# Audio System\n\n本文记录项目当前的简化音频系统。系统只区分背景音乐和普通音效，不建立额外的 UI、环境音或技能音效公开 API。\n\n## 代码位置\n\n```text\nAssets/Scripts/Framework/Audio/AudioManager.cs\nAssets/Scripts/Framework/Audio/AudioPlayOptions.cs\nAssets/Scripts/Framework/Audio/AudioHandle.cs\n```\n\n现有 UI 兼容入口：\n\n```text\nAssets/Scripts/Game/UI/TowerDefense/GameAudioSettings.cs\n```\n\n## 公开播放 API\n\n业务层只使用：\n\n```csharp\nAudioManager.Instance.PlayMusic(location, options);\nAudioManager.Instance.PlaySound(location, options);\n```\n\n`PlayMusic` 默认循环，`PlaySound` 默认不循环。两者共享 `AudioPlayOptions`：\n\n```text\nLoop       null 使用类型默认值\nVolume     本次播放基础音量，默认 1\nPitch      音高，默认 1\nDuration   <= 0 表示按默认生命周期播放\nPosition   null 为 2D；传值为固定世界位置的 3D 音效\n```\n\n`Duration <= 0` 时，非循环音频播放到 Clip 自然结束，循环音频持续到主动停止。`Duration > 0` 使用真实时间限制播放时长，不受游戏 `Time.timeScale` 影响。\n\n## 停止播放\n\n播放接口返回 `AudioHandle`。普通一次性音效可以忽略返回值；循环音效或仍在异步加载的音效可以通过句柄取消：\n\n```csharp\nAudioHandle handle = AudioManager.Instance.PlaySound(\n    location,\n    new AudioPlayOptions { Loop = true });\n\nhandle.Stop();\n```\n\n也可以使用：\n\n```csharp\nAudioManager.Instance.Stop(handle);\nAudioManager.Instance.StopMusic();\nAudioManager.Instance.StopAllSounds();\n```\n\n## 播放实现\n\n- 音频通过 `ResourceManager.LoadAssetAsync<AudioClip>` 从 YooAsset 加载。\n- `AudioManager` 按需自动创建并跨场景保留，不要求在 Scene 或 Prefab 中预放节点。\n- 背景音乐使用一个常驻 `AudioSource`；新音乐加载成功后替换当前音乐。\n- 普通音效使用最多 16 个可复用 `AudioSource`。\n- 音效池满时停止最早开始播放的音效并复用其声源。\n- 句柄在异步加载完成前被停止时，不会发生迟到播放。\n- `Position` 只设置播放开始时的固定世界位置，不自动跟随移动对象。\n\n## 音量\n\n当前音量分为：\n\n```text\nMaster  使用 AudioListener.volume\nMusic  作用于背景音乐 AudioSource\nSound  作用于普通音效 AudioSource\n```\n\n保存键：\n\n```text\nWorld.Sound.Volume\nAudio.Music.Volume\nAudio.Sound.Volume\n```\n\n现有 `WorldSoundPanel`、`BattleControlPanel` 和 `BattleSettingsPopup` 继续通过 `GameAudioSettings` 操作 Master 音量。`GameAudioSettings` 只是兼容门面，实际状态由 `AudioManager` 管理。\n\n## Ability 接入\n\n`TdPresentation.PlaySound` 已转发到：\n\n```csharp\nAudioManager.Instance.PlaySound(\n    soundName,\n    new AudioPlayOptions { Position = position });\n```\n\nAbility 的 `soundName` / 旧 Skill 的 `soundLocation` 应填写 YooAsset 可加载的音频资源完整路径。\n\n## 当前不包含\n\n第一版不包含：\n\n```text\nAudioMixer 和 Snapshot\nAudio Cue 配置表\n场景音乐自动调度器\n淡入淡出或双 AudioSource 交叉混音\n按 Cue 的并发和冷却配置\n让 3D 音效跟随 Transform\n运行时音频调试窗口\n```\n\n需要这些能力时应在现有两个播放入口和 `AudioPlayOptions` 上扩展，不新增 `PlayUi`、`PlayLoop` 等平行公开 API。\n"
  },

    "summary": "Luban、Excel、本地化和生成数据规则。",
    "content": "# Data Pipeline\n\n本文记录配置数据的当前来源和生成规则。\n\n## 正式流水线\n\n```text\nData/Excel/*.xlsx\n  -> Luban\n  -> Assets/Scripts/Game/Data/Generated\n  -> Assets/Data/Bin/*.bytes\n  -> Assets/Data/Json/*.json\n```\n\n运行时以 `Assets/Data/Bin/*.bytes` 为准。`Assets/Data/Json/*.json` 主要用于查看和调试，不作为长期正式运行来源。\n\n## 生成命令\n\n重新生成配置时统一执行：\n\n```text\nData/gen_all.bat\n```\n\n不要单独建议执行 `Data/gen_client.bat`。`gen_all.bat` 会串起 client 数据和 Wave 数据生成。\n\nUnity 菜单：\n\n```text\nLuban/Update All\n```\n\n`Assets/Scripts/Tools/Editor/LubanTool.cs` 会从 Unity project root 推导 `Data` 路径，不应硬编码本机盘符。\n\n生成后重点检查：\n\n```text\nAssets/Scripts/Game/Data/Generated\nAssets/Data/Bin\nAssets/Data/Json\nAssets/Data/Bin/Wave\nAssets/Data/Json/Wave\n```\n\n## 当前重要表\n\n`Tables` 当前包含 Ability、Skill、Item、Localization、Map、Npc、Tower、Wave、TechNode、WorldBuilding、WorldCost、WorldCrop、Gather、Resource、Reward、Quest、QuestObjective、Blueprint、BlueprintItem、Story、StoryStep 等表。\n\n每个 Excel 的用途、全部字段、关联关系和当前代码接入状态见：\n\n```text\nDocs/Architecture/ExcelDataDictionary.md\n```\n\n注意：`tech_node.xml` 当前没有被 `Data/Defines/__root__.xml` include。虽然仓库里仍有生成代码和运行时读取代码，但再次完整生成可能使 TechNode 产物消失；应先修复根配置。\n\n命名规则：\n\n- 新增 Luban 表、Excel 文件、生成配置类和表访问名默认不要加 `World` 或 `Game` 前缀。\n- `resource.xlsx`、`gather.xlsx`、`reward.xlsx` 已经从旧 `world_*` 表名迁移为无前缀命名。\n- 仍保留的 `world_*` Excel 和 `World*Config` 表是历史命名，短期不要因为命名规则单独迁移。\n- 新增工具配置应使用 `tool.xlsx` / `ToolConfig` / `TbTool`，不是 `world_tool.xlsx` / `WorldToolConfig` / `TbWorldTool`。\n\nQuest / Blueprint / Story 已接入正式 Luban 表：\n\n```text\nData/Excel/quest.xlsx\nData/Excel/quest_objective.xlsx\nData/Excel/blueprint.xlsx\nData/Excel/blueprint_item.xlsx\nData/Excel/story.xlsx\nData/Excel/story_step.xlsx\n```\n\n## 本地化\n\n本地化正式来源：\n\n```text\nData/Excel/localization.xlsx\nAssets/Data/Bin/tblocalization.bytes\nAssets/Data/Json/tblocalization.json\n```\n\n规则：\n\n- 新 UI 文本先写入 `localization.xlsx`。\n- 代码使用 `LocalizationManager.Get(key)` 或格式化 helper。\n- 不为新 UI 文本在代码里写临时中英文 fallback。\n- 运行时以 `tblocalization.bytes` 为准。\n\n当前 Quest UI 已补的 key：\n\n```text\nui.quest.main_title\nui.quest.current_goals\nui.quest.none\nui.quest.tracker_title\nui.quest.track\nui.quest.tracking\nui.quest.incomplete\nui.quest.not_started\nui.quest.claim\nui.quest.claimed\n```\n\n## 生成文件规则\n\n- 不手动改 `Assets/Scripts/Game/Data/Generated`。\n- 不手动改由 Luban 生成的 `.bytes` 作为长期方案。\n- 表结构变更要同步 `Data/Defines/*.xml`、`Data/Excel/*.xlsx` 和生成结果。\n\n\n\n\n\n\n\n"
  },

    "summary": "每个 Excel、每个字段、表间关系和当前接入状态。",
    "content": "# Excel Data Dictionary\n\n本文是 `Data/Excel` 的人类数据字典，说明每个 Excel 的用途、每个字段的含义、表间关系和当前代码接入状态。\n\n## 先看结论\n\n- 正式配置源是 `Data/Excel/*.xlsx`，表结构源是 `Data/Defines/*.xml`。\n- 统一执行 `Data/gen_all.bat`；运行时读取 `.bytes`，JSON 只用于查看和排错。\n- Excel 字段名和大小写必须与对应 XML 一致，不要直接修改生成的 C#、`.bytes` 或 JSON。\n- `id` 通常是全局唯一行 Id；`groupId` 是把多行组成一组的业务 Id，两者不要混用。\n- `itemId`、`buildingId`、`questId` 等字段都填写目标表的 `id`，不是 Excel 行号。\n- `*Location` 必须是 `Assets/` 开头的 Unity 资源路径；`*Seconds` 单位为秒。\n- `enable = false` 通常表示保留配置但不参与运行；并非所有旧模块都统一检查此字段，修改后仍需验证调用点。\n\n## 特殊文件状态\n\n`Data/Defines/__root__.xml` 当前正式包含 35 个根目录工作簿，具体文件已经列在页面顶部的“表目录”中。下面只说明不属于普通根表输入或存在异常的文件。\n\n### `tech_node.xlsx`\n\n配置异常。已有 schema、生成代码和运行时代码，但 `tech_node.xml` 当前没有被 `__root__.xml` include。再次完整生成可能让科技表从新生成结果中消失，修复根配置前不要把当前产物当成稳定状态。\n\n### `Wave/wave1.xlsx`\n\n正式的关卡独立波次输入。由 `gen_wave_all_no_overwrite.bat` 生成 `Assets/Data/Bin/Wave/wave1.bytes` 和对应 JSON，不覆盖根目录 `wave.xlsx`；字段与 `wave.xlsx` 相同。\n\n### `skill_luban_excels_fixed/`\n\n该目录下的 `skill.xlsx`、`skill_action.xlsx`、`skill_modifier.xlsx`、`skill_system_enum.xlsx` 都是历史修复/备份副本，不在当前 Luban 输入路径中，不要在这里修改正式技能配置。\n\n## 物品\n\n### `item.xlsx`\n\n物品主表，同时服务塔防临时背包、经营背包、掉落表现和塔防结算转换。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 物品 Id，供奖励、消耗、蓝图、任务等表引用。 |\n| `name` | string | 配置名或回退显示名；正式显示优先走 `item.{id}.name` 本地化。 |\n| `description` | string | 配置描述或回退描述；正式显示优先走 `item.{id}.description`。 |\n| `itemType` | int | 行为分类，见 `ItemType`。它只表示大类，不自动实现使用效果。 |\n| `useScope` | int | 塔防结算适用范围，见 `ItemUseScope`；当前不控制经营背包点击使用。 |\n| `iconLocation` | string | UI 图标资源完整路径。 |\n| `dropPrefabLocation` | string | 地面掉落物 prefab 完整路径，`ItemDropManager` 使用。 |\n| `autoPick` | bool | 生成地面掉落后是否立即自动拾取。 |\n| `maxStack` | int | 设计上的单格堆叠上限；当前 `BagManager` 尚未执行该上限。 |\n| `settlementItemId` | int | 塔防结算时转换成的经营物品 Id；`<= 0` 表示不转换。 |\n| `settlementCountPerItem` | int | 每个塔防物品换算出的经营物品数量。 |\n\n#### 枚举值\n\n| 字段 | 数值 | 名称 | 说明 |\n| --- | ---: | --- | --- |\n| `itemType` | 0 | None | 未分类。 |\n| `itemType` | 1 | Currency | 货币。 |\n| `itemType` | 2 | Consumable | 消耗品；仍需具体效果实现。 |\n| `itemType` | 3 | Blueprint | 蓝图类物品。 |\n| `itemType` | 4 | Seed | 种子。 |\n| `itemType` | 5 | Material | 材料。 |\n| `itemType` | 6 | Tool | 工具。 |\n| `useScope` | 0 | None | 不参与塔防结算转换。 |\n| `useScope` | 1 | BattleOnly | 仅塔防内使用。 |\n| `useScope` | 2 | Settlement | 可结算到经营模式。 |\n| `useScope` | 3 | Both | 两种范围都适用。 |\n\n`useScope` 当前只控制塔防结算时是否转换为经营物品，不等同于“背包里能否点击使用”。\n\n当前点击使用状态：工具可被选中，并在采集/耕作等动作成功后确认一次实际使用和发送任务完成事件；工具本身不会因此被消耗。普通消耗品尚无 Excel 效果定义，只有 `itemType = Consumable` 不会自动产生效果。\n\n## 本地化\n\n### `localization.xlsx`\n\n界面文本和配置名称的多语言来源。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `key` | string | 唯一本地化键，例如 `ui.quest.main_title`、`item.20300001.name`。 |\n| `zhCn` | string | 简体中文文本。 |\n| `en` | string | 英文文本。 |\n\n## 仓库容量\n\n### `storage_capacity.xlsx`\n\n按物品定义不同仓库等级的容量。表已加载到 `DataManager`，当前没有业务代码读取，属于已建表未接入。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `itemId` | int | 物品 Id，同时作为本表主键。 |\n| `level1` | int | 1 级仓库对该物品的容量。 |\n| `level2` | int | 2 级仓库对该物品的容量。 |\n| `level3` | int | 3 级仓库对该物品的容量。 |\n| `level4` | int | 4 级仓库对该物品的容量。 |\n| `enable` | bool | 是否启用该物品的容量配置。 |\n\n## 地图资源\n\n### `resource.xlsx`\n\n地图资源对象的玩法配置。地图 JSON 中资源对象的 `ConfigId` 应填写这里的 `id`。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 资源配置 Id。 |\n| `name` | string | 资源名称。 |\n| `resourceType` | int | 资源类别，决定采集动作需要的工具类型。 |\n| `interactionType` | int | 交互方式：直接拾取、重复采集或建矿目标。 |\n| `gatherConfigId` | int | `gather.id`；仅 `Gather` 交互需要。 |\n| `pickupRewardGroupId` | int | `reward.groupId`；`Pickup` 交互完成时发放。 |\n| `mineBuildingId` | int | `world_building.id`；`MineTarget` 完成时创建的矿建筑。 |\n| `prefabLocation` | string | 资源对象 prefab 完整路径。 |\n| `iconLocation` | string | 资源图标完整路径。 |\n| `blocksBuild` | bool | 是否阻止所在格建造。 |\n| `blocksMove` | bool | 是否阻止寻路通过。 |\n| `enable` | bool | 是否允许加载和交互。 |\n\n#### 枚举值\n\n| 字段 | 数值 | 名称 | 说明 |\n| --- | ---: | --- | --- |\n| `resourceType` | 0 | None | 未分类资源。 |\n| `resourceType` | 1 | Tree | 树木，通常使用斧。 |\n| `resourceType` | 2 | Stone | 石头，通常使用镐。 |\n| `resourceType` | 3 | Ore | 矿石。 |\n| `resourceType` | 4 | Plant | 植物。 |\n| `interactionType` | 0 | None | 不支持资源交互。 |\n| `interactionType` | 1 | Pickup | 播放拾取动作后一次性获得奖励。 |\n| `interactionType` | 2 | Gather | 按 `gather.xlsx` 重复采集。 |\n| `interactionType` | 3 | MineTarget | 使用建矿工具创建矿建筑。 |\n\n## 采集\n\n### `gather.xlsx`\n\n定义可重复采集节点的次数、单次奖励和刷新。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 采集配置 Id，由 `resource.gatherConfigId` 引用。 |\n| `name` | string | 配置名称。 |\n| `rewardGroupId` | int | 每次成功采集发放的 `reward.groupId`。 |\n| `depleteAfterTimes` | int | 节点耗尽前可成功采集的次数；`<= 0` 表示不按次数耗尽。树配 3 即砍 3 次。 |\n| `respawnSeconds` | int | 耗尽后恢复等待秒数；`<= 0` 表示不刷新并可移除地图对象。 |\n| `enable` | bool | 是否启用。 |\n\n## 奖励\n\n### `reward.xlsx`\n\n通用奖励组。一个 `groupId` 可以有多行，解析时当前会把该组所有有效行都发放一次。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 奖励明细行 Id。 |\n| `groupId` | int | 奖励组 Id，供采集、拾取、任务、建筑产出等引用。 |\n| `itemId` | int | 发放的 `item.id`。 |\n| `minCount` | int | 随机数量下限，包含该值。 |\n| `maxCount` | int | 随机数量上限，包含该值；必须大于 0。树木头 3-5 就在这里配置。 |\n| `weight` | int | 预留权重；当前 `RewardResolver` 不读取，不能用它实现多选一。 |\n\n## 成本\n\n### `world_cost.xlsx`\n\n经营系统通用成本组，历史命名保留。一个组的所有有效明细都会被消耗。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 成本明细行 Id。 |\n| `groupId` | int | 成本组 Id，供建筑等级、科技等引用。 |\n| `itemId` | int | 要消耗的 `item.id`。 |\n| `count` | int | 要消耗的数量。 |\n\n## 建筑\n\n### `world_building.xlsx`\n\n经营建筑主表，历史命名保留。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 建筑配置 Id。 |\n| `name` | string | 配置名或本地化回退名称。 |\n| `buildingType` | int | 建筑主类型，见 `BuildingType`。 |\n| `subType` | int | 主类型内细分；农田和矿的枚举不同。 |\n| `buildCategory` | int | 建造面板页签分类，见 `BuildCategory`。 |\n| `sortOrder` | int | 同一建造分类内排序，越小越靠前。 |\n| `sizeX` | int | 建筑占地 X 格数，非正数按 1。 |\n| `sizeZ` | int | 建筑占地 Z 格数，非正数按 1。 |\n| `prefabLocation` | string | 建筑 prefab 完整路径。 |\n| `iconLocation` | string | 建造 UI 图标完整路径。 |\n| `desc` | string | 描述或本地化回退文本。 |\n| `maxCount` | int | 当前地图允许建造的最大数量；非正数通常表示不限制。 |\n| `unlockHouseLevel` | int | 所需住宅最高等级；`<= 0` 表示无此要求。 |\n| `unlockBuildingId` | int | 前置建筑 Id。 |\n| `unlockBuildingLevel` | int | 前置建筑要求等级。 |\n| `enable` | bool | 是否启用。 |\n| `showInBuildPanel` | bool | 是否显示在建造面板。 |\n| `defaultUnlocked` | bool | 新档是否默认解锁；需与 `unlockSourceType = Default` 一致。 |\n| `unlockSourceType` | int | 解锁来源，见 `UnlockSourceType`。Tech 类型必须有科技节点指向该建筑。 |\n\n#### 枚举值\n\n| 字段 | 数值 | 名称 | 说明 |\n| --- | ---: | --- | --- |\n| `buildingType` | 0 | None | 未分类。 |\n| `buildingType` | 1 | House | 住宅。 |\n| `buildingType` | 2 | Warehouse | 仓库。 |\n| `buildingType` | 3 | Workbench | 工作台。 |\n| `buildingType` | 4 | CarpentryBench | 木工台。 |\n| `buildingType` | 5 | Furnace | 熔炉。 |\n| `buildingType` | 6 | Blacksmith | 铁匠台。 |\n| `buildingType` | 7 | Mill | 磨坊。 |\n| `buildingType` | 8 | FarmPlot | 农田。 |\n| `buildingType` | 9 | Mine | 矿场。 |\n| `buildCategory` | 0 | All | UI 查询全部分类使用。 |\n| `buildCategory` | 1 | Building | 基础建筑。 |\n| `buildCategory` | 2 | Production | 生产建筑。 |\n| `buildCategory` | 3 | Resource | 资源建筑。 |\n| `buildCategory` | 4 | Farm | 农业建筑。 |\n| `buildCategory` | 5 | Decoration | 装饰。 |\n| `buildCategory` | 6 | Special | 特殊建筑。 |\n| `unlockSourceType` | 0 | None | 未指定解锁来源。 |\n| `unlockSourceType` | 1 | Default | 新档默认解锁。 |\n| `unlockSourceType` | 2 | Tech | 由科技解锁。 |\n| `unlockSourceType` | 3 | Runtime | 由运行时业务解锁。 |\n| `subType`（FarmPlot） | 0 | None | 未分类农田。 |\n| `subType`（FarmPlot） | 1 | Crop | 作物田。 |\n| `subType`（FarmPlot） | 2 | Flower | 花田。 |\n| `subType`（FarmPlot） | 3 | Herb | 草药田。 |\n| `subType`（Mine） | 0 | None | 未分类矿场。 |\n| `subType`（Mine） | 1 | Stone | 石矿。 |\n| `subType`（Mine） | 2 | Copper | 铜矿。 |\n| `subType`（Mine） | 3 | Iron | 铁矿。 |\n\n### `world_building_level.xlsx`\n\n每个建筑每一级的成本和建造时间。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 等级配置行 Id。 |\n| `buildingId` | int | `world_building.id`。 |\n| `level` | int | 建筑等级，从 1 开始。 |\n| `buildCostGroupId` | int | 本级建造或升级消耗的 `world_cost.groupId`。 |\n| `buildSeconds` | int | 建造/升级完成等待秒数；`<= 0` 立即完成。 |\n| `enable` | bool | 是否启用该等级。 |\n\n### `world_building_income.xlsx`\n\n建筑按周期自动产出。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 产出配置行 Id。 |\n| `buildingId` | int | `world_building.id`。 |\n| `level` | int | 对应建筑等级。 |\n| `outputRewardGroupId` | int | 每周期发放的 `reward.groupId`。 |\n| `cycleSeconds` | int | 产出周期秒数，必须大于 0。 |\n| `enable` | bool | 是否启用该等级产出。 |\n\n## 科技\n\n### `tech_node.xlsx`\n\n科技树节点。**当前必须先修复 `Data/Defines/__root__.xml` 的 include 缺失，再把它视为可稳定重新生成的正式表。**\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 科技节点 Id。 |\n| `branch` | int | 科技分支，见 `TechBranch`。 |\n| `name` | string | 节点名称或本地化回退文本。 |\n| `iconLocation` | string | 科技图标完整路径。 |\n| `sortOrder` | int | 分支内排序。 |\n| `preTechId` | int | 前置科技 Id；`0` 表示没有。代码会沿此字段检查整条前置链。 |\n| `unlockBuildingId` | int | 研究后解锁的 `world_building.id`。 |\n| `unlockSystem` | string | 预留的系统解锁标识；当前科技业务未读取。 |\n| `costGroupId` | int | 研究消耗的 `world_cost.groupId`。 |\n| `desc` | string | 节点说明或本地化回退文本。 |\n| `enable` | bool | 是否启用。 |\n| `defaultUnlocked` | bool | 新档是否默认已研究/解锁。 |\n\n#### `branch` 枚举值\n\n| 数值 | 名称 | 说明 |\n| ---: | --- | --- |\n| 0 | None | 未分支。 |\n| 1 | Building | 建筑科技。 |\n| 2 | Farm | 农业科技。 |\n| 3 | Production | 生产科技。 |\n| 4 | Resource | 资源科技。 |\n| 5 | Special | 特殊科技。 |\n\n## 农田作物\n\n### `world_crop.xlsx`\n\n农田作物定义，历史命名保留。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 作物配置 Id。 |\n| `name` | string | 作物名称。 |\n| `seedItemId` | int | 播种使用的 `item.id`。 |\n| `seedCost` | int | 每个农田格播种消耗的种子数量。 |\n| `outputItemId` | int | 成熟后持续产出的 `item.id`。 |\n| `growSeconds` | int | 从播种到成熟的秒数。 |\n| `outputCountPerSecond` | int | 每格每秒产量，离线结算和每分钟 UI 都据此计算。 |\n| `plotColor` | string | 地块颜色字符串，支持 Unity 可解析的十六进制颜色。 |\n| `cropColor` | string | 作物表现颜色；未成熟时会与灰色混合。 |\n| `enable` | bool | 是否启用。 |\n\n## 蓝图\n\n### `blueprint.xlsx`\n\n制作/生产主表。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 蓝图 Id。 |\n| `name` | string | 蓝图名称。 |\n| `buildingId` | int | 所需生产建筑 Id；`0` 表示可直接制作。 |\n| `unlockTechId` | int | 所需已研究科技 Id；`0` 表示无要求。 |\n| `unlockQuestId` | int | 所需任务 Id；`0` 表示无要求。 |\n| `durationSeconds` | int | 设计上的制作时长；当前 `BlueprintManager.TryComplete` 为立即完成，字段尚未接入计时队列。 |\n| `enable` | bool | 是否启用。 |\n\n### `blueprint_item.xlsx`\n\n蓝图输入和输出明细。一张蓝图通常配置多条输入和至少一条输出。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 明细行 Id。 |\n| `blueprintId` | int | 所属 `blueprint.id`。 |\n| `itemKind` | int | 明细方向：当前代码按 `1 = Input`、`2 = Output` 解释。 |\n| `itemId` | int | 输入或输出的 `item.id`。 |\n| `count` | int | 输入消耗量或输出获得量。 |\n| `sortOrder` | int | UI/处理排序。 |\n| `enable` | bool | 是否启用该明细。 |\n\n## 任务\n\n### `quest.xlsx`\n\n任务主表。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | Quest Id。 |\n| `name` | string | 任务名或本地化回退文本。 |\n| `description` | string | 任务描述或本地化回退文本。 |\n| `questType` | string | 策划分类标签；当前核心状态机不按该字符串分支。 |\n| `rewardGroupId` | int | 领取时发放的 `reward.groupId`；`<= 0` 表示无奖励。 |\n| `preQuestId1` | int | 前置任务 1；`0` 表示空。 |\n| `preQuestId2` | int | 前置任务 2；`0` 表示空。 |\n| `preQuestId3` | int | 前置任务 3；`0` 表示空。 |\n| `acceptMode` | int | 接取方式，见 `QuestAcceptMode`。 |\n| `acceptEventType` | int | Event 接取时匹配的 `QuestEventType`。 |\n| `acceptTargetId` | int | Event 接取时匹配的事件目标 Id。 |\n| `autoAccept` | bool | 历史兼容字段；当前接取逻辑以 `acceptMode` 为主，新增配置不要只依赖此字段。 |\n| `enable` | bool | 是否启用任务。 |\n\n#### `acceptMode` 枚举值\n\n| 数值 | 名称 | 说明 |\n| ---: | --- | --- |\n| 0 | Auto | 前置满足后自动接取。 |\n| 1 | Manual | 由 UI、NPC 或任务板手动接取。 |\n| 2 | Event | 匹配 `acceptEventType` 和 `acceptTargetId` 后接取。 |\n\n### `quest_objective.xlsx`\n\n任务目标明细，一项任务可以有多个目标。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 目标明细行 Id。 |\n| `questId` | int | 所属 `quest.id`。 |\n| `objectiveId` | int | 任务内目标 Id，用于存档和事件进度定位；同一任务内应唯一。 |\n| `type` | int | 目标类型，见 `QuestObjectiveType`。 |\n| `targetId` | int | 目标对象 Id；按类型解释为物品、蓝图、建筑、科技、NPC、区域或 flag Id。 |\n| `targetCount` | int | 完成所需数量，通常至少为 1。 |\n| `text` | string | 目标显示文本或回退文本。 |\n| `sortOrder` | int | 任务详情中的目标排序。 |\n| `enable` | bool | 是否启用该目标。 |\n\n#### `type` 枚举值\n\n| 数值 | 名称 | 说明 |\n| ---: | --- | --- |\n| 0 | None | 无目标。 |\n| 1 | ItemCount | 当前持有物品数量。 |\n| 2 | ItemGainCount | 累计获得物品数量。 |\n| 3 | ItemUseCount | 累计实际使用物品次数。 |\n| 4 | Blueprint | 完成指定蓝图。 |\n| 5 | BuildBuilding | 建造指定建筑。 |\n| 6 | BuildBuildingType | 建造指定类型建筑。 |\n| 7 | UpgradeBuilding | 升级建筑。 |\n| 8 | FarmCount | 当前农田数量。 |\n| 9 | PlantCrop | 播种作物。 |\n| 10 | HarvestCrop | 收获作物。 |\n| 11 | TechResearched | 研究指定科技。 |\n| 12 | TalkNpc | 与指定 NPC 对话。 |\n| 13 | EnterArea | 进入指定区域。 |\n| 14 | CustomFlag | 收到自定义标记。 |\n\n#### Quest 事件值\n\n任务接取的 `acceptEventType` 和剧情完成事件共同使用以下数值：\n\n| 数值 | 名称 | 说明 |\n| ---: | --- | --- |\n| 0 | None | 无事件。 |\n| 1 | StartQuest | 开始指定任务。 |\n| 2 | CustomFlag | 自定义标记。 |\n| 3 | TalkNpc | 与 NPC 对话。 |\n| 4 | EnterArea | 进入区域。 |\n| 5 | UseItem | 物品效果或业务动作已成功完成。 |\n| 6 | GainItem | 获得物品。 |\n| 7 | BlueprintCompleted | 完成蓝图。 |\n| 8 | BuildBuilding | 建造建筑。 |\n| 9 | UpgradeBuilding | 升级建筑。 |\n| 10 | PlantCrop | 播种作物。 |\n| 11 | HarvestCrop | 收获作物。 |\n\n## 剧情\n\n### `story.xlsx`\n\n简单文字剧情主表。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | Story Id。 |\n| `title` | string | 剧情标题，当前直接显示。 |\n| `triggerMode` | int | 触发方式，见 `StoryTriggerMode`。 |\n| `triggerTargetId` | int | 触发目标；任务完成模式填 quest Id，事件模式填相应目标 Id。 |\n| `completeQuestEventType` | int | 剧情结束后发送给 Quest 的 `QuestEventType`；`0` 不发送。 |\n| `completeQuestTargetId` | int | 上述 Quest 事件的目标 Id。 |\n| `nextStoryId` | int | 完成后自动尝试播放的下一段 Story Id；`0` 表示没有。 |\n| `repeatable` | bool | 是否允许重复播放。 |\n| `enable` | bool | 是否启用。 |\n\n#### `triggerMode` 枚举值\n\n| 数值 | 名称 | 说明 |\n| ---: | --- | --- |\n| 0 | Manual | 由代码显式开始。 |\n| 1 | AutoOnNewGame | 新游戏加载地图后自动尝试播放。 |\n| 2 | QuestCompleted | 指定任务完成后触发。 |\n| 3 | CustomFlag | 自定义标记触发。 |\n| 4 | EnterArea | 进入区域触发。 |\n| 5 | TalkNpc | 与 NPC 对话触发。 |\n\n### `story_step.xlsx`\n\n剧情推进 Step。一个 Story 可以混排文本、静态插画、插画镜头运动和轻量引导。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | Step Id。 |\n| `storyId` | int | 所属 `story.id`。 |\n| `stepIndex` | int | 播放顺序，越小越先；相同时按 `id`。 |\n| `stepType` | int | `0=Text`、`1=Illustration`、`2=Mixed`、`3=Guide`。 |\n| `text` | string | 当前 Step 的剧情正文；插画或引导 Step 可留空。 |\n| `illustrationPath` | string | 静态剧情插画的 Texture2D 资源路径。 |\n| `motionPreset` | int | `0=None`、`1=ZoomOut`、`2=PanLeftToRight`、`3=PanRightToLeft`、`4=ZoomIn`。 |\n| `motionDuration` | float | 插画镜头运动时长，单位为秒。 |\n| `advanceMode` | int | `0=Click`、`1=MotionComplete`、`2=AutoAfterDelay`、`3=GuideTargetClicked`。 |\n| `autoAdvanceDelay` | float | 自动推进等待时间，单位为秒。 |\n| `guideTargetId` | string | 轻量引导目标的稳定 Id。 |\n| `guideText` | string | 引导提示文本。 |\n| `allowTargetInteraction` | bool | 引导时目标是否可以被点击。 |\n| `enable` | bool | 是否启用该 Step。 |\n\n## 塔防基地\n\n### `base.xlsx`\n\n塔防基地配置。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 基地配置 Id。 |\n| `name` | string | 基地名称。 |\n| `description` | string | 基地描述。 |\n| `hp` | int | 最大生命值，运行时至少按 1。 |\n| `defense` | int | 防御值，运行时至少按 0。 |\n| `prefabLocation` | string | 基地 prefab 完整路径。 |\n| `iconLocation` | string | 基地图标完整路径。 |\n| `hitEffect` | string | 受击特效资源标识/路径。 |\n| `deadEffect` | string | 摧毁特效资源标识/路径。 |\n| `enable` | bool | 是否启用。 |\n| `actionGroupId` | int | 点击基地后显示的目标操作组；`0` 表示没有操作。 |\n\n## 塔防关卡\n\n### `map.xlsx`\n\n塔防关卡入口配置。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 地图配置 Id，UI 和战斗流程使用。 |\n| `name` | string | 地图名或本地化回退文本。 |\n| `description` | string | 地图描述或本地化回退文本。 |\n| `mapId` | int | 地图 JSON 文件号，加载 `Assets/Data/Map/{mapId}.json`。 |\n| `initialGold` | int | 进入关卡时加入塔防临时背包的初始金币。 |\n| `baseId` | int | `base.id`。 |\n| `waveEasy` | string | 简单难度波次 `.bytes` 完整资源路径。 |\n| `waveNormal` | string | 普通难度波次 `.bytes` 完整资源路径；当前默认加载此字段。 |\n| `waveHard` | string | 困难难度波次 `.bytes` 完整资源路径。 |\n\n## 塔防单位\n\n### `npc.xlsx`\n\n塔防单位配置。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | NPC 配置 Id。 |\n| `name` | string | 名称。 |\n| `description` | string | 描述。 |\n| `kind` | int | 实体大类，塔防生成 NPC 要填 `GameEntityKind.Actor = 100`。 |\n| `actorType` | int | Actor 细分，敌人填 `ActorType.Enemy = 1`。 |\n| `prefabLocation` | string | 单位 prefab 完整路径。 |\n| `moveSpeed` | float | 每秒移动速度。 |\n| `damageToBase` | int | 对基地单次攻击伤害。 |\n| `modelScale` | float | 实例模型统一缩放；非正数通常回退为 1。 |\n| `attackRange` | float | 攻击目标判定距离。 |\n| `attackInterval` | float | 两次攻击之间的秒数。 |\n| `maxHp` | int | 最大生命值。 |\n| `rewardGold` | int | 击杀后直接加入塔防金币的数量。 |\n| `actionGroupId` | int | 点击 NPC 后显示的目标操作组；`0` 表示没有操作。 |\n\n#### 枚举值\n\n| 字段 | 数值 | 名称 | 说明 |\n| --- | ---: | --- | --- |\n| `kind` | 0 | None | 未分类实体。 |\n| `kind` | 100 | Actor | 角色实体；塔防 NPC 应使用此值。 |\n| `kind` | 200 | Structure | 建筑实体。 |\n| `kind` | 300 | Prop | 场景道具。 |\n| `kind` | 400 | ItemDrop | 物品掉落。 |\n| `kind` | 500 | Projectile | 投射物。 |\n| `kind` | 600 | AreaObject | 区域对象。 |\n| `kind` | 700 | ResourceNode | 资源节点。 |\n| `actorType` | 0 | None | 未分类角色。 |\n| `actorType` | 1 | Enemy | 敌人。 |\n| `actorType` | 2 | Hero | 英雄。 |\n| `actorType` | 3 | Worker | 工人。 |\n| `actorType` | 4 | Merchant | 商人。 |\n| `actorType` | 5 | QuestNpc | 任务 NPC。 |\n| `actorType` | 6 | TrialNpc | 试炼 NPC。 |\n| `actorType` | 7 | Resident | 居民。 |\n\n### `npc_drop.xlsx`\n\nNPC 死亡物品掉落。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 掉落明细行 Id。 |\n| `npcId` | int | 所属 `npc.id`。 |\n| `itemId` | int | 掉落的 `item.id`。 |\n| `minCount` | int | 掉落数量下限，包含该值。 |\n| `maxCount` | int | 掉落数量上限，包含该值。 |\n| `chancePermyriad` | int | 万分比概率，`10000 = 100%`。 |\n\n## 防御塔\n\n### `tower.xlsx`\n\n防御塔主表。名称、类型、图标仍来自本表；战斗数值和 prefab 应优先配置在 `tower_level.xlsx`。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 防御塔 Id。 |\n| `name` | string | 名称或本地化回退文本。 |\n| `description` | string | 描述或本地化回退文本。 |\n| `towerType` | int | 塔类别，见 `TowerType`。 |\n| `prefabLocation` | string | 旧版主表 prefab；当前建造优先使用等级表。 |\n| `costItemId` | int | 旧版建造消耗物品；当前建造优先使用等级表。 |\n| `costCount` | int | 旧版建造数量；UI 在等级配置缺失时可能回退使用。 |\n| `range` | float | 旧版攻击范围；当前战斗使用等级表。 |\n| `damage` | int | 旧版攻击伤害；当前战斗使用等级表。 |\n| `attackInterval` | float | 旧版攻击间隔；当前战斗使用等级表。 |\n| `unlockLevel` | int | 解锁等级预留/旧逻辑字段。 |\n| `enable` | bool | 是否在建造列表和流程中启用。 |\n| `attackEffect` | string | 旧版攻击特效；当前战斗使用等级表。 |\n| `hitEffect` | string | 旧版命中特效；当前战斗使用等级表。 |\n| `upgradeCost` | int | 旧版升级成本；当前升级使用等级表。 |\n| `SellGoldRate` | float | 旧版出售返还比例；字段首字母大写是当前 schema 的历史格式。 |\n| `canUpgrade` | bool | 是否允许升级；运行时还要求 `tower_level.xlsx` 存在下一级。 |\n| `iconLocation` | string | 防御塔 UI 图标完整路径。 |\n| `actionGroupId` | int | 点击塔后显示的目标操作组；`0` 表示没有操作，当前塔统一使用 `100`。 |\n\n#### `towerType` 枚举值\n\n| 数值 | 名称 | 说明 |\n| ---: | --- | --- |\n| 0 | Normal | 普通塔。 |\n| 1 | Arrow | 箭塔。 |\n| 2 | Cannon | 炮塔。 |\n| 3 | Ice | 冰塔。 |\n\n当前 Excel 中存在 `towerType = 4`，它不在代码枚举中，属于待修正配置。\n\n### `tower_level.xlsx`\n\n防御塔逐级数值，是当前建造、攻击、升级、出售的主要数据源。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 等级配置行 Id。 |\n| `towerId` | int | 所属 `tower.id`。 |\n| `level` | int | 塔等级，从 1 开始。 |\n| `prefabLocation` | string | 本等级 prefab 完整路径。升级时路径变化会替换实例。 |\n| `costItemId` | int | 本等级建造消耗物品；非正数回退金币。 |\n| `buildCost` | int | 建造 1 级塔的消耗数量。 |\n| `upgradeCostItemId` | int | 升到本等级的消耗物品；非正数回退金币，当前升级流程已读取。 |\n| `upgradeCost` | int | 从上一级升到本级的成本。 |\n| `sellGoldRate` | float | 出售时按累计成本返还的比例，例如 `0.7`。 |\n| `range` | float | 攻击范围。 |\n| `damage` | int | 每次普通攻击伤害。 |\n| `attackInterval` | float | 普攻间隔秒数。 |\n| `attackEffect` | string | 投射物/攻击特效资源标识或路径。 |\n| `hitEffect` | string | 命中特效资源标识或路径。 |\n| `skillId` | int | 本等级使用的 `skill.id`；`0` 表示只普通攻击。 |\n| `enable` | bool | 是否启用该等级。 |\n\n### `battle_target_action.xlsx`\n\n目标信息面板的通用操作组。目标主表只引用 `groupId`，动作是否最终显示还会经过对应动作处理器的实时条件判断。该表不保存升级价格、出售金额等业务数值。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 动作配置行 Id。 |\n| `groupId` | int | 操作组 Id；同组动作会按顺序显示。 |\n| `actionType` | int | 动作类型，见下表。 |\n| `name` | string | 动作名称，主要用于策划识别和调试。 |\n| `iconLocation` | string | 按钮图标完整资源路径。 |\n| `sortOrder` | int | 显示顺序，越小越靠前；相同时按 `id`。 |\n| `enable` | bool | 是否启用该动作行。 |\n\n| `actionType` | 名称 | 运行时条件与数据来源 |\n| ---: | --- | --- |\n| 1 | UpgradeTower | 目标必须是塔，`tower.canUpgrade = true`，且存在下一级；费用读取下一级 `upgradeCostItemId/upgradeCost`。 |\n| 2 | SellTower | 目标必须是塔，且当前等级 `sellGoldRate > 0`；返还值按累计建造/升级成本实时计算。 |\n\n## 塔防波次\n\n### `wave.xlsx` / `Wave/wave1.xlsx`\n\n根 `wave.xlsx` 会随主 `Tables` 生成，但 `DataManager.Initialize` 随后把 `Wave` 置空，当前战斗不会使用它。`Wave/wave1.xlsx` 这类文件才是按 `map.wave*` 完整路径独立加载的实际关卡波次数据。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 波次行 Id，也决定行顺序。 |\n| `npcConfigId` | int | 本行生成的 `npc.id`。 |\n| `count` | int | 生成数量。 |\n| `interval` | float | 同一行相邻单位生成间隔秒数。 |\n| `startDelay` | float | 开始该行前等待秒数。 |\n| `spawnMode` | int | 出生点选择方式，见 `WaveSpawnMode`。 |\n| `description` | string | 策划备注/波次描述，不参与生成逻辑。 |\n\n#### `spawnMode` 枚举值\n\n| 数值 | 名称 | 说明 |\n| ---: | --- | --- |\n| 0 | None | 未指定；运行时回退到第一个出生点。 |\n| 1 | FirstSpawnPoint | 使用第一个出生点。 |\n| 2 | RandomSpawnPoint | 每次随机选择出生点。 |\n\n## Skill 兼容配置\n\n当前塔防业务实际通过 `AbilityConfigConverter` 把这些 Skill 表转换成 Ability 运行时定义。`skill_luban_excels_fixed` 下同名文件不是正式输入。\n\n### `skill.xlsx`\n\n当前可运行的塔防技能主表，加载后转换为 Ability 运行时定义。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | Skill Id，由 `tower_level.skillId` 等引用。 |\n| `name` | string | 名称或本地化回退文本。 |\n| `description` | string | 描述或本地化回退文本。 |\n| `iconLocation` | string | 技能图标完整路径。 |\n| `behavior` | int | 位标记：1 NoTarget、2 UnitTarget、4 PointTarget、8 Passive、16 Toggle、32 Channel、64 Aoe，可相加。 |\n| `targetTeam` | int | 目标阵营：0 None、1 Friendly、2 Enemy、3 Both。 |\n| `castRange` | float | 施法距离。 |\n| `aoeRadius` | float | 范围半径。 |\n| `castPoint` | float | 前摇秒数。 |\n| `channelTime` | float | 持续施法秒数。 |\n| `cooldown` | float | 冷却秒数。 |\n| `costResourceId` | int | 消耗资源/物品 Id；技能 UI 用它查可释放次数。 |\n| `costCount` | int | 单次消耗数量，也映射为 Ability 的 ManaCost。 |\n| `abilityActionGroupId` | int | 释放时执行的 `skill_action.groupId`。 |\n| `intrinsicModifierId` | int | 常驻被动 `skill_modifier.id`；`0` 表示无。 |\n| `enable` | bool | 是否启用。 |\n\n### `skill_action.xlsx`\n\n定义技能和 Modifier 回调执行的动作组。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 动作行 Id。 |\n| `groupId` | int | 动作组 Id，一次技能或 Modifier 回调可执行组内多行。 |\n| `order` | int | 组内执行顺序，相同时按 `id`。 |\n| `actionType` | int | 0 None、1 Damage、2 Heal、3 ApplyModifier、4 FireEvent；当前 FireEvent 未映射为有效动作。 |\n| `targetType` | int | 0 None、1 Caster、2 Unit、3 Point、4 Area、5 CurrentTargets。 |\n| `value` | float | 伤害、治疗等动作主数值。 |\n| `radius` | float | 设计范围半径；当前兼容转换器没有读取。 |\n| `duration` | float | 添加 Modifier 时的覆盖持续时间；0 当前按未指定处理。 |\n| `modifierId` | int | 要添加的 `skill_modifier.id`。 |\n| `damageType` | int | 0 None、1 Physical、2 Magical、3 Pure。 |\n| `effectLocation` | string | 动作完成时自动播放的一次性特效路径；同一动作组不要在多行重复填写相同路径。没有逻辑动作时可单独转成播放特效。 |\n| `soundLocation` | string | 动作音效路径；没有逻辑动作时可单独转成播放音效。 |\n\n### `skill_modifier.xlsx`\n\n定义 Buff、Debuff、周期效果、属性修改和单位状态。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | Modifier Id。 |\n| `name` | string | 配置名或本地化回退名。 |\n| `modifierType` | int | 0 None、1 Property、2 Periodic、3 State、4 Aura；当前转换主要依赖具体字段。 |\n| `isDebuff` | bool | 是否负面效果。 |\n| `isHidden` | bool | 是否在 Modifier UI 中隐藏。 |\n| `isPurgable` | bool | 是否可驱散。 |\n| `removeOnDeath` | bool | 单位死亡时是否移除。 |\n| `duration` | float | 默认持续秒数。 |\n| `interval` | float | 周期触发间隔秒数。 |\n| `maxStack` | int | 最大层数；非正数在转换时按 1。 |\n| `propertyType` | int | 属性类型，具体值见 `skill_system_enum.xlsx` 的 `SkillModifierPropertyType`。 |\n| `propertyValue` | float | 属性修改值。百分比字段按 Ability 运行时约定解释。 |\n| `state` | int | 单位状态：0 None、1 Stunned、2 Silenced、3 Rooted、4 Invulnerable。 |\n| `triggerEventType` | int | 触发事件，见枚举表 `SkillTriggerEventType`。 |\n| `triggerActionGroupId` | int | 事件触发时执行的 `skill_action.groupId`。 |\n| `periodicActionGroupId` | int | 每个 interval 执行的动作组。 |\n| `onCreatedActionGroupId` | int | Modifier 创建时执行的动作组。 |\n| `onDestroyActionGroupId` | int | Modifier 销毁时执行的动作组。 |\n| `effectLocation` | string | Modifier 持续表现特效路径；转换为 `SustainedEffectName`，由 Modifier 持有可停止表现句柄，并在 Modifier 移除、对象注销或战斗清理时停止。不会转换成一次性 `OnCreated PlayEffect`。 |\n\n### `skill_system_enum.xlsx`\n\nSkill 配表枚举说明表，本身主要供人和工具查值，运行时转换器仍使用显式数字映射。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 枚举说明行 Id。 |\n| `group` | string | 枚举组名，例如 `SkillActionType`。 |\n| `name` | string | 枚举项名称。 |\n| `value` | int | Excel 实际填写的整数值；位标记组可按位组合。 |\n| `description` | string | 枚举项说明。 |\n\n## Ability 新配置\n\n这 7 张表是更完整的 Ability 数据模型，但当前 Excel/JSON 为空，业务侧也没有读取这些配置建立运行时定义。现阶段新增可用塔防技能仍应先走 `skill*.xlsx`；不要因为表已经生成就认为 Ability Excel 链路已完成。\n\n字符串数值字段用于表达逐等级值或特殊值引用，格式必须与未来 Ability 配置转换器约定一致；当前没有已接入的解析流程可作为稳定格式保证。\n\n### `AbilityConfig.xlsx`\n\n新 Ability 数据模型的技能主表；当前尚未接入业务转换。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | Ability Id。 |\n| `name` | string | 内部唯一名。 |\n| `displayName` | string | 显示名称或本地化标识。 |\n| `description` | string | 描述或本地化标识。 |\n| `icon` | string | 图标资源路径。 |\n| `maxLevel` | int | 最大等级。 |\n| `behavior` | int | Ability 行为位标记。 |\n| `targetTeam` | int | 可选目标阵营。 |\n| `targetType` | int | 可选目标单位类型。 |\n| `targetFlags` | int | 额外目标过滤位标记。 |\n| `castRange` | string | 各等级施法距离。 |\n| `aoeRadius` | string | 各等级范围半径。 |\n| `castPoint` | string | 各等级前摇秒数。 |\n| `castBackswing` | string | 各等级后摇秒数。 |\n| `channelTime` | string | 各等级持续施法秒数。 |\n| `cooldown` | string | 各等级冷却秒数。 |\n| `manaCost` | string | 各等级资源消耗。 |\n| `maxCharges` | int | 最大充能数。 |\n| `chargeRestoreTime` | float | 单次充能恢复秒数。 |\n| `startFullCharges` | bool | 初始是否满充能。 |\n| `chargeUsesCooldown` | bool | 充能恢复是否复用冷却规则。 |\n| `actionGroupId` | int | 释放时执行的 `AbilityAction.groupId`。 |\n| `intrinsicModifierId` | int | 常驻 `AbilityModifier.id`。 |\n| `scriptName` | string | 自定义脚本扩展名。 |\n| `enable` | bool | 是否启用。 |\n\n### `AbilityAction.xlsx`\n\n新 Ability 数据模型的动作组明细；当前尚未接入业务转换。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 动作行 Id。 |\n| `groupId` | int | 动作组 Id。 |\n| `order` | int | 组内执行顺序。 |\n| `actionType` | int | 动作类型。 |\n| `target` | int | 动作目标来源。 |\n| `value` | string | 各等级主数值。 |\n| `valueSpecialName` | string | 主数值引用的 `AbilitySpecialValue.name`。 |\n| `duration` | string | 各等级持续时间。 |\n| `durationSpecialName` | string | 持续时间引用的特殊值名称。 |\n| `damageType` | int | 伤害类型。 |\n| `damageFlags` | int | 伤害额外标记。 |\n| `modifierId` | int | 要添加/移除的 `AbilityModifier.id`。 |\n| `projectileId` | int | 要创建的 `AbilityProjectile.id`。 |\n| `purgePositiveBuffs` | bool | 驱散动作是否移除正面 Buff。 |\n| `purgeDebuffs` | bool | 驱散动作是否移除 Debuff。 |\n| `purgeOnlyPurgable` | bool | 是否只移除标记为可驱散的 Modifier。 |\n| `effectName` | string | 表现特效资源名/路径。 |\n| `soundName` | string | 音效资源名/路径。 |\n\n### `AbilityModifier.xlsx`\n\n新 Ability 数据模型的 Modifier 主表；当前尚未接入业务转换。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | Modifier Id。 |\n| `name` | string | 内部唯一名。 |\n| `displayName` | string | 显示名称。 |\n| `isHidden` | bool | 是否在 UI 中隐藏。 |\n| `isDebuff` | bool | 是否为负面效果。 |\n| `isPurgable` | bool | 是否可驱散。 |\n| `removeOnDeath` | bool | 死亡时是否移除。 |\n| `duration` | float | 默认持续秒数。 |\n| `interval` | float | 周期触发间隔秒数。 |\n| `maxStack` | int | 最大叠加层数。 |\n| `attributes` | int | Modifier 属性位标记。 |\n| `states` | int | 施加的单位状态位标记。 |\n| `propertyGroupId` | int | `AbilityModifierProperty.groupId`。 |\n| `onCreatedActionGroupId` | int | 创建时动作组。 |\n| `onRefreshActionGroupId` | int | 刷新/叠层时动作组。 |\n| `onDestroyActionGroupId` | int | 销毁时动作组。 |\n| `intervalActionGroupId` | int | 周期动作组。 |\n| `triggerEventType` | int | 监听的战斗事件类型。 |\n| `triggerActionGroupId` | int | 事件触发动作组。 |\n| `auraModifierId` | int | 光环向目标施加的 Modifier Id。 |\n| `auraRadius` | float | 光环半径。 |\n| `auraDuration` | float | 光环子 Modifier 持续时间。 |\n| `auraThinkInterval` | float | 光环扫描间隔。 |\n| `auraTargetTeam` | int | 光环目标阵营。 |\n| `auraTargetType` | int | 光环目标类型。 |\n| `auraTargetFlags` | int | 光环额外过滤标记。 |\n| `scriptName` | string | 自定义脚本扩展名。 |\n\n### `AbilityModifierProperty.xlsx`\n\n把多条属性修改组成 Modifier 可引用的属性组；当前尚未接入业务转换。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 属性明细行 Id。 |\n| `groupId` | int | 属性组 Id，由 `AbilityModifier.propertyGroupId` 引用。 |\n| `property` | int | 要修改的属性枚举值。 |\n| `value` | string | 各等级属性修改值。 |\n\n### `AbilityProjectile.xlsx`\n\n新 Ability 数据模型的投射物参数；当前尚未接入业务转换。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 投射物 Id。 |\n| `name` | string | 内部名称。 |\n| `speed` | float | 飞行速度。 |\n| `radius` | float | 碰撞/命中半径。 |\n| `distance` | float | 最大飞行距离。 |\n| `deleteOnHit` | bool | 首次命中后是否销毁。 |\n| `providesVision` | bool | 是否提供视野。 |\n| `visionRadius` | float | 视野半径。 |\n| `targetTeam` | int | 可命中阵营。 |\n| `targetType` | int | 可命中单位类型。 |\n| `targetFlags` | int | 额外目标过滤标记。 |\n| `effectName` | string | 投射物特效资源名/路径。 |\n| `soundName` | string | 飞行/创建音效资源名/路径。 |\n\n### `AbilitySpecialValue.xlsx`\n\n保存 Ability 可按名称引用的逐等级特殊数值；当前尚未接入业务转换。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 特殊值行 Id。 |\n| `abilityId` | int | 所属 `AbilityConfig.id`。 |\n| `name` | string | 特殊值名称，供 Action 等按名引用。 |\n| `values` | string | 各等级数值序列。 |\n\n### `AbilitySystemEnum.xlsx`\n\n新 Ability 配表使用的枚举说明表；当前数据为空。\n\n| 字段 | 类型 | 含义 |\n| --- | --- | --- |\n| `id` | int | 枚举说明行 Id。 |\n| `group` | string | 枚举组名。 |\n| `name` | string | 枚举项名称。 |\n| `value` | int | Excel 中实际填写的数值。 |\n| `description` | string | 枚举项说明。 |\n\n## 配表关系速查\n\n| 分类 | 来源字段 | 关联目标 |\n| --- | --- | --- |\n| 地图资源与采集 | `resource.gatherConfigId` | `gather.id` |\n|  | `gather.rewardGroupId` | `reward.groupId` → `item.id` |\n|  | `resource.pickupRewardGroupId` | `reward.groupId` → `item.id` |\n|  | `resource.mineBuildingId` | `world_building.id` |\n| 建筑与科技 | `world_building.id` | `world_building_level.buildingId` |\n|  | `world_building.id` | `world_building_income.buildingId` |\n|  | `world_building_level.buildCostGroupId` | `world_cost.groupId` → `item.id` |\n|  | `tech_node.costGroupId` | `world_cost.groupId` |\n|  | `tech_node.unlockBuildingId` | `world_building.id` |\n| 蓝图、任务与剧情 | `blueprint.id` | `blueprint_item.blueprintId` → `item.id` |\n|  | `quest.id` | `quest_objective.questId` |\n|  | `quest.rewardGroupId` | `reward.groupId` |\n|  | `story.id` | `story_step.storyId` |\n| 塔防与技能 | `map.baseId` | `base.id` |\n|  | `wave.npcConfigId` | `npc.id` |\n|  | `npc.id` | `npc_drop.npcId` → `item.id` |\n|  | `tower.id` | `tower_level.towerId` |\n|  | `tower.actionGroupId` / `npc.actionGroupId` / `base.actionGroupId` | `battle_target_action.groupId` |\n|  | `tower_level.skillId` | `skill.id` |\n|  | `skill.abilityActionGroupId` | `skill_action.groupId` |\n|  | `skill.intrinsicModifierId` | `skill_modifier.id` |\n\n## 当前配置风险\n\n1. `tech_node.xml` 未被根 schema include，完整重新生成存在删除科技表产物的风险。\n2. `reward.weight` 当前未实现，所有同组奖励行都会发放，不能配置权重池。\n3. `item.maxStack` 和 `storage_capacity.xlsx` 当前没有落实到背包/仓库容量逻辑。\n4. `item.xlsx` 没有“使用动作/效果/消耗数量”字段，普通 Consumable 仍无法仅靠配表使用。\n5. `tower.xlsx` 与 `tower_level.xlsx` 有重复战斗字段，当前应以等级表为准，长期应收敛旧字段。\n6. Ability 新表目前为空且未接业务转换；Skill 表才是当前可运行输入。\n7. `skill_luban_excels_fixed` 是重复副本，容易被误改；确认无需保留后应移出正式数据目录或明确归档。\n8. 当前 `tower.xlsx` 存在 `towerType = 4`，但代码 `TowerType` 只定义到 `3 Ice`；应补枚举或改回合法值。\n9. 根 `wave.xlsx` 当前生成但不被战斗加载，继续保留会让策划误以为修改它能改变关卡波次。\n"
